ty","prov":"T","status":"Corrected to the exact opening two lines of FitzGerald's First Edition quatrain LI in Project Gutenberg.","desc":"A sourced line concerning time, irreversibility, drawn from Rubáiyát.","verification":"verified","source_url":"https://www.gutenberg.org/files/246/246-h/246-h.htm","explanation":"FitzGerald's quatrain makes the past irreversible: neither piety, cleverness, nor tears can cancel what has already been written. The 'Moving Finger' is an image of time or fate proceeding beyond human revision."},{"id":"Q0104","person":"William of Ockham","quote":"Plurality must never be posited without necessity.","source":"Commentary on Sentences","era":"Medieval","tags":"parsimony; reasoning","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning parsimony, reasoning, drawn from Commentary on Sentences.","verification":"pending"},{"id":"Q0105","person":"Thomas Aquinas","quote":"it is better to enlighten than merely to shine,","source":"Thomas Aquinas, Summa Theologiae II-II, q.188, a.6","era":"Medieval","tags":"teaching; knowledge","prov":"T","status":"Corrected to the exact English wording in the New Advent Summa Theologiae.","desc":"A sourced line concerning teaching, knowledge, drawn from Summa Theologiae II-II.","verification":"verified","source_url":"https://www.newadvent.org/summa/3188.htm","explanation":"Aquinas ranks teaching above solitary possession of insight when teaching flows from genuine contemplation. Knowledge reaches a higher form of usefulness when it illuminates other minds rather than remaining private brilliance."},{"id":"Q0106","person":"Dante","quote":"All hope abandon, ye who enter in!","source":"Dante, Inferno III.9, Henry Wadsworth Longfellow translation","era":"Medieval","tags":"cultural reference; despair","prov":"T","status":"Corrected to Henry Wadsworth Longfellow's exact 1867 translation of Inferno III.9.","desc":"A sourced line concerning cultural reference, despair, drawn from Inferno III.","verification":"verified","source_url":"https://en.wikisource.org/wiki/Divine_Comedy_%28Longfellow_1867%29/Volume_1/Canto_3","explanation":"The inscription over Hell's gate announces a condition in which future improvement has disappeared. Its force comes from locating despair not merely in suffering but in the permanent closure of alternatives."},{"id":"Q0107","person":"Dante","quote":"Ye were not made to live like unto brutes, But for pursuit of virtue and of knowledge.","source":"Inferno XXVI.119–120, Longfellow translation","era":"Medieval","tags":"knowledge; aspiration","prov":"T","status":"Verified against Henry Wadsworth Longfellow's 1867 translation, Inferno XXVI.119–120.","desc":"A sourced line concerning knowledge, aspiration, drawn from Inferno XXVI.","verification":"verified","source_url":"https://en.wikisource.org/wiki/Divine_Comedy_%28Longfellow_1867%29/Volume_1/Canto_26","explanation":"Ulysses urges his exhausted companions beyond the known world by appealing to a distinctively human vocation toward virtue and knowledge. The tragedy of the canto complicates the maxim: intellectual aspiration can become transgressive when severed from prudence and legitimate limits."},{"id":"Q0108","person":"Ibn Khaldun","quote":"Man is the child of customs, not the child of his ancestors.","source":"Muqaddimah","era":"Medieval / Early Modern","tags":"culture; institutions","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning culture, institutions, drawn from Muqaddimah.","verification":"pending"},{"id":"Q0109","person":"Chaucer","quote":"The lyf so short, the craft so long to lerne,","source":"Geoffrey Chaucer, The Parlement of Foules, line 1, Skeat edition","era":"Medieval","tags":"mastery; mortality","prov":"T","status":"Corrected from modernized spelling to the exact opening line in Skeat's edition on Wikisource.","desc":"A sourced line concerning mastery, mortality, drawn from Parliament of Fowls.","verification":"verified","source_url":"https://en.wikisource.org/wiki/Chaucer%27s_Works_%28ed._Skeat%29_Vol._I/V","explanation":"Chaucer opens with the mismatch between finite life and the long apprenticeship required by a craft—in context, the difficult craft of love. The line became broadly useful because the structure applies to any field whose mastery exceeds the time available to a learner."},{"id":"Q0110","person":"Thomas à Kempis","quote":"man, indeed, proposes but God disposes,","source":"Thomas à Kempis, The Imitation of Christ I.19","era":"Medieval","tags":"planning; uncertainty","prov":"T","status":"Corrected to the exact clause in the CCEL English text of The Imitation of Christ I.19.","desc":"A sourced line concerning planning, uncertainty, drawn from Imitation of Christ.","verification":"verified","source_url":"https://www.ccel.org/ccel/kempis/imitation.ONE.19.html","explanation":"The sentence appears in a discussion of resolutions and dependence on grace. Planning remains necessary, but confidence in plans is limited by conditions and outcomes beyond the planner's control."},{"id":"Q0111","person":"Erasmus","quote":"In the country of the blind, the one-eyed man is king.","source":"Adagia","era":"Renaissance","tags":"relative advantage","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning relative advantage, drawn from Adagia.","verification":"pending"},{"id":"Q0112","person":"Niccolò Machiavelli","quote":"It is much safer to be feared than loved.","source":"The Prince XVII","era":"Renaissance","tags":"power; incentives","prov":"T","status":"Verified against W. K. Marriott translation, The Prince XVII.","desc":"A sourced line concerning power, incentives, drawn from The Prince XVII.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/1232/pg1232-images.html","explanation":"Machiavelli's actual argument is conditional: ideally a ruler would be both loved and feared, but when the two cannot coexist securely, fear is more dependable because it rests on expected consequences rather than gratitude."},{"id":"Q0113","person":"Niccolò Machiavelli","quote":"Every one sees what you appear to be, few really know what you are.","source":"The Prince XVIII","era":"Renaissance","tags":"signaling; reputation","prov":"T","status":"Corrected to exact W. K. Marriott translation, The Prince XVIII.","desc":"A sourced line concerning signaling, reputation, drawn from The Prince XVIII.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/1232/pg1232-images.html","explanation":"Political judgment is usually made from visible signals rather than intimate knowledge. Machiavelli is analyzing an asymmetry of information: reputation is public and scalable, while direct knowledge of character is rare."},{"id":"Q0114","person":"Niccolò Machiavelli","quote":"Men ought either to be well treated or crushed.","source":"The Prince III","era":"Renaissance","tags":"power; retaliation","prov":"T","status":"Verified against The Prince III in the Library of Congress translation display.","desc":"A sourced line concerning power, retaliation, drawn from The Prince III.","verification":"verified","source_url":"https://loc.gov/exhibits/thomas-jeffersons-library/interactives/opere-di-machiavelli/index.html","explanation":"Machiavelli's severe formulation concerns retaliation and incomplete coercion: a small injury can leave an opponent able and motivated to avenge it. The point is strategic commitment, not a general moral endorsement of cruelty."},{"id":"Q0115","person":"Michel de Montaigne","quote":"What do I know?","source":"Essays / motto","era":"Renaissance","tags":"skepticism; inquiry","prov":"T","status":"Verified as the standard English rendering of Montaigne's personal motto Que sçay-je?, documented by the University of Virginia Library.","desc":"A sourced line concerning skepticism, inquiry, drawn from Essays / motto.","verification":"verified","source_url":"https://explore.lib.virginia.edu/exhibits/show/renaissance-in-print/literaryworks/montaigne1","explanation":"Montaigne makes uncertainty a method rather than an embarrassment. The question interrupts premature certainty and turns inquiry back on the confidence of the person making the judgment."},{"id":"Q0116","person":"Michel de Montaigne","quote":"My trade and art is to live.","source":"Essays","era":"Renaissance","tags":"life; practice","prov":"T","status":"Verified against Charles Cotton's translation of Montaigne's Essays on Project Gutenberg.","desc":"A sourced line concerning life, practice, drawn from Essays.","verification":"verified","source_url":"https://www.gutenberg.org/files/3600/3600-h/3600-h","explanation":"Montaigne makes lived experience the central material of his inquiry. Philosophy is not only a doctrine to possess but an art practiced in the conduct, perception, and examination of one's own life."},{"id":"Q0117","person":"Miguel de Cervantes","quote":"there is no book so bad but it has something good in it.","source":"Miguel de Cervantes, Don Quixote, Part II, Chapter 59, John Ormsby translation","era":"Early Modern","tags":"reading; discrimination","prov":"T","status":"Verified in Project Gutenberg's John Ormsby translation of Don Quixote Part II.","desc":"A sourced line concerning reading, discrimination, drawn from Don Quixote II.","verification":"verified","source_url":"https://www.gutenberg.org/files/5938/5938-h/5938-h.htm","explanation":"The remark recommends discriminating reading rather than binary judgment. Even a flawed work can contain an observation, image, or argument worth extracting without requiring approval of the whole book."},{"id":"Q0118","person":"Francis Bacon","quote":"knowledge itself is a power","source":"Francis Bacon, Meditationes Sacrae, 'Of Heresies'","era":"Early Modern","tags":"knowledge; capability","prov":"T","status":"Verified as an exact English excerpt from the published translation of Bacon's Meditationes Sacrae; the Latin is 'Nam et ipsa scientia potestas est.'","desc":"A sourced line concerning knowledge, capability, drawn from Meditationes Sacrae.","verification":"verified","source_url":"https://en.wikisource.org/wiki/The_Works_of_Francis_Bacon/Volume_1/Meditationes_Sacrae","explanation":"Bacon's phrase occurs in a theological discussion of God's knowledge and power, although it later became a general maxim about the practical force of knowledge. The famous slogan is therefore genuine in origin but broader in later usage than in its immediate context."},{"id":"Q0119","person":"Francis Bacon","quote":"Reading maketh a full man; conference a ready man; and writing an exact man.","source":"Of Studies","era":"Early Modern","tags":"learning; writing","prov":"T","status":"Verified against Bacon's Essays (Project Gutenberg).","desc":"A sourced line concerning learning, writing, drawn from Of Studies.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/56463/pg56463-images.html","explanation":"Bacon distinguishes three complementary forms of intellectual training: reading supplies material, conversation develops readiness, and writing forces precision. The line works as a compact theory of how different cognitive practices produce different strengths."},{"id":"Q0120","person":"Francis Bacon","quote":"Some books are to be tasted, others to be swallowed, and some few to be chewed and digested.","source":"Of Studies","era":"Early Modern","tags":"reading; learning","prov":"T","status":"Verified against Bacon's Essays (Project Gutenberg).","desc":"A sourced line concerning reading, learning, drawn from Of Studies.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/56463/pg56463-images.html","explanation":"Bacon argues that books deserve different depths of engagement. The point is not to read everything equally, but to allocate attention according to the importance and density of the work."},{"id":"Q0121","person":"William Shakespeare","quote":"To be, or not to be: that is the question.","source":"Hamlet III.1","era":"Early Modern","tags":"existence; cultural reference","prov":"T","status":"Verified against Folger Shakespeare, Hamlet 3.1.","desc":"A sourced line concerning existence, cultural reference, drawn from Hamlet III.1.","verification":"verified","source_url":"https://www.folger.edu/explore/shakespeares-works/hamlet/read/3/1/","explanation":"Hamlet frames existence itself as a problem to be reasoned about: whether suffering should be endured or escaped, and what uncertainty about death does to that calculation. Its fame comes partly from compressing an existential problem into an almost mathematical question."},{"id":"Q0122","person":"William Shakespeare","quote":"Brevity is the soul of wit.","source":"Hamlet II.2","era":"Early Modern","tags":"wit; compression","prov":"T","status":"Verified against Folger Shakespeare, Hamlet 2.2.","desc":"A sourced line concerning wit, compression, drawn from Hamlet II.2.","verification":"verified","source_url":"https://www.folger.edu/explore/shakespeares-works/hamlet/read/","explanation":"Polonius announces the virtue of concision while speaking at length, so the sentence is both a maxim and a joke at the speaker's expense. It survives because the proposition remains useful even while the scene ironizes it."},{"id":"Q0123","person":"William Shakespeare","quote":"There is nothing either good or bad, but thinking makes it so.","source":"Hamlet II.2","era":"Early Modern","tags":"appraisal; perception","prov":"T","status":"Verified against Folger Shakespeare, Hamlet 2.2.","desc":"A sourced line concerning appraisal, perception, drawn from Hamlet II.2.","verification":"verified","source_url":"https://www.folger.edu/explore/shakespeares-works/hamlet/read/","explanation":"Hamlet is not claiming that every moral distinction is imaginary; in context he is describing how appraisal changes experience. The line is useful for thinking about framing, interpretation, and the difference between events and the mind's evaluation of them."},{"id":"Q0124","person":"William Shakespeare","quote":"The fault, dear Brutus, is not in our stars, but in ourselves.","source":"Julius Caesar I.2","era":"Early Modern","tags":"agency; responsibility","prov":"T","status":"Verified against Folger Shakespeare, Julius Caesar 1.2.","desc":"A sourced line concerning agency, responsibility, drawn from Julius Caesar I.2.","verification":"verified","source_url":"https://www.folger.edu/explore/shakespeares-works/julius-caesar/read/1/2/","explanation":"Cassius rejects fate as an excuse for political subordination and locates agency in human choices. The dramatic context matters: this is persuasive rhetoric from a conspirator, not a neutral philosophical theorem."},{"id":"Q0125","person":"William Shakespeare","quote":"Cowards die many times before their deaths; the valiant never taste of death but once.","source":"Julius Caesar II.2","era":"Early Modern","tags":"fear; courage","prov":"T","status":"Verified against Folger Shakespeare, Julius Caesar 2.2.","desc":"A sourced line concerning fear, courage, drawn from Julius Caesar II.2.","verification":"verified","source_url":"https://www.folger.edu/explore/shakespeares-works/julius-caesar/act-2-scene-2/","explanation":"Caesar argues that anticipatory fear makes people experience death repeatedly before it happens. The line is rhetorically powerful, though the scene also exposes Caesar's confidence as potentially excessive."},{"id":"Q0126","person":"William Shakespeare","quote":"All the world’s a stage, and all the men and women merely players.","source":"As You Like It II.7","era":"Early Modern","tags":"roles; social life","prov":"T","status":"Verified by the Folger Shakespeare Library's treatment of Jaques's speech in As You Like It.","desc":"A sourced line concerning roles, social life, drawn from As You Like It II.7.","verification":"verified","source_url":"https://www.folger.edu/blogs/shakespeare-and-beyond/order-it-jaquess-all-the-worlds-a-stage/","explanation":"Jaques models social life as a sequence of roles performed across the human life cycle. It is memorable because it turns identity from a fixed possession into something partly staged, temporal, and socially scripted."},{"id":"Q0127","person":"William Shakespeare","quote":"All that glisters is not gold.","source":"Merchant of Venice II.7","era":"Early Modern","tags":"appearance; reality","prov":"T","status":"Verified against Folger Shakespeare, The Merchant of Venice 2.7.","desc":"A sourced line concerning appearance, reality, drawn from Merchant of Venice II.7.","verification":"verified","source_url":"https://www.folger.edu/explore/shakespeares-works/the-merchant-of-venice/read/","explanation":"The line warns that visible value and real value can diverge. In the play it appears literally as a lesson encoded in the casket test, but it generalizes easily to signaling, status, and deceptive appearances."},{"id":"Q0128","person":"William Shakespeare","quote":"Some are born great, some achieve greatness, and some have greatness thrust upon ’em.","source":"Twelfth Night II.5","era":"Early Modern","tags":"greatness; status","prov":"T","status":"Verified against Folger Shakespeare, Twelfth Night 2.5.","desc":"A sourced line concerning greatness, status, drawn from Twelfth Night II.5.","verification":"verified","source_url":"https://www.folger.edu/explore/shakespeares-works/twelfth-night/read/2/5/","explanation":"The line divides greatness into inheritance, achievement, and circumstance. Its comic context matters: Malvolio reads it in a forged letter designed to manipulate his ambitions."},{"id":"Q0129","person":"René Descartes","quote":"I think, therefore I am","source":"Discourse on Method IV","era":"Scientific Revolution","tags":"epistemology; self","prov":"T","status":"Verified against Project Gutenberg's English translation of Descartes, Discourse on Method IV.","desc":"A sourced line concerning epistemology, self, drawn from Discourse on Method IV.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/59/pg59-images.html","explanation":"Descartes looks for a proposition that survives radical doubt. The very act of doubting requires a thinker who is doing the doubting, so thought supplies an immediate certainty of the thinker's existence."},{"id":"Q0130","person":"Thomas Hobbes","quote":"And the life of man, solitary, poore, nasty, brutish, and short.","source":"Thomas Hobbes, Leviathan XIII","era":"Scientific Revolution","tags":"state of nature; politics","prov":"T","status":"Corrected to the original-spelling text of Leviathan XIII in Project Gutenberg.","desc":"A sourced line concerning state of nature, politics, drawn from Leviathan XIII.","verification":"verified","source_url":"https://dev.gutenberg.org/files/3207/3207-h/3207-h.htm","explanation":"Hobbes is describing life under a condition without a common power capable of enforcing security. The phrase is part of a causal argument about mutual vulnerability, distrust, and the collapse of stable cooperation—not a claim that ordinary social life is always like this."},{"id":"Q0131","person":"Blaise Pascal","quote":"The heart has its reasons, which reason does not know.","source":"Pensées","era":"Scientific Revolution","tags":"reason; motivation","prov":"T","status":"Corrected to W. F. Trotter's published translation in Pascal's Pensées, fragment 277.","desc":"A sourced line concerning reason, motivation, drawn from Pensées.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/18269/pg18269-images.html","explanation":"Pascal is not simply celebrating irrational feeling. His 'heart' names forms of immediate apprehension and first principles that discursive reasoning itself presupposes but cannot derive entirely from argument."},{"id":"Q0132","person":"Isaac Newton","quote":"If I have seen further it is by standing on the shoulders of Giants.","source":"Letter to Robert Hooke","era":"Scientific Revolution","tags":"inheritance; knowledge","prov":"T","status":"Verified as Newton's wording in his 5 February 1675/76 letter to Robert Hooke, documented by the Royal Mint Museum.","desc":"A sourced line concerning inheritance, knowledge, drawn from Letter to Robert Hooke.","verification":"verified","source_url":"https://production.royalmintmuseum.org.uk/faqs/collectors/where-did-the-edge-inscription-standing-on-the-shoulders-of-giants-come-from/","explanation":"Newton acknowledges that scientific advance is cumulative: later insight depends on prior work. The metaphor predates Newton by centuries, but his letter made this formulation canonical."},{"id":"Q0133","person":"La Rochefoucauld","quote":"Our virtues are most frequently but vices disguised.","source":"Maxims, introductory maxim","era":"17th century","tags":"self-deception; morality","prov":"T","status":"Verified against the Project Gutenberg translation of La Rochefoucauld's Maxims.","desc":"A sourced line concerning self-deception, morality, drawn from Maxims.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/9105/pg9105-images.html","explanation":"La Rochefoucauld's governing suspicion is motivational: conduct that looks virtuous may be driven by vanity, interest, fear, or self-love. The maxim is intentionally severe and functions as a diagnostic challenge rather than a proof that genuine virtue never exists."},{"id":"Q0134","person":"La Rochefoucauld","quote":"Hypocrisy is the homage vice pays to virtue.","source":"Maxims 218","era":"17th century","tags":"hypocrisy; norms","prov":"T","status":"Verified against the Project Gutenberg translation of La Rochefoucauld's Maxims.","desc":"A sourced line concerning hypocrisy, norms, drawn from Maxims.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/9105/pg9105-images.html","explanation":"Hypocrisy reveals the social authority of the virtue being imitated. Even vice finds it advantageous to wear virtue's appearance, so pretense indirectly testifies to the norm it violates."},{"id":"Q0135","person":"Baruch Spinoza","quote":"peace is not mere absence of war, but is a virtue that springs from force of character:","source":"Political Treatise V.4","era":"17th century","tags":"peace; politics","prov":"T","status":"Corrected to the exact Elwes/Gosset translation of Spinoza's Political Treatise V.4.","desc":"A sourced line concerning peace, politics, drawn from Political Treatise.","verification":"verified","source_url":"https://constitution.org/2-Authors/bs/poltr_05.htm","explanation":"Spinoza distinguishes peace from mere suppression of conflict by fear. A stable commonwealth requires active civic capacities and institutions, not simply the temporary absence of open fighting."},{"id":"Q0136","person":"John Locke","quote":"new opinions are always suspected, and usually opposed, without any other reason but because they are not already common.","source":"Essay Concerning Human Understanding","era":"Enlightenment","tags":"novelty; convention","prov":"T","status":"Verified against the text of Locke's An Essay Concerning Human Understanding.","desc":"A sourced line concerning novelty, convention, drawn from Essay Concerning Human Understanding.","verification":"verified","source_url":"https://historyofeconomicthought.mcmaster.ca/locke/Essay.htm","explanation":"Locke identifies familiarity as an independent source of credibility. A belief can be resisted not because evidence refutes it, but because novelty itself is treated as evidence against it."},{"id":"Q0137","person":"John Locke","quote":"where there is no law, there is no freedom:","source":"Second Treatise of Government","era":"Enlightenment","tags":"law; freedom","prov":"T","status":"Verified as an exact clause from Locke's Second Treatise §57.","desc":"A sourced line concerning law, freedom, drawn from Second Treatise of Government.","verification":"verified","source_url":"https://www.intratext.com/IXT/ENG1274/_P8.HTM","explanation":"Locke rejects the idea that liberty means absence of every rule. General law can enlarge freedom by protecting agents from arbitrary interference by others; the relevant contrast is lawful constraint versus domination."},{"id":"Q0138","person":"John Milton","quote":"The mind is its own place, and in it self Can make a Heav'n of Hell, a Hell of Heav'n.","source":"Paradise Lost I","era":"17th century","tags":"mind; perception","prov":"T","status":"Corrected to the original-spelling Project Gutenberg text of Paradise Lost I.","desc":"A sourced line concerning mind, perception, drawn from Paradise Lost I.","verification":"verified","source_url":"https://www.gutenberg.org/files/1745/1745-h/1745-h.htm","explanation":"Satan asserts that interpretation can transform experienced circumstances. The dramatic speaker matters: Milton gives a psychologically powerful claim to a character whose self-command is entangled with pride and self-deception."},{"id":"Q0139","person":"John Milton","quote":"Better to reign in Hell, then serve in Heav'n.","source":"Paradise Lost I","era":"17th century","tags":"power; pride","prov":"T","status":"Corrected to the original-spelling Project Gutenberg text of Paradise Lost I.","desc":"A sourced line concerning power, pride, drawn from Paradise Lost I.","verification":"verified","source_url":"https://www.gutenberg.org/files/1745/1745-h/1745-h.htm","explanation":"Satan chooses sovereignty in misery over subordination in blessedness. The line is memorable precisely because it makes autonomy, pride, hierarchy, and self-destructive ambition collide in a single preference."},{"id":"Q0140","person":"Dryden","quote":"Great wits are sure to madness near allied, And thin partitions do their bounds divide;","source":"Absalom and Achitophel","era":"17th century","tags":"genius; madness","prov":"T","status":"Expanded to Dryden's exact couplet in Absalom and Achitophel.","desc":"A sourced line concerning genius, madness, drawn from Absalom and Achitophel.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/11488/pg11488.html","explanation":"Dryden links intellectual brilliance and instability in a satirical portrait of Shaftesbury. The couplet is memorable because it makes genius and madness adjacent rather than identical, separated by a boundary that can be dangerously thin."},{"id":"Q0141","person":"Jonathan Swift","quote":"Satire is a sort of glass, wherein beholders do generally discover everybody's face but their own;","source":"Preface to The Battle of the Books","era":"18th century","tags":"satire; self-deception","prov":"T","status":"Corrected to Swift's exact prefatory wording.","desc":"A sourced line concerning satire, self-deception, drawn from The Battle of the Books.","verification":"verified","source_url":"https://en.wikisource.org/wiki/The_Battle_of_the_Books","explanation":"Swift describes a predictable asymmetry in satire: readers readily identify the vices of others while exempting themselves. The line is a compact model of motivated interpretation and self-serving blindness."},{"id":"Q0142","person":"Jonathan Swift","quote":"Vision is the art of seeing things invisible.","source":"Jonathan Swift, Thoughts on Various Subjects","era":"18th century","tags":"vision; imagination","prov":"T","status":"Verified directly in Swift's Thoughts on Various Subjects on Wikisource.","desc":"A sourced line concerning vision, imagination, drawn from Thoughts on Various Subjects.","verification":"verified","source_url":"https://en.wikisource.org/wiki/The_Works_of_the_Rev._Jonathan_Swift/Volume_10/Thoughts_on_various_Subjects","explanation":"Swift compresses imagination or foresight into the ability to apprehend what is not immediately visible. The maxim is terse enough to apply to invention, strategy, art, and anticipation without requiring mystical interpretation."},{"id":"Q0143","person":"Alexander Pope","quote":"A little learning is a dangerous thing;","source":"An Essay on Criticism","era":"18th century","tags":"knowledge; ignorance","prov":"T","status":"Corrected punctuation and verified against Project Gutenberg, An Essay on Criticism.","desc":"A sourced line concerning knowledge, ignorance, drawn from An Essay on Criticism.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/7409/pg7409-images.html","explanation":"Pope's next lines explain the mechanism: shallow exposure produces confidence before the learner sees the scale of what remains. Greater learning can restore intellectual sobriety by revealing complexity."},{"id":"Q0144","person":"Alexander Pope","quote":"To err is human, to forgive, divine.","source":"An Essay on Criticism","era":"18th century","tags":"error; forgiveness","prov":"T","status":"Verified against Project Gutenberg, An Essay on Criticism.","desc":"A sourced line concerning error, forgiveness, drawn from An Essay on Criticism.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/7409/pg7409-images.html","explanation":"Pope pairs ordinary human fallibility with forgiveness as a higher moral response. The symmetry gives the couplet its force: error is expected; the more difficult achievement is how one responds to another's error."},{"id":"Q0145","person":"Alexander Pope","quote":"For fools rush in where angels fear to tread","source":"An Essay on Criticism","era":"18th century","tags":"overconfidence; judgment","prov":"T","status":"Corrected to the exact Project Gutenberg line from An Essay on Criticism.","desc":"A sourced line concerning overconfidence, judgment, drawn from An Essay on Criticism.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/7409/pg7409-images.html","explanation":"Pope contrasts noisy confidence with informed caution. The fool's distinguishing error is not merely ignorance but ignorance combined with an absence of the restraint that deeper understanding often produces."},{"id":"Q0146","person":"Montesquieu","quote":"To prevent this abuse, it is necessary from the very nature of things that power should be a check to power.","source":"The Spirit of the Laws XI.4","era":"Enlightenment","tags":"institutions; checks and balances","prov":"T","status":"Replaced the compressed slogan with the exact Nugent translation reproduced by the University of Chicago Founders' Constitution.","desc":"A sourced line concerning institutions, checks and balances, drawn from The Spirit of the Laws.","verification":"verified","source_url":"https://press-pubs.uchicago.edu/founders/documents/v1ch17s9.html","explanation":"Montesquieu treats abuse of power as structurally predictable rather than exceptional. The institutional answer is not to hope that rulers remain virtuous but to arrange powers so that one can limit another."},{"id":"Q0147","person":"Voltaire","quote":"If God did not exist, it would be necessary to invent him.","source":"Epistle to the Author of The Three Impostors","era":"Enlightenment","tags":"religion; society","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning religion, society, drawn from Epistle to the Author of The Three Impostors.","verification":"pending"},{"id":"Q0148","person":"Pierre-Marc-Gaston, duc de Lévis","quote":"It is even easier to judge a man's mind by his questions than by his answers.","source":"Maximes et réflexions sur différents sujets de morale et de politique (1808), maxim XVIII","era":"Enlightenment","tags":"questions; intelligence","prov":"T","status":"Pending source audit: prior verified label lacked the source-link/explanation evidence required by the current standard.","desc":"A sourced line concerning questions, intelligence, drawn from Maximes et réflexions sur différents sujets de morale et de politique (1808), maxim XVIII.","verification":"pending","prior_verification":"verified"},{"id":"Q0149","person":"David Hume","quote":"Reason is, and ought only to be the slave of the passions.","source":"Treatise of Human Nature","era":"Enlightenment","tags":"reason; motivation","prov":"T","status":"Verified against Hume's Treatise text in Project Gutenberg.","desc":"A sourced line concerning reason, motivation, drawn from Treatise of Human Nature.","verification":"verified","source_url":"https://www.gutenberg.org/files/53792/53792-h/53792-h.htm","explanation":"Hume's claim is that reason alone does not generate motivation; it discovers relations and means, while desires supply the ends that move us. It is a foundational challenge to pictures of human action in which abstract reason independently commands the will."},{"id":"Q0150","person":"David Hume","quote":"A wise man proportions his belief to the evidence.","source":"An Enquiry Concerning Human Understanding","era":"Enlightenment","tags":"evidence; probability","prov":"T","status":"Verified against Hume's Enquiry (Project Gutenberg).","desc":"A sourced line concerning evidence, probability, drawn from An Enquiry Concerning Human Understanding.","verification":"verified","source_url":"https://www.gutenberg.org/files/9662/9662-h/9662-h","explanation":"Hume treats belief as something that should scale with evidential strength rather than flip between certainty and disbelief. The line is a compact norm for probabilistic reasoning."},{"id":"Q0151","person":"David Hume","quote":"Custom, then, is the great guide of human life.","source":"Enquiry Concerning Human Understanding","era":"Enlightenment","tags":"habit; induction","prov":"T","status":"Verified against Hume's Enquiry (Project Gutenberg).","desc":"A sourced line concerning habit, induction, drawn from Enquiry Concerning Human Understanding.","verification":"verified","source_url":"https://www.gutenberg.org/files/9662/9662-h/9662-h","explanation":"Hume argues that repeated experience, not pure deduction, trains us to expect one event from another. Much of practical prediction therefore rests on habit formed by observed regularity."},{"id":"Q0152","person":"Jean-Jacques Rousseau","quote":"Man is born free; and everywhere he is in chains.","source":"The Social Contract","era":"Enlightenment","tags":"freedom; society","prov":"T","status":"Verified against G. D. H. Cole's public-domain translation of The Social Contract I.1.","desc":"A sourced line concerning freedom, society, drawn from The Social Contract.","verification":"verified","source_url":"https://www.gutenberg.org/files/46333/46333-h/46333-h.htm","explanation":"Rousseau opens with the problem his book must solve: how socially imposed obligations can coexist with human freedom. The sentence states the paradox before the theory of legitimate political association attempts to resolve it."},{"id":"Q0153","person":"Jean-Jacques Rousseau","quote":"The strongest is never strong enough to be always the master, unless he transforms strength into right, and obedience into duty.","source":"The Social Contract","era":"Enlightenment","tags":"power; legitimacy","prov":"T","status":"Verified against G. D. H. Cole's public-domain translation of The Social Contract I.3.","desc":"A sourced line concerning power, legitimacy, drawn from The Social Contract.","verification":"verified","source_url":"https://www.gutenberg.org/files/46333/46333-h/46333-h.htm","explanation":"Raw coercive capacity is unstable because it lasts only while superiority lasts. Durable authority requires a normative transformation by which compliance is treated as obligation rather than mere submission to force."},{"id":"Q0154","person":"Samuel Johnson","quote":"when a man is tired of London, he is tired of life;","source":"James Boswell, Life of Samuel Johnson, entry reporting Johnson","era":"18th century","tags":"life; city","prov":"R","status":"Transmission verified in Boswell's Life of Johnson; the record is Boswell's report of Johnson's conversation.","desc":"A reported, fragmentary, or mediated saying concerning life, city; useful for the idea and historical voice, with attribution context shown.","verification":"reported","source_url":"https://www.gutenberg.org/cache/epub/9180/pg9180.html","explanation":"Johnson treats London as a concentration of human variety and possibility. The joke works by exaggeration, but its underlying claim is that boredom with a sufficiently rich environment may reveal exhaustion in the observer rather than poverty in the world."},{"id":"Q0155","person":"Samuel Johnson","quote":"My dear friend, clear your mind of cant.","source":"James Boswell, Life of Samuel Johnson","era":"18th century","tags":"clarity; pretense","prov":"R","status":"Transmission verified in Boswell's Life of Johnson.","desc":"A reported, fragmentary, or mediated saying concerning clarity, pretense; useful for the idea and historical voice, with attribution context shown.","verification":"reported","source_url":"https://www.gutenberg.org/files/10357/10357-h/10357-h.htm","explanation":"Johnson uses 'cant' for conventional moral or political language repeated without honest correspondence to one's actual reactions. His command is an attack on self-dramatization as much as on public cliché."},{"id":"Q0156","person":"Adam Smith","quote":"It is not from the benevolence of the butcher, the brewer, or the baker that we expect our dinner.","source":"Wealth of Nations I","era":"Enlightenment","tags":"incentives; markets","prov":"T","status":"Verified against Project Gutenberg, The Wealth of Nations I.2.","desc":"A sourced line concerning incentives, markets, drawn from Wealth of Nations I.","verification":"verified","source_url":"https://dev.gutenberg.org/files/3300/3300-h/3300-h.htm","explanation":"Smith's point is not that benevolence is absent from human life, but that large-scale exchange cannot depend on personal generosity. Markets coordinate strangers by making cooperation compatible with each party pursuing an advantage."},{"id":"Q0157","person":"Adam Smith","quote":"the propensity to truck, barter, and exchange one thing for another.","source":"Wealth of Nations I","era":"Enlightenment","tags":"exchange; markets","prov":"T","status":"Corrected to exact excerpt from Project Gutenberg, The Wealth of Nations I.2; previous wording fused adjacent sentences.","desc":"A sourced line concerning exchange, markets, drawn from Wealth of Nations I.","verification":"verified","source_url":"https://dev.gutenberg.org/files/3300/3300-h/3300-h.htm","explanation":"Smith treats exchange as a recurring human propensity that makes specialization useful. Division of labor becomes socially productive because people can trade the different outputs of specialized abilities."},{"id":"Q0158","person":"Edward Gibbon","quote":"His reign is marked by the rare advantage of furnishing very few materials for history; which is, indeed, little more than the register of the crimes, follies, and misfortunes of mankind.","source":"The History of the Decline and Fall of the Roman Empire, Chapter III","era":"Enlightenment","tags":"history; human nature","prov":"T","status":"Expanded to Gibbon's complete sentence in Chapter III.","desc":"A sourced line concerning history, human nature, drawn from Decline and Fall.","verification":"verified","source_url":"https://upload.wikimedia.org/wikipedia/commons/3/30/The_history_of_the_decline_and_fall_of_the_Roman_Empire_%28IA_historyofdecline01gibb%29.pdf","explanation":"Gibbon's joke is double-edged: a peaceful and well-governed reign gives the historian little to narrate because conventional history disproportionately records breakdown, conflict, vice, and catastrophe."},{"id":"Q0159","person":"Edmund Burke","quote":"A state without the means of some change is without the means of its conservation.","source":"Reflections on the Revolution in France","era":"18th century","tags":"change; institutions","prov":"T","status":"Verified against the text of Burke's Reflections on the Revolution in France.","desc":"A sourced line concerning change, institutions, drawn from Reflections on the Revolution in France.","verification":"verified","source_url":"https://www.files.ethz.ch/isn/125465/603.pdf","explanation":"Burke does not oppose change categorically. He argues that institutions require mechanisms of correction precisely in order to preserve what is worth conserving; rigidity can destroy the structure it intends to protect."},{"id":"Q0160","person":"Thomas Paine","quote":"These are the times that try men's souls.","source":"The American Crisis","era":"18th century","tags":"crisis; courage","prov":"T","status":"Verified against Moncure Daniel Conway's edition of Paine's The American Crisis I on Project Gutenberg.","desc":"A sourced line concerning crisis, courage, drawn from The American Crisis.","verification":"verified","source_url":"https://www.gutenberg.org/files/31270/31270-h/31270-h.htm","explanation":"Paine opens at the point of military retreat and declining morale. The sentence frames crisis as a test that distinguishes durable commitment from support that survives only while conditions are easy."},{"id":"Q0161","person":"Thomas Paine","quote":"my country is the world, and my religion is to do good.","source":"Rights of Man tradition","era":"18th century","tags":"cosmopolitanism; ethics","prov":"T","status":"Corrected to Paine's exact Rights of Man, Part II wording; the popular 'all mankind are my brethren' expansion is not found in his writings.","desc":"A sourced line concerning cosmopolitanism, ethics, drawn from Rights of Man tradition.","verification":"verified","source_url":"https://www.gutenberg.org/files/31270/31270-h/31270-h.htm","explanation":"Paine uses cosmopolitan identity to reject narrow attachment to place or inherited rank. The sentence joins political universalism with an ethical criterion: belonging is global and religion is measured by beneficial action."},{"id":"Q0162","person":"Benjamin Franklin","quote":"Well done is better than well said.","source":"Poor Richard’s Almanack","era":"18th century","tags":"action; rhetoric","prov":"T","status":"Verified in Poor Richard's Almanack (1737), as reproduced by the Gilder Lehrman Institute.","desc":"A sourced line concerning action, rhetoric, drawn from Poor Richard’s Almanack.","verification":"verified","source_url":"https://hamilton.gilderlehrman.org/supporting-document/poor-richards-almanac","explanation":"Franklin compresses a practical ethic into a comparison between performance and declaration. Intention, rhetoric, and reputation matter less than whether the promised result is actually produced."},{"id":"Q0163","person":"Pennsylvania Assembly / Benjamin Franklin","quote":"Those who would give up essential Liberty, to purchase a little temporary Safety, deserve neither Liberty nor Safety.","source":"Pennsylvania Assembly reply","era":"18th century","tags":"liberty; security","prov":"T","status":"Corrected to the 1755 Pennsylvania Assembly wording. Franklin served on the drafting committee and is generally credited with substantial authorship; sole authorship is not treated as certain.","desc":"A sourced line concerning liberty, security, drawn from Pennsylvania Assembly reply.","verification":"verified","source_url":"https://www.ala.org/aboutala/intellectual-freedom-quotes","explanation":"The original dispute concerned the Assembly's authority to tax proprietary lands for frontier defense, not a generic modern privacy-versus-security tradeoff. The principle is about preserving essential self-government rather than purchasing short-term protection by surrendering the authority that makes political liberty possible."},{"id":"Q0164","person":"Thomas Jefferson","quote":"I cannot live without books","source":"Letter to John Adams","era":"18th century","tags":"books; learning","prov":"T","status":"Verified as an exact clause from Jefferson's 10 June 1815 letter to John Adams, Library of Congress.","desc":"A sourced line concerning books, learning, drawn from Letter to John Adams.","verification":"verified","source_url":"https://www.loc.gov/exhibits/jefferson/217.html","explanation":"The sentence is literal rather than ornamental: Jefferson had just sold his great library to Congress and was already rebuilding it. Books functioned for him as instruments of work, inquiry, and intellectual independence."},{"id":"Q0165","person":"Thomas Jefferson","quote":"the tree of liberty must be refreshed from time to time with the blood of patriots & tyrants.","source":"Letter to William Stephens Smith","era":"18th century","tags":"revolution; liberty","prov":"T","status":"Corrected to Jefferson's manuscript wording in his 13 November 1787 letter to William Stephens Smith, Library of Congress.","desc":"A sourced line concerning revolution, liberty, drawn from Letter to William Stephens Smith.","verification":"verified","source_url":"https://www.loc.gov/exhibits/jefferson/105.html","explanation":"Jefferson wrote in the aftermath of Shays' Rebellion and treated periodic resistance as evidence that a population had not become politically inert. The context is much more radical than the detached slogan suggests and should be remembered with the quotation."},{"id":"Q0166","person":"James Madison","quote":"If men were angels, no government would be necessary.","source":"Federalist No. 51","era":"18th century","tags":"institutions; human nature","prov":"T","status":"Verified against the Library of Congress text of Federalist No. 51.","desc":"A sourced line concerning institutions, human nature, drawn from Federalist No. 51.","verification":"verified","source_url":"https://guides.loc.gov/federalist-papers/text-51-60","explanation":"Madison treats institutional checks as responses to ordinary human incentives rather than to uniquely wicked rulers. Government must control governed behavior while also constraining those who exercise government power."},{"id":"Q0167","person":"Alexander Hamilton","quote":"A nation which can prefer disgrace to danger is prepared for a master, and deserves one.","source":"Letter to the Daily Advertiser, 21 February 1797","era":"18th century","tags":"risk; politics","prov":"T","status":"Pending source-quality upgrade: wording may be correct, but the current supporting link is below the corpus's evidence standard.","desc":"A sourced line concerning risk, politics, drawn from Federalist No. 34 / attribution to Hamilton.","verification":"pending","source_url":"https://en.wikiquote.org/wiki/Alexander_Hamilton","explanation":"Hamilton presents national honor and willingness to face danger as conditions of political independence. Whatever one thinks of the claim, the sentence is a warning that habitual submission can create the conditions for domination.","prior_verification":"verified"},{"id":"Q0168","person":"George Washington","quote":"It is better to offer no excuse than a bad one.","source":"Letter / Rules tradition","era":"18th century","tags":"integrity; responsibility","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning integrity, responsibility; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0169","person":"Patrick Henry","quote":"give me liberty or give me death!","source":"William Wirt's 1817 reconstruction of Patrick Henry's 1775 Virginia Convention speech","era":"18th century","tags":"liberty; courage","prov":"R","status":"Transmission documented by the Library of Congress. No Henry manuscript or contemporary text survives; the familiar wording comes from William Wirt's 1817 reconstruction from recollections.","desc":"A reported, fragmentary, or mediated saying concerning liberty, courage; useful for the idea and historical voice, with attribution context shown.","verification":"reported","source_url":"https://www.loc.gov/item/today-in-history/may-29/","explanation":"The sentence presents liberty and life under domination as mutually exclusive values and chooses liberty. Its historical power is undeniable, but the exact wording must be learned with the caveat that it is a later reconstruction of Henry's speech."},{"id":"Q0170","person":"William Blake","quote":"The road of excess leads to the palace of wisdom.","source":"The Marriage of Heaven and Hell","era":"Romantic era","tags":"experience; wisdom","prov":"T","status":"Verified against Project Gutenberg, The Marriage of Heaven and Hell, 'Proverbs of Hell.'","desc":"A sourced line concerning experience, wisdom, drawn from The Marriage of Heaven and Hell.","verification":"verified","source_url":"https://www.gutenberg.org/files/45315/45315-h/45315-h.htm","explanation":"Blake's proverb deliberately reverses conventional prudence. It proposes that limits can sometimes be understood only by being encountered, but its infernal speaker and paradoxical form make it provocation rather than straightforward behavioral advice."},{"id":"Q0171","person":"William Blake","quote":"If the doors of perception were cleansed everything would appear to man as it is, infinite.","source":"The Marriage of Heaven and Hell","era":"Romantic era","tags":"perception; infinity","prov":"T","status":"Corrected to the exact Project Gutenberg text of The Marriage of Heaven and Hell.","desc":"A sourced line concerning perception, infinity, drawn from The Marriage of Heaven and Hell.","verification":"verified","source_url":"https://www.gutenberg.org/files/45315/45315-h/45315-h.htm","explanation":"Blake imagines ordinary perception as narrowed by habitual conceptual boundaries. Cleansing perception would not add infinity to the world; it would remove the filters that make an already infinite reality appear finite."},{"id":"Q0172","person":"William Wordsworth","quote":"The Child is Father of the Man;","source":"My Heart Leaps Up","era":"Romantic era","tags":"development; childhood","prov":"T","status":"Corrected capitalization and punctuation to the public-domain text of Wordsworth's poem.","desc":"A sourced line concerning development, childhood, drawn from My Heart Leaps Up.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/2619/pg2619-images.html","explanation":"Wordsworth compresses developmental continuity into a paradox: the child helps produce the adult who follows. Early perception, attachment, and habits therefore stand causally 'before' and in that sense parent later identity."},{"id":"Q0173","person":"Coleridge","quote":"Water, water, every where, Nor any drop to drink.","source":"The Rime of the Ancient Mariner","era":"Romantic era","tags":"privation; irony","prov":"T","status":"Verified as the exact two-line refrain in the 1834 text.","desc":"A sourced line concerning privation, irony, drawn from The Rime of the Ancient Mariner.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/11101/pg11101.html","explanation":"The lines create a severe resource paradox: abundance at the wrong form or quality is equivalent to deprivation. The sailors are surrounded by water but cannot use it to satisfy the need that matters."},{"id":"Q0174","person":"Percy Bysshe Shelley","quote":"Poets are the unacknowledged legislators of the world.","source":"A Defence of Poetry","era":"Romantic era","tags":"poetry; culture","prov":"T","status":"Verified as the closing sentence of Shelley's A Defence of Poetry.","desc":"A sourced line concerning poetry, culture, drawn from A Defence of Poetry.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/5428/pg5428-images.html","explanation":"Shelley means 'legislation' culturally rather than formally. Poets alter the imaginative and emotional vocabulary through which later societies perceive possibilities, values, and institutions, often without exercising official power."},{"id":"Q0175","person":"John Keats","quote":"Beauty is truth, truth beauty,—that is all Ye know on earth, and all ye need to know.","source":"Ode on a Grecian Urn","era":"Romantic era","tags":"beauty; truth","prov":"T","status":"Expanded to the complete final utterance in a modern scholarly presentation of Keats's public-domain poem.","desc":"A sourced line concerning beauty, truth, drawn from Ode on a Grecian Urn.","verification":"verified","source_url":"https://www.poetryfoundation.org/poems/44477/ode-on-a-grecian-urn","explanation":"The ending is intentionally difficult and its punctuation has varied across editions. The poem does not hand the reader a simple equation so much as stage a riddle about art, permanence, beauty, mortality, and what aesthetic form can disclose."},{"id":"Q0176","person":"Jane Austen","quote":"It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.","source":"Pride and Prejudice, Chapter I","era":"19th century","tags":"irony; society","prov":"T","status":"Verified against Project Gutenberg's text of Pride and Prejudice.","desc":"A sourced line concerning irony, society, drawn from Pride and Prejudice.","verification":"verified","source_url":"https://www.gutenberg.org/files/1342/1342-h/1342-h.htm","explanation":"Austen's opening performs irony immediately: the 'universal truth' tells us less about wealthy single men than about the marriage expectations and economic interests of the surrounding families."},{"id":"Q0177","person":"Napoleon Bonaparte","quote":"The word impossible is not French.","source":"Letter to General Jean Le Marois, 9 July 1813","era":"Napoleonic era","tags":"ambition; possibility","prov":"T","status":"Pending source audit: prior verified label lacked the source-link/explanation evidence required by the current standard.","desc":"A sourced line concerning ambition, possibility, drawn from Letter to General Jean Le Marois, 9 July 1813.","verification":"pending","prior_verification":"verified"},{"id":"Q0178","person":"Carl von Clausewitz","quote":"War is a mere continuation of policy by other means.","source":"Carl von Clausewitz, On War I.1.24, J. J. Graham translation","era":"19th century","tags":"war; politics","prov":"T","status":"Corrected to the exact section heading in J. J. Graham's translation of On War I.1.24.","desc":"A sourced line concerning war, politics, drawn from On War I.","verification":"verified","source_url":"https://dev.gutenberg.org/cache/epub/1946/pg1946-images.html","explanation":"Clausewitz embeds military force inside political purpose. War has its own dynamics, but its meaning and objectives cannot be understood independently of the policy that called it into being."},{"id":"Q0179","person":"Carl von Clausewitz","quote":"Everything is very simple in War, but the simplest thing is difficult.","source":"Carl von Clausewitz, On War I.7, J. J. Graham translation","era":"19th century","tags":"friction; complexity","prov":"T","status":"Verified against J. J. Graham's translation of On War in Project Gutenberg.","desc":"A sourced line concerning friction, complexity, drawn from On War I.","verification":"verified","source_url":"https://dev.gutenberg.org/cache/epub/1946/pg1946-images.html","explanation":"Clausewitz names the gap between conceptual simplicity and execution. Countless small impediments—information delay, fatigue, error, terrain, coordination—accumulate into the friction that makes apparently easy actions difficult in practice."},{"id":"Q0180","person":"Carl von Clausewitz","quote":"War is the province of uncertainty:","source":"Carl von Clausewitz, On War I.3, J. J. Graham translation","era":"19th century","tags":"uncertainty; strategy","prov":"T","status":"Corrected from 'realm' to the exact J. J. Graham wording 'province of uncertainty'.","desc":"A sourced line concerning uncertainty, strategy, drawn from On War.","verification":"verified","source_url":"https://dev.gutenberg.org/cache/epub/1946/pg1946-images.html","explanation":"Clausewitz emphasizes that most variables relevant to action are partly hidden. Command therefore requires judgment under incomplete information rather than optimization from a complete and stable model."},{"id":"Q0181","person":"Arthur Schopenhauer","quote":"I am free, if I can do what I will.","source":"On the Freedom of the Will","era":"19th century","tags":"determinism; will","prov":"T","status":"Replaced the later popular paraphrase with an exact short excerpt from Schopenhauer's Prize Essay on the Freedom of the Will in a Cambridge translation.","desc":"A sourced line concerning determinism, will, drawn from On the Freedom of the Will.","verification":"verified","source_url":"https://beckassets.blob.core.windows.net/product/readingsample/350876/9780521577663_excerpt_001.pdf","explanation":"Schopenhauer grants ordinary freedom of action—being able to act according to one's will—but argues that this does not answer the harder question of where the will itself comes from."},{"id":"Q0182","person":"Arthur Schopenhauer","quote":"Every man takes the limits of his own field of vision for the limits of the world.","source":"Studies in Pessimism, 'Further Psychological Observations'","era":"19th century","tags":"perspective; cognition","prov":"T","status":"Verified against T. Bailey Saunders's public-domain translation.","desc":"A sourced line concerning perspective, cognition, drawn from Studies in Pessimism.","verification":"verified","source_url":"https://www.gutenberg.org/files/10732/10732-h/10732-h.htm","explanation":"Schopenhauer describes a cognitive projection error: the boundary of one's own experience or imagination is mistaken for a boundary in reality. Limited perspective becomes invisible precisely because it supplies the frame through which everything else is judged."},{"id":"Q0183","person":"Alexis de Tocqueville","quote":"Despotism may govern without faith, but liberty cannot.","source":"Democracy in America, Chapter XVII","era":"19th century","tags":"liberty; belief","prov":"T","status":"Verified against Henry Reeve's translation of Democracy in America.","desc":"A sourced line concerning liberty, belief, drawn from Democracy in America.","verification":"verified","source_url":"https://en.wikisource.org/wiki/Democracy_in_America_%28Reeve%29/Chapter_17","explanation":"Tocqueville argues that self-government relaxes direct political control and therefore depends more heavily on internalized moral restraints. This is a descriptive claim about the social supports of liberty within his nineteenth-century framework, not a timeless proof that freedom requires one particular creed."},{"id":"Q0184","person":"John Stuart Mill","quote":"He who knows only his own side of the case, knows little of that.","source":"On Liberty","era":"19th century","tags":"debate; epistemology","prov":"T","status":"Corrected punctuation and verified against Project Gutenberg, On Liberty II.","desc":"A sourced line concerning debate, epistemology, drawn from On Liberty.","verification":"verified","source_url":"https://www.gutenberg.org/files/34901/34901-h/34901-h.htm","explanation":"Mill argues that knowing a conclusion without understanding its strongest opposition produces shallow belief. Intellectual possession requires being able to state and answer the contrary case rather than merely inheriting one's own side."},{"id":"Q0185","person":"John Stuart Mill","quote":"The only freedom which deserves the name, is that of pursuing our own good in our own way, so long as we do not attempt to deprive others of theirs, or impede their efforts to obtain it.","source":"On Liberty","era":"19th century","tags":"liberty; individuality","prov":"T","status":"Expanded to the exact complete sentence in Project Gutenberg, On Liberty I.","desc":"A sourced line concerning liberty, individuality, drawn from On Liberty.","verification":"verified","source_url":"https://www.gutenberg.org/files/34901/34901-h/34901-h.htm","explanation":"Mill's liberty principle joins individual experimentation with a boundary against harming or blocking others. Freedom is therefore not mere absence of rules; it is protected scope for self-direction under reciprocal constraints."},{"id":"Q0186","person":"John Stuart Mill","quote":"Better to be a human being dissatisfied than a pig satisfied.","source":"Utilitarianism","era":"19th century","tags":"quality; utility","prov":"T","status":"Verified against Project Gutenberg, Utilitarianism II.","desc":"A sourced line concerning quality, utility, drawn from Utilitarianism.","verification":"verified","source_url":"https://www.gutenberg.org/files/11224/11224-h/11224-h","explanation":"Mill uses the comparison to defend qualitative differences among pleasures. A life capable of reflection, dissatisfaction, and higher forms of experience can be preferable to a simpler life of complete contentment."},{"id":"Q0187","person":"Søren Kierkegaard","quote":"It is perfectly true, as the philosophers say, that life must be understood backwards. But they forget the other proposition, that it must be lived forwards.","source":"Journals IV.A.164 (1843)","era":"19th century","tags":"time; understanding","prov":"T","status":"Pending source-quality upgrade: wording may be correct, but the current supporting link is below the corpus's evidence standard.","desc":"A sourced line concerning time, understanding, drawn from Journals.","verification":"pending","source_url":"https://wist.info/kierkegaard-soren/35849/","explanation":"Retrospective understanding and prospective action obey different temporal conditions. Meaning becomes clearer after events unfold, yet decisions must be made before that retrospective clarity is available.","prior_verification":"verified"},{"id":"Q0188","person":"Ralph Waldo Emerson","quote":"Whoso would be a man must be a nonconformist.","source":"Self-Reliance","era":"19th century","tags":"individuality; conformity","prov":"T","status":"Verified against Project Gutenberg, Emerson's Self-Reliance.","desc":"A sourced line concerning individuality, conformity, drawn from Self-Reliance.","verification":"verified","source_url":"https://dev.gutenberg.org/cache/epub/16643/pg16643-images.html","explanation":"Emerson treats mature individuality as requiring resistance to social conformity when convention conflicts with one's examined judgment. The target is dependence on external approval, not reflexive opposition for its own sake."},{"id":"Q0189","person":"Ralph Waldo Emerson","quote":"A foolish consistency is the hobgoblin of little minds, adored by little statesmen and philosophers and divines.","source":"Self-Reliance","era":"19th century","tags":"consistency; flexibility","prov":"T","status":"Expanded to Emerson's exact sentence in Self-Reliance.","desc":"A sourced line concerning consistency, flexibility, drawn from Self-Reliance.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/2944/pg2944-images.html","explanation":"The adjective 'foolish' does the essential work. Emerson attacks loyalty to one's earlier statements when new judgment or experience points elsewhere; consistency with reality matters more than consistency with one's public record."},{"id":"Q0190","person":"Henry David Thoreau","quote":"The mass of men lead lives of quiet desperation.","source":"Walden","era":"19th century","tags":"conformity; life","prov":"T","status":"Verified against the Walden Woods Project's documented Walden quotation.","desc":"A sourced line concerning conformity, life, drawn from Walden.","verification":"verified","source_url":"https://www.walden.org/?quotation=life-and-death-quote-9","explanation":"Thoreau argues that conventional success can conceal a life organized around unexamined necessity and resignation. 'Quiet desperation' names the gap between outward normality and inward recognition that one's life is not freely or deliberately chosen."},{"id":"Q0191","person":"Henry David Thoreau","quote":"Simplify, simplify.","source":"Walden","era":"19th century","tags":"simplicity","prov":"T","status":"Verified directly in Walden, Chapter II, via Wikisource.","desc":"A sourced line concerning simplicity, drawn from Walden.","verification":"verified","source_url":"https://en.wikisource.org/wiki/Walden_%281893%29_Thoreau/Chapter_II","explanation":"The command to simplify follows Thoreau's complaint that life is 'frittered away by detail.' The target is not complexity in itself but proliferating commitments that consume attention without serving a worthy aim."},{"id":"Q0192","person":"Henry David Thoreau","quote":"If a man does not keep pace with his companions, perhaps it is because he hears a different drummer.","source":"Walden","era":"19th century","tags":"individuality; conformity","prov":"T","status":"Verified directly in Walden, Chapter XVIII, via Wikisource.","desc":"A sourced line concerning individuality, conformity, drawn from Walden.","verification":"verified","source_url":"https://en.wikisource.org/wiki/Walden_%281893%29_Thoreau/Chapter_XVIII","explanation":"Thoreau uses different tempo as a metaphor for individuality. Falling out of synchronization with one's peers need not indicate failure if one's actions answer to a different but coherent standard."},{"id":"Q0193","person":"Charles Darwin","quote":"There is grandeur in this view of life.","source":"On the Origin of Species","era":"19th century","tags":"evolution; nature","prov":"T","status":"Verified as the opening clause of Darwin's final sentence in On the Origin of Species; retained as a short exact excerpt.","desc":"A sourced line concerning evolution, nature, drawn from On the Origin of Species.","verification":"verified","source_url":"https://dev.gutenberg.org/cache/epub/69147/pg69147-images.html","explanation":"Darwin closes the Origin by presenting evolutionary change not as a diminishment of life but as a source of grandeur: immense diversity can emerge over time from simple beginnings through lawful natural processes."},{"id":"Q0194","person":"Charles Darwin","quote":"Ignorance more frequently begets confidence than does knowledge.","source":"Descent of Man","era":"19th century","tags":"ignorance; confidence","prov":"T","status":"Verified against Project Gutenberg, The Descent of Man.","desc":"A sourced line concerning ignorance, confidence, drawn from Descent of Man.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/34967/pg34967-images.html","explanation":"Darwin observes that ignorance can support certainty because the ignorant person does not yet perceive the difficulty of the problem. More knowledge often reveals additional contingencies, unknowns, and reasons for caution."},{"id":"Q0195","person":"Karl Marx","quote":"The philosophers have only interpreted the world, in various ways; the point, however, is to change it.","source":"Theses on Feuerbach XI","era":"19th century","tags":"praxis; philosophy","prov":"T","status":"Verified against Marx's Theses on Feuerbach XI at Marxists Internet Archive.","desc":"A sourced line concerning praxis, philosophy, drawn from Theses on Feuerbach XI.","verification":"verified","source_url":"https://www.marxists.org/archive/marx/works/1845/theses/theses.htm","explanation":"Marx attacks philosophy that stops at interpretation. The thesis makes practice part of theory's criterion: understanding social reality matters because human activity can intervene in and transform it."},{"id":"Q0196","person":"Karl Marx","quote":"The history of all hitherto existing societies is the history of class struggles.","source":"Communist Manifesto","era":"19th century","tags":"class; history","prov":"T","status":"Corrected to exact Project Gutenberg translation, Communist Manifesto I; previous entry used singular 'society'.","desc":"A sourced line concerning class, history, drawn from Communist Manifesto.","verification":"verified","source_url":"https://www.gutenberg.org/files/61/61-h/61-h.htm","explanation":"Marx and Engels propose class conflict as a recurrent mechanism of historical transformation. The sentence is deliberately sweeping: social orders are interpreted through opposing positions within systems of production and authority."},{"id":"Q0197","person":"Karl Marx","quote":"All that is solid melts into air.","source":"Communist Manifesto","era":"19th century","tags":"modernity; change","prov":"T","status":"Verified against Project Gutenberg, Communist Manifesto I.","desc":"A sourced line concerning modernity, change, drawn from Communist Manifesto.","verification":"verified","source_url":"https://www.gutenberg.org/files/61/61-h/61-h.htm","explanation":"The phrase describes capitalism's tendency to dissolve inherited institutions, statuses, and settled relations through continual economic transformation. What appears stable becomes subject to market-driven reconstruction."},{"id":"Q0198","person":"Abraham Lincoln","quote":"A house divided against itself cannot stand.","source":"Speech at Springfield","era":"19th century","tags":"division; politics","prov":"T","status":"Verified against the Library of Congress Lincoln-Douglas Debates scrapbook.","desc":"A sourced line concerning division, politics, drawn from Speech at Springfield.","verification":"verified","source_url":"https://www.loc.gov/exhibits/lincoln/ext/al0030.html","explanation":"Lincoln uses the biblical image to argue that a political system organized around a fundamental contradiction cannot remain indefinitely stable. The line is about structural tension: persistent incompatible arrangements generate pressure toward resolution."},{"id":"Q0199","person":"Abraham Lincoln","quote":"With malice toward none, with charity for all.","source":"Second Inaugural Address","era":"19th century","tags":"reconciliation; politics","prov":"T","status":"Verified against Lincoln's Second Inaugural manuscript at the Library of Congress.","desc":"A sourced line concerning reconciliation, politics, drawn from Second Inaugural Address.","verification":"verified","source_url":"https://www.loc.gov/resource/mal.4361300/?st=text","explanation":"Delivered near the end of the Civil War, the phrase rejects vengeance as the governing principle of reconstruction. Its force comes from coupling moral restraint with firmness rather than treating reconciliation as passivity."},{"id":"Q0200","person":"Abraham Lincoln","quote":"Government of the people, by the people, for the people, shall not perish from the earth.","source":"Gettysburg Address","era":"19th century","tags":"democracy; government","prov":"T","status":"Verified against the Library of Congress Gettysburg Address transcription.","desc":"A sourced line concerning democracy, government, drawn from Gettysburg Address.","verification":"verified","source_url":"https://loc.gov/exhibits/gettysburg-address/ext/trans-hay-draft.html","explanation":"Lincoln compresses democratic legitimacy into a three-part formula: the people are the source, agents, and beneficiaries of government. The line turns the war's survival into a test of whether that form of political order can endure."},{"id":"Q0201","person":"Frederick Douglass","quote":"Power concedes nothing without a demand. It never did and it never will.","source":"West India Emancipation speech","era":"19th century","tags":"power; resistance","prov":"T","status":"Verified against Frederick Douglass National Historic Site, quoting the 1857 West India Emancipation speech.","desc":"A sourced line concerning power, resistance, drawn from West India Emancipation speech.","verification":"verified","source_url":"https://www.nps.gov/frdo/learn/historyculture/thoughts-for-all-time.htm","explanation":"Douglass treats entrenched power as responsive to pressure rather than moral request alone. Reform therefore requires organized demand capable of changing the incentives or costs faced by those benefiting from the status quo."},{"id":"Q0202","person":"Frederick Douglass","quote":"If there is no struggle, there is no progress.","source":"West India Emancipation speech","era":"19th century","tags":"struggle; progress","prov":"T","status":"Corrected punctuation and verified against the National Park Service transcription of Douglass's 1857 West India Emancipation speech.","desc":"A sourced line concerning struggle, progress, drawn from West India Emancipation speech.","verification":"verified","source_url":"https://www.nps.gov/common/uploads/teachers/lessonplans/Abolition%20and%20Anti%20Slavery%20Texts%20in%20Hopedale%20-%20Primary%20Sources.pdf","explanation":"Douglass links progress to contestation because institutions that distribute power rarely surrender advantages spontaneously. The sentence is followed by his argument that people cannot demand freedom while rejecting all agitation."},{"id":"Q0203","person":"Fyodor Dostoevsky","quote":"Yes, man is a pliable animal—he must be so defined—a being who gets accustomed to everything!","source":"Notes from a Dead House","era":"19th century","tags":"adaptation; human nature","prov":"T","status":"Corrected to exact Project Gutenberg translation, The House of the Dead.","desc":"A sourced line concerning adaptation, human nature, drawn from Notes from a Dead House.","verification":"verified","source_url":"https://www.gutenberg.org/files/37536/37536-h/37536-h.htm","explanation":"Dostoevsky's prison narrator identifies adaptation as one of the most disturbing human powers: people can normalize conditions that initially seem unbearable. Plasticity is therefore both a survival mechanism and a warning about what human beings can learn to accept."},{"id":"Q0204","person":"Fyodor Dostoevsky","quote":"Beauty will save the world.","source":"The Idiot","era":"19th century","tags":"beauty; salvation","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning beauty, salvation; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0205","person":"Leo Tolstoy","quote":"All happy families are alike; each unhappy family is unhappy in its own way.","source":"Anna Karenina","era":"19th century","tags":"family; complexity","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning family, complexity, drawn from Anna Karenina.","verification":"pending"},{"id":"Q0206","person":"Friedrich Nietzsche","quote":"If a man knows the wherefore of his existence, then the manner of it can take care of itself.","source":"Twilight of the Idols","era":"19th century","tags":"meaning; endurance","prov":"T","status":"Corrected to exact Anthony M. Ludovici translation, Twilight of the Idols, maxim 12.","desc":"A sourced line concerning meaning, endurance, drawn from Twilight of the Idols.","verification":"verified","source_url":"https://www.gutenberg.org/files/52263/52263-h/52263-h.htm","explanation":"Nietzsche links endurance to a governing purpose: when the reason for living is strong enough, difficulty becomes a problem of means rather than a reason to abandon the project. The familiar 'why/how' version is a translation family, not a free-floating slogan."},{"id":"Q0207","person":"Friedrich Nietzsche","quote":"That which does not kill me, makes me stronger.","source":"Twilight of the Idols","era":"19th century","tags":"adversity; strength","prov":"T","status":"Corrected to exact Anthony M. Ludovici translation, Twilight of the Idols, maxim 8.","desc":"A sourced line concerning adversity, strength, drawn from Twilight of the Idols.","verification":"verified","source_url":"https://www.gutenberg.org/files/52263/52263-h/52263-h.htm","explanation":"This is not a universal promise that suffering automatically improves people. In Nietzsche's setting it is an aphorism about a strong organism or character being capable of converting adversity into additional strength."},{"id":"Q0208","person":"Friedrich Nietzsche","quote":"One must still have chaos in one, to give birth to a dancing star.","source":"Thus Spoke Zarathustra","era":"19th century","tags":"creativity; chaos","prov":"T","status":"Corrected to exact public-domain translation in Thus Spake Zarathustra.","desc":"A sourced line concerning creativity, chaos, drawn from Thus Spoke Zarathustra.","verification":"verified","source_url":"https://dev.gutenberg.org/files/1998/1998-h/1998-h.htm","explanation":"The image connects creative production with unresolved tension and inner multiplicity. Order alone is not enough; generative transformation may require material that initially appears disordered."},{"id":"Q0209","person":"Friedrich Nietzsche","quote":"He who fights with monsters should be careful lest he thereby become a monster.","source":"Friedrich Nietzsche, Beyond Good and Evil §146, Helen Zimmern translation","era":"19th century","tags":"conflict; corruption","prov":"T","status":"Verified against Helen Zimmern's public-domain translation of Beyond Good and Evil §146 in Project Gutenberg.","desc":"A sourced line concerning conflict, corruption, drawn from Beyond Good and Evil.","verification":"verified","source_url":"https://www.gutenberg.org/files/4363/4363-h/4363-h.htm","explanation":"Nietzsche warns that prolonged conflict can make a person internalize the methods, values, or psychology of the thing being opposed. Opposition is therefore not psychologically one-way: the struggle can transform the struggler."},{"id":"Q0210","person":"Friedrich Nietzsche","quote":"And if thou gaze long into an abyss, the abyss will also gaze into thee.","source":"Friedrich Nietzsche, Beyond Good and Evil §146, Helen Zimmern translation","era":"19th century","tags":"perception; transformation","prov":"T","status":"Verified against Helen Zimmern's public-domain translation of Beyond Good and Evil §146 in Project Gutenberg.","desc":"A sourced line concerning perception, transformation, drawn from Beyond Good and Evil.","verification":"verified","source_url":"https://www.gutenberg.org/files/4363/4363-h/4363-h.htm","explanation":"The sentence immediately follows Nietzsche's monster warning. Sustained attention to destructive or morally dangerous material is portrayed as reciprocal: what one studies or confronts can reshape the observer."},{"id":"Q0211","person":"Walt Whitman","quote":"I am large—I contain multitudes.","source":"Song of Myself, section 51","era":"19th century","tags":"self; multiplicity","prov":"T","status":"Verified against the Walt Whitman Archive, Leaves of Grass (1871), Song of Myself §51.","desc":"A sourced line concerning self, multiplicity, drawn from Song of Myself.","verification":"verified","source_url":"https://whitmanarchive.org/item/ppp.00270","explanation":"Whitman answers the charge of self-contradiction by treating identity as capacious rather than perfectly consistent. The line makes multiplicity part of the self instead of evidence that the self has failed to be coherent."},{"id":"Q0212","person":"Emily Dickinson","quote":"Tell all the truth but tell it slant -","source":"Emily Dickinson, poem 1263, Franklin Reading Edition","era":"19th century","tags":"truth; rhetoric","prov":"T","status":"Corrected to the exact first line presented by Poetry Foundation from the Franklin Reading Edition.","desc":"A sourced line concerning truth, rhetoric, drawn from Poem 1263.","verification":"verified","source_url":"https://www.poetryfoundation.org/poems/56824/tell-all-the-truth-but-tell-it-slant-1263","explanation":"Dickinson argues that some truths are better communicated indirectly because full intensity can overwhelm the recipient. 'Slant' is not simple dishonesty; it is a theory of calibrated revelation and oblique expression."},{"id":"Q0213","person":"Oscar Wilde","quote":"I can resist everything except temptation.","source":"Lady Windermere’s Fan","era":"19th century","tags":"wit; desire","prov":"T","status":"Verified against Project Gutenberg, Lady Windermere's Fan.","desc":"A sourced line concerning wit, desire, drawn from Lady Windermere’s Fan.","verification":"verified","source_
