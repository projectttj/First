<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0f1115"/>
<title>Quote Trainer</title>
<style>
:root{
  --bg:#0f1115;--panel:#181c23;--panel2:#202630;--text:#f4f6f8;--muted:#aeb7c4;
  --line:#323b49;--accent:#8ab4f8;--good:#7dd69c;--bad:#ff9393;--warn:#e7c26a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,select,input{font:inherit}
main{max-width:920px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px}
.controls{display:grid;grid-template-columns:1.2fr 1fr auto;gap:8px;margin-bottom:12px}
select,input,button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:translateY(1px)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.stat{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;min-height:410px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 35px rgba(0,0,0,.18)}
.quote{font-family:Georgia,"Times New Roman",serif;font-size:30px;line-height:1.38;margin:0 0 24px}
.author{font-size:22px;font-weight:750;margin-top:4px}
.meta{color:var(--muted);margin-top:10px;line-height:1.55}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;margin-right:6px;font-size:11px;color:var(--muted)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.answers button{text-align:left;padding:14px;min-height:54px}
.correct{border-color:var(--good)!important;box-shadow:inset 0 0 0 1px var(--good)}
.wrong{border-color:var(--bad)!important;box-shadow:inset 0 0 0 1px var(--bad)}
.revealBtn{width:100%;padding:15px;margin-top:8px}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.grade button{padding:12px 8px}
.answerBox{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
.hidden{display:none}
.nav{display:none}
.nav button{flex:1}
.small{font-size:12px;color:var(--muted)}
.searchResults{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:460px;overflow:auto}
.result{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left}
.result strong{display:block;margin-bottom:4px}
.matchGrid{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-top:12px}
.matchCol{display:flex;flex-direction:column;gap:8px}
.matchItem{min-height:64px;text-align:left}
.matchItem.selected{border-color:var(--accent)}
.matchItem.done{opacity:.45}
.footer{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.5}
@media(max-width:650px){
  main{padding-left:12px;padding-right:12px}
  header{display:block}.controls{grid-template-columns:1fr 1fr}.controls #search{grid-column:1/-1}
  .quote{font-size:24px}.answers{grid-template-columns:1fr}.grade{grid-template-columns:1fr 1fr}
  .card{padding:18px;min-height:390px}.matchGrid{grid-template-columns:1fr}
}
</style>
<!-- deploy-trigger -->
</head>
<body>
<main>
<header>
  <div>
    <h1>Quote Trainer</h1>
    <div class="sub">Exact quotation deck · quote ↔ author · local progress</div>
  </div>
</header>

<div class="controls">
  <select id="mode" aria-label="Study mode">
    <option value="study">Study / Reveal</option>
    <option value="q2a">Quote → Author</option>
    <option value="a2q">Author → Quote</option>
    <option value="match">Match 4</option>
    <option value="browse">Browse / Search</option>
  </select>
  <select id="era" aria-label="Era"><option value="">All eras</option></select>
  <input id="search" class="hidden" type="search" placeholder="Search quote, author, source, concept…" />
</div>

<div class="stats" id="stats"></div>
<div id="app"></div>
<div class="nav" id="nav"><button id="next">Next</button></div>
<div class="footer">
  Progress is stored only in this browser. T = direct textual quotation in the corpus; R = exact reported/fragmentary wording preserved through a cited source or tradition.
</div>

ted", "desc": "A reported, fragmentary, or mediated saying concerning wit, status; useful for the idea and historical voice, with attribution context shown."}, {"id": "Q0532", "person": "Mae West", "quote": "Between two evils, I always pick the one I never tried before.", "source": "Attributed to Mae West", "era": "20th century", "tags": "wit; risk", "prov": "R", "status": "Exact reported/fragmentary quotation in cited source or translation; historical speaker attribution is mediated", "desc": "A reported, fragmentary, or mediated saying concerning wit, risk; useful for the idea and historical voice, with attribution context shown."}];

const KEY="quoteTrainer_v4";
const defaultState={attempts:0,correct:0,seen:{},cards:{}};
let state;
let storageOK=true;
function freshState(){return JSON.parse(JSON.stringify(defaultState));}
try{
  const raw=window.localStorage.getItem(KEY);
  state=raw?JSON.parse(raw):freshState();
}catch(e){
  storageOK=false;
  state=freshState();
}
state.seen=state.seen||{};
state.cards=state.cards||{};
state.attempts=state.attempts||0;
state.correct=state.correct||0;

const app=document.getElementById("app");
const mode=document.getElementById("mode");
const era=document.getElementById("era");
const search=document.getElementById("search");
const stats=document.getElementById("stats");
const nextBtn=document.getElementById("next");
const nav=document.getElementById("nav");

[...new Set(DATA.map(x=>x.era).filter(Boolean))].sort().forEach(e=>{
  const o=document.createElement("option");o.value=e;o.textContent=e;era.appendChild(o);
});

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){
  try{window.localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}
  renderStats();
}
function pool(){
  return DATA.filter(x=>!era.value||x.era===era.value)
}
function shuffle(a){
  a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a
}
function cardState(id){
  return state.cards[id] ||= {box:0,due:0,seen:0,correct:0,wrong:0,last:0};
}
function chooseStudy(arr){
  const now=Date.now();
  const due=arr.filter(x=>cardState(x.id).due<=now);
  const source=due.length?due:arr;
  // Prefer unseen/weak cards, but retain some variety.
  return shuffle(source).sort((a,b)=>{
    const A=cardState(a.id),B=cardState(b.id);
    const aw=(A.seen===0?100:0)+(A.wrong*7)-(A.box*3);
    const bw=(B.seen===0?100:0)+(B.wrong*7)-(B.box*3);
    return bw-aw;
  })[0];
}
function chooseRandom(arr){return arr[Math.floor(Math.random()*arr.length)]}
function distractPeople(x,arr,n=3){
  const sameEra=shuffle([...new Set(arr.filter(y=>y.person!==x.person&&y.era===x.era).map(y=>y.person))]);
  const rest=shuffle([...new Set(arr.filter(y=>y.person!==x.person).map(y=>y.person))]);
  return [...new Set([...sameEra,...rest])].slice(0,n);
}
function distractQuotes(x,arr,n=3){
  const sameEra=shuffle(arr.filter(y=>y.id!==x.id&&y.person!==x.person&&y.era===x.era));
  const rest=shuffle(arr.filter(y=>y.id!==x.id&&y.person!==x.person));
  const out=[]; const used=new Set();
  for(const y of [...sameEra,...rest]){if(!used.has(y.id)){used.add(y.id);out.push(y)}if(out.length===n)break}
  return out;
}
function markSeen(x){
  state.seen[x.id]=1;
  const c=cardState(x.id);c.seen++;c.last=Date.now();
  save();
}
function recordTest(x,ok){
  state.attempts++;if(ok)state.correct++;
  const c=cardState(x.id);
  if(ok){c.correct++;c.box=Math.min(6,c.box+1)}else{c.wrong++;c.box=0}
  const mins=ok?[10,60,360,1440,4320,10080,43200][c.box]:2;
  c.due=Date.now()+mins*60*1000;c.last=Date.now();save();
}
function selfGrade(x,grade){
  const c=cardState(x.id);
  const schedule={
    again:[0,2], hard:[Math.max(0,c.box),20], good:[Math.min(6,c.box+1),240], easy:[Math.min(6,c.box+2),1440]
  };
  const [box,mins]=schedule[grade];c.box=box;c.due=Date.now()+mins*60*1000;c.last=Date.now();
  if(grade==="again")c.wrong++;else c.correct++;
  save();newCard();
}
function renderStats(){
  const known=Object.values(state.cards).filter(c=>c.box>=3).length;
  const learning=Object.values(state.cards).filter(c=>c.seen>0&&c.box<3).length;
  const due=DATA.filter(x=>cardState(x.id).seen>0&&cardState(x.id).due<=Date.now()).length;
  const acc=state.attempts?Math.round(100*state.correct/state.attempts):0;
  stats.innerHTML=`<span class="stat">${DATA.length} quotes</span><span class="stat">${Object.keys(state.seen).length} seen</span><span class="stat">${known} learned</span><span class="stat">${learning} learning</span><span class="stat">${due} due</span><span class="stat">${acc}% quiz accuracy</span>${storageOK?'':'<span class="stat">Session-only progress</span>'}`;
}
function metadata(x){
  return `<div class="meta"><span class="badge">${esc(x.prov)}</span>${esc(x.source||"Source not listed")} · ${esc(x.era||"")}<br>${esc(x.tags||"")}<br>${esc(x.desc||"")}</div>`;
}
function answerReveal(x){
  return `<div class="answerBox"><div class="author">— ${esc(x.person)}</div>${metadata(x)}</div>`;
}
function newCard(){
  search.classList.toggle("hidden",mode.value!=="browse");
  nextBtn.classList.toggle("hidden",mode.value==="browse"||mode.value==="match");
  const p=pool();
  if(!p.length){app.innerHTML='<div class="card">No cards match this filter.</div>';return}
  if(mode.value==="study")study(p);
  else if(mode.value==="q2a")q2a(p);
  else if(mode.value==="a2q")a2q(p);
  else if(mode.value==="match")match4(p);
  else browse();
}
function study(p){
  const x=chooseStudy(p);markSeen(x);
  app.innerHTML=`<div class="card">
    <div class="quote">“${esc(x.quote)}”</div>
    <button class="revealBtn" id="reveal">Reveal author & context</button>
    <div id="answer" class="hidden">${answerReveal(x)}
      <div class="grade">
        <button data-g="again">Again</button><button data-g="hard">Hard</button>
        <button data-g="good">Good</button><button data-g="easy">Easy</button>
      </div>
      <div class="small" style="margin-top:10px">Self-grade how easily you recalled the author/association. This controls review spacing.</div>
    </div>
  </div>`;
  document.getElementById("reveal").onclick=()=>{
    document.getElementById("answer").classList.remove("hidden");
    document.getElementById("reveal").classList.add("hidden");
  };
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>selfGrade(x,b.dataset.g));
}
function q2a(p){
  const x=chooseStudy(p);markSeen(x);
  const opts=shuffle([x.person,...distractPeople(x,p,3)]);
  app.innerHTML=`<div class="card"><div class="quote">“${esc(x.quote)}”</div>
    <div class="answers">${opts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div id="ex"></div></div>`;
  let answered=false;
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
    if(answered)return;answered=true;
    const ok=b.dataset.o===x.person;recordTest(x,ok);
    app.querySelectorAll("[data-o]").forEach(z=>{if(z.dataset.o===x.person)z.classList.add("correct")});
    if(!ok)b.classList.add("wrong");
    document.getElementById("ex").innerHTML=answerReveal(x)+`<button class="revealBtn" id="continue">Next →</button>`;
    document.getElementById("continue").onclick=newCard;
  });
}
function a2q(p){
  const x=chooseStudy(p);markSeen(x);
  const opts=shuffle([x,...distractQuotes(x,p,3)]);
  app.innerHTML=`<div class="card"><div class="author">${esc(x.person)}</div>
    <div class="meta">Which quotation is theirs?</div>
    <div class="answers">${opts.map(o=>`<button data-id="${esc(o.id)}">“${esc(o.quote)}”</button>`).join("")}</div>
    <div id="ex"></div></div>`;
  let answered=false;
  app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{
    if(answered)return;answered=true;
    const ok=b.dataset.id===x.id;recordTest(x,ok);
    app.querySelectorAll("[data-id]").forEach(z=>{if(z.dataset.id===x.id)z.classList.add("correct")});
    if(!ok)b.classList.add("wrong");
    document.getElementById("ex").innerHTML=metadata(x)+`<button class="revealBtn" id="continue">Next →</button>`;
    document.getElementById("continue").onclick=newCard;
  });
}
function match4(p){
  if(p.length<4){app.innerHTML='<div class="card">Need at least four cards in this filter for Match 4.</div>';return}
  let xs=shuffle(p).slice(0,4);
  // Prefer four unique authors.
  const unique=[];const seen=new Set();
  for(const x of shuffle(p)){if(!seen.has(x.person)){seen.add(x.person);unique.push(x)}if(unique.length===4)break}
  if(unique.length===4)xs=unique;
  xs.forEach(markSeen);
  const authors=shuffle(xs.map(x=>x.person));
  let selected=null,matched=0;
  app.innerHTML=`<div class="card">
    <div class="meta" style="margin-bottom:12px">Tap a quotation, then tap its author.</div>
    <div class="matchGrid">
      <div class="matchCol">${xs.map(x=>`<button class="matchItem" data-q="${esc(x.id)}">“${esc(x.quote)}”</button>`).join("")}</div>
      <div class="matchCol">${authors.map(a=>`<button class="matchItem" data-a="${esc(a)}">${esc(a)}</button>`).join("")}</div>
    </div>
    <div id="mmsg" class="meta"></div>
  </div>`;
  app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("done"))return;
    app.querySelectorAll("[data-q]").forEach(z=>z.classList.remove("selected"));
    b.classList.add("selected");selected=b.dataset.q;
  });
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    if(!selected||b.classList.contains("done"))return;
    const x=xs.find(z=>z.id===selected);
    const qbtn=[...app.querySelectorAll("[data-q]")].find(el=>el.dataset.q===selected);
    const ok=b.dataset.a===x.person;recordTest(x,ok);
    if(ok){
      b.classList.add("correct","done");qbtn.classList.add("correct","done");qbtn.classList.remove("selected");
      selected=null;matched++;document.getElementById("mmsg").textContent=`${matched}/4 matched`;
      if(matched===4)setTimeout(()=>match4(pool()),350);
    }else{
      b.classList.add("wrong");setTimeout(()=>b.classList.remove("wrong"),450);
      document.getElementById("mmsg").textContent=`Not that one — try again.`;
    }
  });
}
function browse(){
  const q=(search.value||"").trim().toLowerCase();
  const p=pool().filter(x=>!q||[x.quote,x.person,x.source,x.tags,x.era].some(v=>String(v||"").toLowerCase().includes(q))).slice(0,100);
  app.innerHTML=`<div class="card" style="justify-content:flex-start">
    <div class="small">${p.length}${p.length===100?"+" : ""} result${p.length===1?"":"s"}</div>
    <div class="searchResults">${p.map(x=>`<button class="result" data-r="${esc(x.id)}"><strong>${esc(x.person)}</strong>“${esc(x.quote)}”</button>`).join("")}</div>
  </div>`;
  app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const x=DATA.find(z=>z.id===b.dataset.r);
    app.innerHTML=`<div class="card"><div class="quote">“${esc(x.quote)}”</div>${answerReveal(x)}</div>`;
  });
}
nextBtn.onclick=newCard;
mode.onchange=()=>{search.value="";newCard()};
era.onchange=newCard;
search.oninput=browse;

document.addEventListener("keydown",e=>{
  if(e.key===" "&&mode.value==="study"){
    e.preventDefault();const r=document.getElementById("reveal");if(r&&!r.classList.contains("hidden"))r.click();
  }
  if(e.key==="ArrowRight"&&mode.value!=="browse")newCard();
});
renderStats();newCard();
</script>
</main>
