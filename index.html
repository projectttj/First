url":"https://www.gutenberg.org/files/790/790-h/790-h","explanation":"The line works by turning a claim of self-control into its comic negation: the speaker can resist everything except the very category that tests resistance. Wilde compresses character, hypocrisy, and paradox into an epigram."},{"id":"Q0214","person":"Oscar Wilde","quote":"The only way to get rid of a temptation is to yield to it.","source":"The Picture of Dorian Gray","era":"19th century","tags":"desire; paradox","prov":"T","status":"Verified against the 1891 text of The Picture of Dorian Gray on Wikisource.","desc":"A sourced line concerning desire, paradox, drawn from The Picture of Dorian Gray.","verification":"verified","source_url":"https://en.wikisource.org/wiki/The_Picture_of_Dorian_Gray_%281891%29/Chapter_2","explanation":"Lord Henry turns repression into a theory of intensified desire: forbidding an impulse can make it psychologically more dominant. The sentence is intentionally seductive rhetoric from a manipulative character, not a neutral ethical recommendation."},{"id":"Q0215","person":"Oscar Wilde","quote":"We are all in the gutter, but some of us are looking at the stars.","source":"Lady Windermere’s Fan","era":"19th century","tags":"aspiration; wit","prov":"T","status":"Verified against Project Gutenberg, Lady Windermere's Fan.","desc":"A sourced line concerning aspiration, wit, drawn from Lady Windermere’s Fan.","verification":"verified","source_url":"https://www.gutenberg.org/files/790/790-h/790-h","explanation":"Wilde juxtaposes degraded circumstances with aspirational attention. The line survives because it allows dignity or imagination to be located not in one's position but in what one continues to look toward."},{"id":"Q0216","person":"Oscar Wilde","quote":"Experience was of no ethical value. It was merely the name men gave to their mistakes.","source":"The Picture of Dorian Gray","era":"19th century","tags":"experience; error","prov":"T","status":"Corrected to exact 1891 text in The Picture of Dorian Gray; previous wording modernized the tense.","desc":"A sourced line concerning experience, error, drawn from The Picture of Dorian Gray.","verification":"verified","source_url":"https://en.wikisource.org/wiki/The_Picture_of_Dorian_Gray_%281891%29/Chapter_4","explanation":"The narrator undercuts the comforting idea that experience automatically teaches wisdom. Repetition of error is possible even after recognition, because knowing that an act harmed us does not necessarily remove the motive that produced it."},{"id":"Q0217","person":"Ambrose Bierce","quote":"Politics: a strife of interests masquerading as a contest of principles.","source":"The Devil’s Dictionary","era":"19th/20th century","tags":"politics; cynicism","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning politics, cynicism, drawn from The Devil’s Dictionary.","verification":"pending"},{"id":"Q0218","person":"William James","quote":"My experience is what I agree to attend to.","source":"Principles of Psychology","era":"19th century","tags":"attention; experience","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning attention, experience, drawn from Principles of Psychology.","verification":"pending"},{"id":"Q0219","person":"Lord Acton","quote":"Power tends to corrupt, and absolute power corrupts absolutely.","source":"Letter to Bishop Creighton","era":"19th century","tags":"power; corruption","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning power, corruption, drawn from Letter to Bishop Creighton.","verification":"pending"},{"id":"Q0220","person":"Anton Chekhov","quote":"If in the first act you have hung a pistol on the wall, then in the following one it should be fired.","source":"Letter / dramatic principle","era":"19th century","tags":"narrative; causality","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning narrative, causality; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0221","person":"George Bernard Shaw","quote":"The reasonable man adapts himself to the world; the unreasonable one persists in trying to adapt the world to himself.","source":"Man and Superman","era":"20th century","tags":"adaptation; change","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning adaptation, change, drawn from Man and Superman.","verification":"pending"},{"id":"Q0222","person":"George Bernard Shaw","quote":"All progress depends on the unreasonable man.","source":"Man and Superman","era":"20th century","tags":"progress; nonconformity","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning progress, nonconformity, drawn from Man and Superman.","verification":"pending"},{"id":"Q0223","person":"George Santayana","quote":"Those who cannot remember the past are condemned to repeat it.","source":"The Life of Reason","era":"20th century","tags":"history; memory","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning history, memory, drawn from The Life of Reason.","verification":"pending"},{"id":"Q0224","person":"George Santayana","quote":"Fanaticism consists in redoubling your effort when you have forgotten your aim.","source":"Life of Reason","era":"20th century","tags":"goals; fanaticism","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning goals, fanaticism, drawn from Life of Reason.","verification":"pending"},{"id":"Q0225","person":"W. E. B. Du Bois","quote":"The problem of the twentieth century is the problem of the color-line.","source":"The Souls of Black Folk","era":"20th century","tags":"race; society","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning race, society, drawn from The Souls of Black Folk.","verification":"pending"},{"id":"Q0226","person":"W. B. Yeats","quote":"Things fall apart; the centre cannot hold.","source":"The Second Coming","era":"20th century","tags":"disorder; collapse","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning disorder, collapse, drawn from The Second Coming.","verification":"pending"},{"id":"Q0227","person":"W. B. Yeats","quote":"In dreams begins responsibility.","source":"Responsibilities","era":"20th century","tags":"dreams; responsibility","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning dreams, responsibility, drawn from Responsibilities.","verification":"pending"},{"id":"Q0228","person":"Franz Kafka","quote":"A book must be the axe for the frozen sea within us.","source":"Letter to Oskar Pollak","era":"20th century","tags":"books; transformation","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning books, transformation, drawn from Letter to Oskar Pollak.","verification":"pending"},{"id":"Q0229","person":"Franz Kafka","quote":"There is an infinite amount of hope in the universe—but not for us.","source":"Reported by Max Brod","era":"20th century","tags":"absurdity; hope","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning absurdity, hope; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0230","person":"T. S. Eliot","quote":"Where is the wisdom we have lost in knowledge? Where is the knowledge we have lost in information?","source":"The Rock","era":"20th century","tags":"knowledge; information","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning knowledge, information, drawn from The Rock.","verification":"pending"},{"id":"Q0231","person":"T. S. Eliot","quote":"We shall not cease from exploration.","source":"Four Quartets","era":"20th century","tags":"exploration; return","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning exploration, return, drawn from Four Quartets.","verification":"pending"},{"id":"Q0232","person":"Virginia Woolf","quote":"A woman must have money and a room of her own if she is to write fiction.","source":"A Room of One’s Own","era":"20th century","tags":"writing; independence","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning writing, independence, drawn from A Room of One’s Own.","verification":"pending"},{"id":"Q0233","person":"James Joyce","quote":"History is a nightmare from which I am trying to awake.","source":"Ulysses","era":"20th century","tags":"history; modernity","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning history, modernity, drawn from Ulysses.","verification":"pending"},{"id":"Q0234","person":"Ernest Hemingway","quote":"The world breaks everyone and afterward many are strong at the broken places.","source":"A Farewell to Arms","era":"20th century","tags":"adversity; strength","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning adversity, strength, drawn from A Farewell to Arms.","verification":"pending"},{"id":"Q0235","person":"F. Scott Fitzgerald","quote":"So we beat on, boats against the current, borne back ceaselessly into the past.","source":"The Great Gatsby","era":"20th century","tags":"time; memory","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning time, memory, drawn from The Great Gatsby.","verification":"pending"},{"id":"Q0236","person":"George Orwell","quote":"Who controls the past controls the future: who controls the present controls the past.","source":"George Orwell, Nineteen Eighty-Four","era":"20th century","tags":"history; power","prov":"T","status":"Corrected punctuation and verified against Penguin's official Nineteen Eighty-Four edition page.","desc":"A sourced line concerning history, power, drawn from Nineteen Eighty-Four.","verification":"verified","source_url":"https://www.penguin.co.uk/books/57013/nineteen-eighty-four-by-orwell-george/9780141989952","explanation":"The Party slogan describes a feedback loop between records, institutional power, and public memory. If authority can continually rewrite evidence of the past, it can narrow what people regard as true or possible in the present."},{"id":"Q0237","person":"George Orwell","quote":"If liberty means anything at all, it means the right to tell people what they do not want to hear.","source":"Preface to Animal Farm","era":"20th century","tags":"liberty; speech","prov":"T","status":"Verified against Orwell's proposed preface to Animal Farm via the Orwell Foundation.","desc":"A sourced line concerning liberty, speech, drawn from Preface to Animal Farm.","verification":"verified","source_url":"https://www.orwellfoundation.com/the-orwell-foundation/orwell/essays-and-other-works/the-freedom-of-the-press/","explanation":"Orwell defines intellectual liberty by the hard case rather than the easy one: speech matters most when its audience dislikes what is being said. The line therefore treats tolerance of unwelcome claims as the real test of a free-speech norm."},{"id":"Q0238","person":"George Orwell","quote":"All animals are equal, but some animals are more equal than others.","source":"Animal Farm","era":"20th century","tags":"power; hypocrisy","prov":"T","status":"Verified against the Orwell Foundation's Animal Farm quotation and context.","desc":"A sourced line concerning power, hypocrisy, drawn from Animal Farm.","verification":"verified","source_url":"https://www.orwellfoundation.com/the-orwell-youth-prize/for-young-writers/george-orwell-fairness/","explanation":"The contradiction is deliberate: the language of equality is preserved while hierarchy is smuggled back into the rule itself. Orwell uses logical absurdity to show how political language can be made to legitimize the opposite of its stated principle."},{"id":"Q0239","person":"Aldous Huxley","quote":"Facts do not cease to exist because they are ignored.","source":"Proper Studies","era":"20th century","tags":"facts; denial","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning facts, denial, drawn from Proper Studies.","verification":"pending"},{"id":"Q0240","person":"Bertrand Russell","quote":"The good life is one inspired by love and guided by knowledge.","source":"What I Believe","era":"20th century","tags":"ethics; knowledge","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning ethics, knowledge, drawn from What I Believe.","verification":"pending"},{"id":"Q0241","person":"Bertrand Russell","quote":"It is undesirable to believe a proposition when there is no ground whatever for supposing it true.","source":"Skeptical Essays","era":"20th century","tags":"evidence; belief","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning evidence, belief, drawn from Skeptical Essays.","verification":"pending"},{"id":"Q0242","person":"Albert Einstein","quote":"Imagination is more important than knowledge. Knowledge is limited. Imagination encircles the world.","source":"Albert Einstein, interview with George Sylvester Viereck, The Saturday Evening Post, 26 October 1929","era":"20th century","tags":"imagination; knowledge","prov":"T","status":"Expanded and verified against the original 1929 Saturday Evening Post interview scan.","desc":"A reported, fragmentary, or mediated saying concerning imagination, knowledge; useful for the idea and historical voice, with attribution context shown.","verification":"verified","source_url":"https://www.saturdayeveningpost.com/wp-content/uploads/satevepost/what_life_means_to_einstein.pdf","explanation":"Einstein answers a question about intuition and scientific discovery by distinguishing accumulated knowledge from the capacity to form possibilities beyond what is already known. The point is not that evidence is dispensable, but that discovery requires generating hypotheses before evidence can test them."},{"id":"Q0243","person":"Albert Einstein","quote":"I, at any rate, am convinced that He is not playing at dice.","source":"Albert Einstein to Max Born, 4 December 1926; English translation in The Born–Einstein Letters","era":"20th century","tags":"determinism; physics","prov":"T","status":"Corrected from the popular compression 'God does not play dice' to the published English translation of Einstein's 4 December 1926 letter to Max Born, reproduced by Physics Today.","desc":"A reported, fragmentary, or mediated saying concerning determinism, physics; useful for the idea and historical voice, with attribution context shown.","verification":"verified","source_url":"https://physicstoday.aip.org/letters/albert-einstein-to-max-born-1","explanation":"Einstein's metaphor expresses dissatisfaction with treating quantum probability as a complete account of physical reality. It was not a rejection of quantum theory's empirical success; he suspected that the probabilistic formalism did not exhaust the underlying structure of nature."},{"id":"Q0244","person":"Werner Heisenberg","quote":"What we observe is not nature itself, but nature exposed to our method of questioning.","source":"Physics and Philosophy","era":"20th century","tags":"observation; epistemology","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning observation, epistemology, drawn from Physics and Philosophy.","verification":"pending"},{"id":"Q0245","person":"Erwin Schrödinger","quote":"The world is given to me only once, not one existing and one perceived.","source":"My View of the World","era":"20th century","tags":"mind; world","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning mind, world, drawn from My View of the World.","verification":"pending"},{"id":"Q0246","person":"Richard Feynman","quote":"What I cannot create, I do not understand.","source":"Richard Feynman's final Caltech office blackboard","era":"20th century","tags":"understanding; creation","prov":"R","status":"Transmission verified from Caltech's archival account and reproduction of Feynman's final office blackboard.","desc":"A reported, fragmentary, or mediated saying concerning understanding, creation; useful for the idea and historical voice, with attribution context shown.","verification":"reported","source_url":"https://calteches.library.caltech.edu/684/2/Feynman.pdf","explanation":"The blackboard line treats constructive ability as a stringent test of understanding. To reproduce or derive a phenomenon from components forces hidden assumptions to become explicit in a way that verbal familiarity may not."},{"id":"Q0247","person":"Richard Feynman","quote":"The first principle is that you must not fool yourself—and you are the easiest person to fool.","source":"Caltech commencement address","era":"20th century","tags":"self-deception; science","prov":"T","status":"Verified against Caltech's archive of Feynman's 1974 commencement address.","desc":"A sourced line concerning self-deception, science, drawn from Caltech commencement address.","verification":"verified","source_url":"https://calteches.library.caltech.edu/3043/","explanation":"Feynman makes self-deception the first methodological hazard because bias begins before anyone deliberately lies to someone else. Scientific integrity requires searching for information that could weaken one's own conclusion."},{"id":"Q0248","person":"Alan Turing","quote":"We can only see a short distance ahead, but we can see plenty there that needs to be done.","source":"Computing Machinery and Intelligence","era":"20th century","tags":"AI; action","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning AI, action, drawn from Computing Machinery and Intelligence.","verification":"pending"},{"id":"Q0249","person":"Claude Shannon","quote":"I visualize a time when we will be to robots what dogs are to humans.","source":"Omni interview, 'The Smartest Man in the World' (1979)","era":"20th century","tags":"AI; future","prov":"T","status":"Pending source audit: prior verified label lacked the source-link/explanation evidence required by the current standard.","desc":"A sourced line concerning AI, future, drawn from Omni interview, 'The Smartest Man in the World' (1979).","verification":"pending","prior_verification":"verified"},{"id":"Q0250","person":"Norbert Wiener","quote":"We are not stuff that abides, but patterns that perpetuate themselves.","source":"The Human Use of Human Beings","era":"20th century","tags":"systems; identity","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning systems, identity, drawn from The Human Use of Human Beings.","verification":"pending"},{"id":"Q0251","person":"Karl Popper","quote":"Our knowledge can only be finite, while our ignorance must necessarily be infinite.","source":"Conjectures and Refutations","era":"20th century","tags":"knowledge; ignorance","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning knowledge, ignorance, drawn from Conjectures and Refutations.","verification":"pending"},{"id":"Q0252","person":"Karl Popper","quote":"We are not students of some subject matter, but students of problems.","source":"Conjectures and Refutations","era":"20th century","tags":"problems; inquiry","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning problems, inquiry, drawn from Conjectures and Refutations.","verification":"pending"},{"id":"Q0253","person":"Thomas Kuhn","quote":"Normal science does not aim at novelties of fact or theory and, when successful, finds none.","source":"The Structure of Scientific Revolutions, p. 52","era":"20th century","tags":"science; paradigms","prov":"T","status":"Verified against a scan of The Structure of Scientific Revolutions, p. 52.","desc":"A sourced line concerning science, paradigms, drawn from The Structure of Scientific Revolutions.","verification":"verified","source_url":"https://www.philosophyandlaw.org/Class%20Readings/Kuhn/KuhnScientificRevolutions.pdf","explanation":"Kuhn's 'normal science' is puzzle-solving inside an accepted paradigm, so its immediate aim is refinement rather than revolution. The paradox is that disciplined work under a paradigm can nevertheless generate anomalies that later help destabilize it."},{"id":"Q0254","person":"E. O. Wilson","quote":"The real problem of humanity is the following: we have Paleolithic emotions, medieval institutions, and godlike technology.","source":"Attributed lecture/interview","era":"20th century","tags":"evolution; institutions; technology","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning evolution, institutions, technology; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0255","person":"Viktor Frankl","quote":"He who has a why to live for can bear almost any how.","source":"Man’s Search for Meaning, quoting Nietzsche","era":"20th century","tags":"meaning; endurance","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning meaning, endurance; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0256","person":"Viktor Frankl","quote":"When we are no longer able to change a situation, we are challenged to change ourselves.","source":"Man’s Search for Meaning","era":"20th century","tags":"adaptation; agency","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning adaptation, agency, drawn from Man’s Search for Meaning.","verification":"pending"},{"id":"Q0257","person":"Sigmund Freud","quote":"The ego is not master in its own house.","source":"A Difficulty in the Path of Psycho-Analysis","era":"20th century","tags":"psychology; unconscious","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning psychology, unconscious, drawn from A Difficulty in the Path of Psycho-Analysis.","verification":"pending"},{"id":"Q0258","person":"B. F. Skinner","quote":"The real problem is not whether machines think but whether men do.","source":"Contingencies of Reinforcement","era":"20th century","tags":"AI; cognition","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning AI, cognition, drawn from Contingencies of Reinforcement.","verification":"pending"},{"id":"Q0259","person":"Daniel Kahneman","quote":"Nothing in life is as important as you think it is while you are thinking about it.","source":"Thinking, Fast and Slow","era":"21st century","tags":"attention; focusing illusion","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning attention, focusing illusion, drawn from Thinking, Fast and Slow.","verification":"pending"},{"id":"Q0260","person":"Marshall McLuhan","quote":"The medium is the message.","source":"Understanding Media","era":"20th century","tags":"media; systems","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning media, systems, drawn from Understanding Media.","verification":"pending"},{"id":"Q0261","person":"Peter Drucker","quote":"There is surely nothing quite so useless as doing with great efficiency what should not be done at all.","source":"Managing for Business Effectiveness, Harvard Business Review, May 1963","era":"20th century","tags":"efficiency; goals","prov":"T","status":"Corrected to Drucker's exact 1963 Harvard Business Review wording.","desc":"A sourced line concerning efficiency, goals, drawn from Management writings.","verification":"verified","source_url":"https://hbr.org/1963/05/managing-for-business-effectiveness","explanation":"Drucker distinguishes efficiency from effectiveness. Optimizing execution cannot compensate for choosing the wrong activity; the first strategic question is whether the work deserves to be done at all."},{"id":"Q0262","person":"Herbert Simon","quote":"A wealth of information creates a poverty of attention.","source":"Designing Organizations for an Information-Rich World","era":"20th century","tags":"attention; information","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning attention, information, drawn from Designing Organizations for an Information-Rich World.","verification":"pending"},{"id":"Q0263","person":"Nassim Nicholas Taleb","quote":"Wind extinguishes a candle and energizes fire.","source":"Antifragile","era":"21st century","tags":"antifragility; stress","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning antifragility, stress, drawn from Antifragile.","verification":"pending"},{"id":"Q0264","person":"Jorge Luis Borges","quote":"I am not sure that I exist, actually. I am all the writers that I have read.","source":"Interview / attribution","era":"20th century","tags":"identity; books","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning identity, books; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0265","person":"Jorge Luis Borges","quote":"Time is the substance I am made of.","source":"A New Refutation of Time","era":"20th century","tags":"time; identity","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning time, identity, drawn from A New Refutation of Time.","verification":"pending"},{"id":"Q0266","person":"J. R. R. Tolkien","quote":"Not all those who wander are lost.","source":"The Fellowship of the Ring","era":"20th century","tags":"wandering; purpose","prov":"T","status":"Pending source-quality upgrade: wording may be correct, but the current supporting link is below the corpus's evidence standard.","desc":"A sourced line concerning wandering, purpose, drawn from The Fellowship of the Ring.","verification":"pending","source_url":"https://www.sparknotes.com/lit/fellowship/quotes/page/4/","explanation":"The line distinguishes movement from aimlessness. In context it describes Aragorn: an apparently rootless wanderer whose path is purposeful and whose hidden identity gives that wandering direction.","prior_verification":"verified"},{"id":"Q0267","person":"J. R. R. Tolkien","quote":"All we have to decide is what to do with the time that is given us.","source":"The Fellowship of the Ring","era":"20th century","tags":"time; agency","prov":"T","status":"Verified against the Tolkien Estate, which reproduces the line and identifies The Fellowship of the Ring.","desc":"A sourced line concerning time, agency, drawn from The Fellowship of the Ring.","verification":"verified","source_url":"https://www.tolkienestate.com/","explanation":"Gandalf separates uncontrollable historical circumstance from controllable response. The idea resembles a decision boundary: you do not choose the age you inherit, but you still choose what to do inside it."},{"id":"Q0268","person":"J. R. R. Tolkien","quote":"Faithless is he that says farewell when the road darkens.","source":"The Fellowship of the Ring","era":"20th century","tags":"loyalty; adversity","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning loyalty, adversity, drawn from The Fellowship of the Ring.","verification":"pending"},{"id":"Q0269","person":"Ursula K. Le Guin","quote":"We live in capitalism. Its power seems inescapable. So did the divine right of kings.","source":"National Book Awards speech","era":"21st century","tags":"systems; imagination","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning systems, imagination, drawn from National Book Awards speech.","verification":"pending"},{"id":"Q0270","person":"Frank Herbert","quote":"Fear is the mind-killer.","source":"Dune","era":"20th century","tags":"fear; cognition","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning fear, cognition, drawn from Dune.","verification":"pending"},{"id":"Q0271","person":"Arthur C. Clarke","quote":"Any sufficiently advanced technology is indistinguishable from magic.","source":"Profiles of the Future","era":"20th century","tags":"technology; perception","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning technology, perception, drawn from Profiles of the Future.","verification":"pending"},{"id":"Q0272","person":"Douglas Adams","quote":"The ships hung in the sky in much the same way that bricks don’t.","source":"The Hitchhiker’s Guide to the Galaxy","era":"20th century","tags":"wit; description","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning wit, description, drawn from The Hitchhiker’s Guide to the Galaxy.","verification":"pending"},{"id":"Q0273","person":"Joan Didion","quote":"We tell ourselves stories in order to live.","source":"The White Album","era":"20th century","tags":"narrative; meaning","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning narrative, meaning, drawn from The White Album.","verification":"pending"},{"id":"Q0274","person":"Susan Sontag","quote":"Interpretation is the revenge of the intellect upon art.","source":"Against Interpretation","era":"20th century","tags":"art; interpretation","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning art, interpretation, drawn from Against Interpretation.","verification":"pending"},{"id":"Q0275","person":"Martin Luther King Jr.","quote":"the arc of the moral universe is long, but it bends toward justice.","source":"Martin Luther King Jr., 'Where Do We Go From Here?' (1967); adapting Theodore Parker","era":"20th century","tags":"justice; history","prov":"T","status":"Verified in the Martin Luther King, Jr. Research and Education Institute transcript; King adapted an older Theodore Parker image.","desc":"A reported, fragmentary, or mediated saying concerning justice, history; useful for the idea and historical voice, with attribution context shown.","verification":"verified","source_url":"https://kinginstitute.stanford.edu/where-do-we-go-here","explanation":"King uses the arc as an expression of moral confidence without claiming that justice arrives automatically. In the speech it follows an argument for continued struggle, so the long arc describes a hoped-for direction sustained by action rather than passive historical inevitability."},{"id":"Q0276","person":"Martin Luther King Jr.","quote":"Injustice anywhere is a threat to justice everywhere.","source":"Letter from Birmingham Jail","era":"20th century","tags":"justice; systems","prov":"T","status":"Verified through the Martin Luther King, Jr. Research and Education Institute.","desc":"A sourced line concerning justice, systems, drawn from Letter from Birmingham Jail.","verification":"verified","source_url":"https://kinginstitute.stanford.edu/king-papers/documents/introduction-southwest-africa-uns-stepchild","explanation":"King treats injustice as structurally interconnected rather than geographically isolated. Tolerated injustice changes institutions, precedents, and moral expectations beyond the immediate case."},{"id":"Q0277","person":"Winston Churchill","quote":"We shall fight on the beaches.","source":"House of Commons speech, 4 June 1940","era":"20th century","tags":"war; resolve","prov":"T","status":"Verified against the UK Parliament record of Churchill's 4 June 1940 speech.","desc":"A sourced line concerning war, resolve, drawn from House of Commons speech, 4 June 1940.","verification":"verified","source_url":"https://www.parliament.uk/about/living-heritage/transformingsociety/private-lives/yourcountry/collections/churchillexhibition/churchill-the-orator/fight-on-the-beaches/","explanation":"The repetition turns strategic retreat at Dunkirk into a declaration of continued resistance. Its rhetorical structure matters as much as its content: escalating locations create a sense that resistance will persist under progressively worse conditions."},{"id":"Q0278","person":"Franklin D. Roosevelt","quote":"The only thing we have to fear is fear itself.","source":"First Inaugural Address","era":"20th century","tags":"fear; politics","prov":"T","status":"Verified against the National Archives record of Roosevelt's First Inaugural.","desc":"A sourced line concerning fear, politics, drawn from First Inaugural Address.","verification":"verified","source_url":"https://www.archives.gov/education/lessons/fdr-inaugural","explanation":"Roosevelt identifies fear itself as a causal force capable of worsening an economic crisis by paralyzing action. The sentence reframes a psychological state as part of the system producing the material problem."},{"id":"Q0279","person":"John F. Kennedy","quote":"Ask not what your country can do for you—ask what you can do for your country.","source":"Inaugural Address","era":"20th century","tags":"service; citizenship","prov":"T","status":"Verified against the JFK Presidential Library's inaugural-address materials.","desc":"A sourced line concerning service, citizenship, drawn from Inaugural Address.","verification":"verified","source_url":"https://www.jfklibrary.org/sites/default/files/2020-06/Rhetoric%20of%20the%20Inaugural%20Address%202020.pdf","explanation":"Kennedy reverses the expected direction of political demand: citizenship is framed not only as receiving benefits from the state but as contributing to a common project. The antimetabole makes the reversal unusually memorable."},{"id":"Q0280","person":"Dwight Eisenhower","quote":"Plans are worthless, but planning is everything.","source":"Dwight D. Eisenhower, National Defense Executive Reserve Conference, 14 November 1957","era":"20th century","tags":"planning; uncertainty","prov":"T","status":"Verified against the Dwight D. Eisenhower Presidential Library's official quotation record.","desc":"A reported, fragmentary, or mediated saying concerning planning, uncertainty; useful for the idea and historical voice, with attribution context shown.","verification":"verified","source_url":"https://www.eisenhowerlibrary.gov/eisenhowers/quotes","explanation":"Eisenhower distinguishes a static plan from the cognitive process of planning. The prepared mind has already explored contingencies, constraints, resources, and alternatives, so it can adapt when the original plan collides with reality."},{"id":"Q0281","person":"Helmuth von Moltke","quote":"No plan of operations extends with any certainty beyond the first contact with the main hostile force.","source":"Moltke, military writings; English translation cited by U.S. Army University Press","era":"19th century","tags":"planning; friction","prov":"T","status":"Corrected to the documented English translation cited by U.S. Army University Press.","desc":"A sourced line concerning planning, friction, drawn from Military writings.","verification":"verified","source_url":"https://www.armyupress.army.mil/Journals/Military-Review/Online-Exclusive/2016-Online-Exclusive-Articles/German-Mission-Orders/","explanation":"Moltke is not rejecting planning. He is saying that interaction with an intelligent opponent changes the state of the system, so plans must be designed to adapt once new information and unforeseen constraints appear."},{"id":"Q0282","person":"Mao Zedong","quote":"Political power grows out of the barrel of a gun.","source":"Problems of War and Strategy","era":"20th century","tags":"power; coercion","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning power, coercion, drawn from Problems of War and Strategy.","verification":"pending"},{"id":"Q0283","person":"Hannah Arendt","quote":"The sad truth is that most evil is done by people who never make up their minds to be good or evil.","source":"The Life of the Mind","era":"20th century","tags":"evil; thoughtlessness","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning evil, thoughtlessness, drawn from The Life of the Mind.","verification":"pending"},{"id":"Q0284","person":"Simone de Beauvoir","quote":"One is not born, but rather becomes, a woman.","source":"The Second Sex","era":"20th century","tags":"identity; society","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning identity, society, drawn from The Second Sex.","verification":"pending"},{"id":"Q0285","person":"Albert Camus","quote":"In the depth of winter, I finally learned that within me there lay an invincible summer.","source":"Return to Tipasa","era":"20th century","tags":"resilience; self","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning resilience, self, drawn from Return to Tipasa.","verification":"pending"},{"id":"Q0286","person":"Albert Camus","quote":"The struggle itself toward the heights is enough to fill a man’s heart.","source":"The Myth of Sisyphus","era":"20th century","tags":"struggle; meaning","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning struggle, meaning, drawn from The Myth of Sisyphus.","verification":"pending"},{"id":"Q0287","person":"Jean-Paul Sartre","quote":"Man is condemned to be free.","source":"Existentialism Is a Humanism","era":"20th century","tags":"freedom; responsibility","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning freedom, responsibility, drawn from Existentialism Is a Humanism.","verification":"pending"},{"id":"Q0288","person":"Jean-Paul Sartre","quote":"Hell is other people.","source":"No Exit","era":"20th century","tags":"social perception; self","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning social perception, self, drawn from No Exit.","verification":"pending"},{"id":"Q0289","person":"Michel Foucault","quote":"Where there is power, there is resistance.","source":"History of Sexuality I","era":"20th century","tags":"power; resistance","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning power, resistance, drawn from History of Sexuality I.","verification":"pending"},{"id":"Q0290","person":"Michel Foucault","quote":"Knowledge is not made for understanding; it is made for cutting.","source":"Nietzsche, Genealogy, History","era":"20th century","tags":"knowledge; critique","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning knowledge, critique, drawn from Nietzsche, Genealogy, History.","verification":"pending"},{"id":"Q0291","person":"Thomas Szasz","quote":"If you talk to God, you are praying; if God talks to you, you have schizophrenia.","source":"The Second Sin","era":"20th century","tags":"psychiatry; norms","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning psychiatry, norms, drawn from The Second Sin.","verification":"pending"},{"id":"Q0292","person":"G. K. Chesterton","quote":"The Christian ideal has not been tried and found wanting; it has been found difficult and left untried.","source":"What’s Wrong with the World","era":"20th century","tags":"ideals; practice","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning ideals, practice, drawn from What’s Wrong with the World.","verification":"pending"},{"id":"Q0293","person":"Charles Sanders Peirce","quote":"Do not block the way of inquiry.","source":"First Rule of Logic","era":"19th/20th century","tags":"inquiry; openness","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning inquiry, openness, drawn from First Rule of Logic.","verification":"pending"},{"id":"Q0294","person":"Alfred North Whitehead","quote":"Civilization advances by extending the number of important operations which we can perform without thinking about them.","source":"Introduction to Mathematics","era":"20th century","tags":"automation; cognition","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning automation, cognition, drawn from Introduction to Mathematics.","verification":"pending"},{"id":"Q0295","person":"Alfred North Whitehead","quote":"The safest general characterization of the European philosophical tradition is that it consists of a series of footnotes to Plato.","source":"Process and Reality","era":"20th century","tags":"philosophy; tradition","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning philosophy, tradition, drawn from Process and Reality.","verification":"pending"},{"id":"Q0296","person":"Gregory Bateson","quote":"Information is a difference that makes a difference.","source":"Steps to an Ecology of Mind","era":"20th century","tags":"information; systems","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning information, systems, drawn from Steps to an Ecology of Mind.","verification":"pending"},{"id":"Q0297","person":"Stafford Beer","quote":"The purpose of a system is what it does.","source":"Attributed POSIWID principle","era":"20th century","tags":"systems; function","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning systems, function; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0298","person":"Donella Meadows","quote":"We can’t control systems or figure them out. But we can dance with them.","source":"Dancing with Systems","era":"20th century","tags":"systems; humility","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning systems, humility, drawn from Dancing with Systems.","verification":"pending"},{"id":"Q0299","person":"John Maynard Keynes","quote":"In the long run we are all dead.","source":"A Tract on Monetary Reform","era":"20th century","tags":"time horizon; economics","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning time horizon, economics, drawn from A Tract on Monetary Reform.","verification":"pending"},{"id":"Q0300","person":"Milton Friedman","quote":"There is no such thing as a free lunch.","source":"Popularized phrase","era":"20th century","tags":"tradeoffs; economics","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning tradeoffs, economics; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0301","person":"Solon / Herodotus","quote":"Call no man happy until he is dead.","source":"Herodotus, Histories I.32","era":"Ancient Greece","tags":"fortune; life; judgment","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning fortune, life, judgment; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0302","person":"Plato","quote":"wonder is the feeling of a philosopher, and philosophy begins in wonder.","source":"Theaetetus 155d","era":"Ancient Greece","tags":"wonder; philosophy; inquiry","prov":"T","status":"Verified against Benjamin Jowett's translation of Theaetetus 155d.","desc":"A sourced line concerning wonder, philosophy, inquiry, drawn from Theaetetus 155d.","verification":"verified","source_url":"https://classics.mit.edu/Plato/theatu.html","explanation":"Socrates treats perplexity not as failure but as the emotional beginning of inquiry. Philosophy starts when familiar things cease to seem self-explanatory."},{"id":"Q0303","person":"Epictetus","quote":"Men are disturbed, not by things, but by the principles and notions which they form concerning things.","source":"Epictetus, Enchiridion 5, Elizabeth Carter translation","era":"Roman Empire","tags":"judgment; emotion; control","prov":"T","status":"Corrected to Elizabeth Carter's exact translation in the MIT Internet Classics Archive.","desc":"A sourced line concerning judgment, emotion, control, drawn from Enchiridion 5.","verification":"verified","source_url":"https://classics.mit.edu/Epictetus/epicench.html","explanation":"Epictetus distinguishes events from the judgments applied to them. The doctrine does not imply that external events are unreal; it claims that much avoidable disturbance depends on the evaluative interpretation layered onto them."},{"id":"Q0304","person":"Epictetus","quote":"First, say to yourself what you would be; and then do what you have to do.","source":"Discourses III.23 / associated translation","era":"Roman Empire","tags":"identity; action; discipline","prov":"T","status":"Corrected punctuation and verified against Elizabeth Carter's translation of Discourses III.23.","desc":"A sourced line concerning identity, action, discipline, drawn from Discourses III.23 / associated translation.","verification":"verified","source_url":"https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0237%3Atext%3Ddisc%3Abook%3D3","explanation":"Epictetus puts identity and ends before isolated action. Training makes sense only after deciding what kind of agent the repeated actions are meant to produce."},{"id":"Q0306","person":"Seneca","quote":"While we are postponing, life speeds by.","source":"Seneca, Moral Letters to Lucilius, Letter 1, Richard M. Gummere translation","era":"Roman Empire","tags":"time; procrastination; mortality","prov":"T","status":"Verified against Richard M. Gummere's public-domain translation on Wikisource.","desc":"A sourced line concerning time, procrastination, mortality, drawn from Letters to Lucilius 1.","verification":"verified","source_url":"https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_1","explanation":"Seneca's first letter treats time as the one possession that cannot be replaced. Delay is therefore not neutral waiting: postponed living consumes the same finite resource one is postponing life in order to preserve."},{"id":"Q0307","person":"Marcus Aurelius","quote":"If it is not right, do not do it: if it is not true, do not say it.","source":"Marcus Aurelius, Meditations XII.17, George Long translation","era":"Roman Empire","tags":"ethics; speech; discipline","prov":"T","status":"Verified against George Long's public-domain translation in Project Gutenberg.","desc":"A sourced line concerning ethics, speech, discipline, drawn from Meditations XII.17.","verification":"verified","source_url":"https://www.gutenberg.org/files/15877/15877-h/15877-h.htm","explanation":"Marcus reduces practical conduct to two filters: justice for action and truth for speech. The compactness is part of its force—complex situations still require judgment, but the governing constraints remain simple."},{"id":"Q0308","person":"Marcus Aurelius","quote":"The best way of avenging thyself is not to become like the wrong-doer.","source":"Marcus Aurelius, Meditations VI.6, George Long translation","era":"Roman Empire","tags":"revenge; character; self-command","prov":"T","status":"Verified against George Long's public-domain translation in Project Gutenberg.","desc":"A sourced line concerning revenge, character, self-command, drawn from Meditations VI.6.","verification":"verified","source_url":"https://www.gutenberg.org/files/15877/15877-h/15877-h.htm","explanation":"Marcus treats imitation of the offender as a second injury, this time to one's own character. Retaliation becomes self-defeating when the response reproduces the vice that originally justified resentment."},{"id":"Q0310","person":"Cicero","quote":"the authority of those who profess to teach is often a positive hindrance to those who desire to learn;","source":"On the Nature of the Gods I","era":"Roman Republic","tags":"authority; learning; skepticism","prov":"T","status":"Corrected to H. Rackham's identified translation of Cicero, De Natura Deorum I.10.","desc":"A sourced line concerning authority, learning, skepticism, drawn from On the Nature of the Gods I.","verification":"verified","source_url":"https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Cicero/de_Natura_Deorum/1A%2A.html","explanation":"Cicero contrasts authority with argument. The danger is epistemic outsourcing: students stop applying their own judgment and treat a master's verdict as if status could substitute for reasons."},{"id":"Q0311","person":"Cicero","quote":"To be ignorant of what occurred before you were born is to remain always a child.","source":"Orator 120 / Brutus tradition","era":"Roman Republic","tags":"history; maturity; memory","prov":"T","status":"Verified as a direct English translation of Cicero, Orator 120, with the Latin source identified.","desc":"A sourced line concerning history, maturity, memory, drawn from Orator 120 / Brutus tradition.","verification":"verified","source_url":"https://libraries.colorado.edu/about/history/george-norlin","explanation":"Cicero makes historical memory part of intellectual adulthood. A person who knows only the span of their own experience lacks the comparisons, precedents, and inherited examples needed for mature judgment."},{"id":"Q0312","person":"Boethius","quote":"This is my art, this the game I never cease to play. I turn the wheel that spins.","source":"Consolation of Philosophy II","era":"Late Antiquity","tags":"fortune; change; uncertainty","prov":"T","status":"Replaced the modern 'Inconsistency is my very essence' rendering with H. R. James's exact public-domain translation of Fortune's speech in Book II.","desc":"A sourced line concerning fortune, change, uncertainty, drawn from Consolation of Philosophy II.","verification":"verified","source_url":"https://www.gutenberg.org/files/14328/14328-h/14328-h.htm","explanation":"Fortune defines changeability as her constitutive rule. Expecting her gifts to become permanent is therefore a category error: the same wheel that raises a person contains the mechanism of descent."},{"id":"Q0313","person":"Ibn Khaldun","quote":"At the beginning of a dynasty, taxation yields a large revenue from small assessments; at the end, small revenue from large assessments.","source":"Muqaddimah","era":"Islamic Golden Age","tags":"taxation; cycles; institutions","prov":"T","status":"Selected; translation condensed","desc":"A sourced line concerning taxation, cycles, institutions, drawn from Muqaddimah.","verification":"pending"},{"id":"Q0315","person":"Omar Khayyam / Edward FitzGerald","quote":"A Book of Verses underneath the Bough, A Jug of Wine, a Loaf of Bread—and Thou Beside me singing in the Wilderness— Oh, Wilderness were Paradise enow!","source":"Edward FitzGerald, Rubáiyát of Omar Khayyám, Fifth Edition, quatrain XII","era":"Medieval / Victorian rendering","tags":"pleasure; simplicity; companionship","prov":"T","status":"Replaced the modern compressed slogan with FitzGerald's exact Fifth Edition quatrain XII in Project Gutenberg.","desc":"A sourced line concerning pleasure, simplicity, companionship, drawn from Rubáiyát of Omar Khayyám.","verification":"verified","source_url":"https://www.gutenberg.org/files/246/246-h/246-h.htm","explanation":"FitzGerald's famous quatrain imagines sufficiency through a deliberately small bundle of pleasures: poetry, food, wine, companionship, and a place outside ordinary society. Its power comes from converting apparent scarcity into paradise through valuation rather than abundance."},{"id":"Q0316","person":"Niccolò Machiavelli","quote":"men judge generally more by the eye than by the hand,","source":"The Prince XVIII","era":"Renaissance","tags":"appearance; judgment; politics","prov":"T","status":"Verified as an exact clause in W. K. Marriott's translation of The Prince XVIII.","desc":"A sourced line concerning appearance, judgment, politics, drawn from The Prince XVIII.","verification":"verified","source_url":"https://gutenberg.org/cache/epub/1232/pg1232-images.html","explanation":"Machiavelli identifies an information asymmetry in politics: appearance is available to everyone, while close contact with the ruler is rare. Public judgment therefore depends heavily on visible signals and outcomes."},{"id":"Q0317","person":"Niccolò Machiavelli","quote":"whoever wishes to foresee the future must consult the past;","source":"Discourses on Livy III.43","era":"Renaissance","tags":"history; forecasting; patterns","prov":"T","status":"Verified against the published English translation of Discourses III.43.","desc":"A sourced line concerning history, forecasting, patterns, drawn from Discourses on Livy III.43.","verification":"verified","source_url":"https://www.marxists.org/reference/archive/machiavelli/works/discourses/ch03.htm","explanation":"Machiavelli treats recurrent human passions as a basis for historical comparison. The past is useful not because events literally repeat, but because analogous incentives and dispositions can regenerate similar patterns."},{"id":"Q0318","person":"Michel de Montaigne","quote":"neither have I said so much of others, but to get a better opportunity to explain myself.","source":"Essays I.26, 'Of the Education of Children'","era":"Renaissance","tags":"quotation; self-expression; reading","prov":"T","status":"Replaced the popular modern wording with Charles Cotton's exact translation in Project Gutenberg.","desc":"A sourced line concerning quotation, self-expression, reading, drawn from Essays.","verification":"verified","source_url":"https://www.gutenberg.org/files/3600/3600-h/3600-h","explanation":"Montaigne uses other writers as instruments of self-disclosure rather than substitutes for thought. Quotation is valuable when borrowed language sharpens one's own judgment instead of hiding the absence of one."},{"id":"Q0319","person":"Michel de Montaigne","quote":"The greatest thing in the world is for a man to know that he is his own.","source":"Essays I.39, 'Of Solitude'","era":"Renaissance","tags":"self-possession; independence","prov":"T","status":"Corrected to Charles Cotton's exact translation in Project Gutenberg.","desc":"A sourced line concerning self-possession, independence, drawn from Essays I.39.","verification":"verified","source_url":"https://www.gutenberg.org/files/3600/3600-h/3600-h","explanation":"Montaigne's solitude is psychological before it is geographical. The achievement is to possess enough inward independence that social ties, offices, and reputation do not wholly own the self."},{"id":"Q0320","person":"Francis Bacon","quote":"if a man will begin with certainties, he shall end in doubts; but if he will be content to begin with doubts, he shall end in certainties.","source":"Francis Bacon, The Advancement of Learning I","era":"Early Modern","tags":"certainty; doubt; inquiry","prov":"T","status":"Expanded to Bacon's complete antithesis in Project Gutenberg's The Advancement of Learning.","desc":"A sourced line concerning certainty, doubt, inquiry, drawn from The Advancement of Learning.","verification":"verified","source_url":"https://www.gutenberg.org/files/5500/5500-h/5500-h.htm","explanation":"Bacon contrasts dogmatic starting points with inquiry that admits uncertainty. Premature certainty blocks examination; disciplined doubt creates conditions under which confidence can later be earned rather than assumed."},{"id":"Q0321","person":"Francis Bacon","quote":"truth emerges more easily from error than from confusion","source":"Novum Organum / associated translation","era":"Early Modern","tags":"error; inquiry; clarity","prov":"T","status":"Verified as the published English rendering of Bacon's Novum Organum cited by William Whewell.","desc":"A sourced line concerning error, inquiry, clarity, drawn from Novum Organum / associated translation.","verification":"verified","source_url":"https://www.gutenberg.org/files/51555/51555-h/51555-h.htm","explanation":"A definite but wrong model can be tested, criticized, and repaired; an undefined muddle gives inquiry nothing precise to attack. Error can therefore be epistemically productive when it is explicit enough to fail."},{"id":"Q0322","person":"William Shakespeare","quote":"The readiness is all.","source":"William Shakespeare, Hamlet 5.2","era":"Early Modern","tags":"readiness; mortality; action","prov":"T","status":"Verified against Folger Digital Texts, Hamlet 5.2.","desc":"A sourced line concerning readiness, mortality, action, drawn from Hamlet V.2.","verification":"verified","source_url":"https://www.folgerdigitaltexts.org/Ham/","explanation":"Hamlet accepts that complete control over timing and outcome is impossible. Readiness becomes the controllable variable: preparation and willingness to act matter even when events cannot be scheduled."},{"id":"Q0323","person":"William Shakespeare","quote":"There are more things in heaven and earth, Horatio, Than are dreamt of in your philosophy.","source":"William Shakespeare, Hamlet 1.5","era":"Early Modern","tags":"unknown; philosophy; humility","prov":"T","status":"Verified against Folger Shakespeare, Hamlet 1.5.","desc":"A sourced line concerning unknown, philosophy, humility, drawn from Hamlet I.5.","verification":"verified","source_url":"https://www.folger.edu/explore/shakespeares-works/hamlet/read/1/5/","explanation":"Hamlet warns Horatio that a conceptual scheme may be narrower than reality. The line is a durable argument for epistemic humility: unexplained phenomena need not fit the categories one already possesses."},{"id":"Q0324","person":"William Shakespeare","quote":"Our doubts are traitors And makes us lose the good we oft might win By fearing to attempt.","source":"William Shakespeare, Measure for Measure 1.4","era":"Early Modern","tags":"doubt; action; courage","prov":"T","status":"Corrected to Folger Shakespeare's exact wording in Measure for Measure 1.4.","desc":"A sourced line concerning doubt, action, courage, drawn from Measure for Measure I.4.","verification":"verified","source_url":"https://www.folger.edu/explore/shakespeares-works/measure-for-measure/read/1/4/","explanation":"Lucio argues that anticipatory doubt can become self-fulfilling by preventing action that might succeed. The dramatic speaker matters: the insight is memorable without making Lucio a general moral authority."},{"id":"Q0325","person":"William Shakespeare","quote":"Sweet are the uses of adversity,","source":"William Shakespeare, As You Like It 2.1","era":"Early Modern","tags":"adversity; learning","prov":"T","status":"Verified as an exact opening clause of Duke Senior's speech in Folger Shakespeare, As You Like It 2.1.","desc":"A sourced line concerning adversity, learning, drawn from As You Like It II.1.","verification":"verified","source_url":"https://www.folger.edu/explore/shakespeares-works/as-you-like-it/read/2/1/","explanation":"Duke Senior interprets exile as a source of instruction rather than only deprivation. Adversity becomes useful when it strips away flattering conditions and supplies information about oneself and the world."},{"id":"Q0326","person":"William Shakespeare","quote":"Ripeness is all.","source":"William Shakespeare, King Lear 5.2","era":"Early Modern","tags":"timing; acceptance; mortality","prov":"T","status":"Verified against Folger Shakespeare, King Lear 5.2.","desc":"A sourced line concerning timing, acceptance, mortality, drawn from King Lear V.2.","verification":"verified","source_url":"https://www.folger.edu/explore/shakespeares-works/king-lear/read/5/2/","explanation":"Edgar's phrase shifts attention from choosing the moment of death to being prepared for it. In the play's catastrophic setting, maturity means readiness to endure what cannot be controlled."},{"id":"Q0327","person":"Thomas Hobbes","quote":"And Covenants, without the Sword, are but Words, and of no strength to secure a man at all.","source":"Thomas Hobbes, Leviathan XVII","era":"17th century","tags":"institutions; enforcement; contracts","prov":"T","status":"Expanded to the exact original-spelling sentence in Project Gutenberg's Leviathan XVII.","desc":"A sourced line concerning institutions, enforcement, contracts, drawn from Leviathan XVII.","verification":"verified","source_url":"https://dev.gutenberg.org/files/3207/3207-h/3207-h.htm","explanation":"Hobbes argues that agreements are not self-enforcing when parties have reason to fear defection. Institutions matter because promises become reliably actionable only when some credible power can impose consequences for violation."},{"id":"Q0328","person":"Thomas Hobbes","quote":"Science is the knowledge of Consequences, and dependance of one fact upon another:","source":"Thomas Hobbes, Leviathan V","era":"17th century","tags":"science; causality; systems","prov":"T","status":"Corrected to the exact original-spelling clause in Project Gutenberg's Leviathan V.","desc":"A sourced line concerning science, causality, systems, drawn from Leviathan V.","verification":"verified","source_url":"https://dev.gutenberg.org/files/3207/3207-h/3207-h.htm","explanation":"Hobbes defines science as knowledge of dependencies that lets us infer and reproduce effects from causes. The formulation is strikingly operational: understanding is connected to knowing how one event follows from another and how similar causes can generate similar outcomes."},{"id":"Q0329","person":"René Descartes","quote":"For to be possessed of a vigorous mind is not enough; the prime requisite is rightly to apply it.","source":"Discourse on Method I","era":"Scientific Revolution","tags":"reason; method; intelligence","prov":"T","status":"Corrected to the exact Project Gutenberg translation of Discourse on Method I.","desc":"A sourced line concerning reason, method, intelligence, drawn from Discourse on Method I.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/59/pg59-images.html","explanation":"Descartes separates raw intellectual capacity from disciplined use. A powerful mind can make larger errors as well as larger discoveries; method determines whether ability compounds or wanders."},{"id":"Q0330","person":"René Descartes","quote":"The second, to divide each of the difficulties under examination into as many parts as possible, and as might be necessary for its adequate solution.","source":"Discourse on Method II","era":"Scientific Revolution","tags":"analysis; decomposition; problem solving","prov":"T","status":"Corrected to the exact Project Gutenberg translation of Discourse on Method II.","desc":"A sourced line concerning analysis, decomposition, problem solving, drawn from Discourse on Method II.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/59/pg59-images.html","explanation":"This is Descartes's decomposition rule: break a complex problem into components small enough to reason about reliably. The method reduces cognitive load while exposing structure that a single undifferentiated problem can hide."},{"id":"Q0331","person":"Blaise Pascal","quote":"Man is but a reed, the most feeble thing in nature; but he is a thinking reed.","source":"Pensées 347, W. F. Trotter translation","era":"17th century","tags":"humanity; fragility; thought","prov":"T","status":"Verified against W. F. Trotter's translation of Pascal's Pensées, fragment 347.","desc":"A sourced line concerning humanity, fragility, thought, drawn from Pensées.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/18269/pg18269-images.html","explanation":"Pascal juxtaposes physical fragility with reflective consciousness. Human dignity does not come from occupying much space or possessing physical power, but from the capacity to know one's condition—including one's own mortality and weakness."},{"id":"Q0332","person":"La Rochefoucauld","quote":"We have all sufficient strength to support the misfortunes of others.","source":"Maxims 19","era":"17th century","tags":"self-interest; irony; suffering","prov":"T","status":"Corrected to the exact Project Gutenberg translation of La Rochefoucauld's Maxim 19.","desc":"A sourced line concerning self-interest, irony, suffering, drawn from Maxims.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/9105/pg9105-images.html","explanation":"The joke exposes asymmetry in sympathy: people can appear impressively stoic when the suffering belongs to someone else. It is a compact attack on moral confidence that has never borne the cost it judges."},{"id":"Q0333","person":"Baruch Spinoza","quote":"The more we understand particular things, the more do we understand God.","source":"Ethics V, Proposition 24","era":"17th century","tags":"knowledge; nature; metaphysics","prov":"T","status":"Corrected to R. H. M. Elwes's exact translation of Ethics V.24.","desc":"A sourced line concerning knowledge, nature, metaphysics, drawn from Ethics V.24.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/975/pg975-images.html","explanation":"Within Spinoza's monism, understanding finite things more adequately is simultaneously understanding expressions of the one substance. Knowledge of particulars and knowledge of God/Nature are therefore not competing directions of inquiry."},{"id":"Q0334","person":"Isaac Newton","quote":"To explain all nature is too difficult a task for any one man or even for any one age.","source":"Opticks, Query 31 / associated wording","era":"Scientific Revolution","tags":"science; humility; cumulative knowledge","prov":"T","status":"Verified directly in Newton's draft 'Hypothesis Concerning Light and Colors' via the Newton Project.","desc":"A sourced line concerning science, humility, cumulative knowledge, drawn from Opticks, Query 31 / associated wording.","verification":"verified","source_url":"https://newtonproject.ox.ac.uk/view/texts/normalized/NATP00121","explanation":"Newton argues for epistemic division of labor across generations. It is better to establish a limited result securely and leave open problems to successors than to force a total explanation from conjecture."},{"id":"Q0335","person":"Gottfried Wilhelm Leibniz","quote":"Nature makes no leaps.","source":"New Essays on Human Understanding / maxim","era":"17th century","tags":"continuity; nature; change","prov":"T","status":"Pending source audit: prior verified label lacked the source-link/explanation evidence required by the current standard.","desc":"A sourced line concerning continuity, nature, change, drawn from New Essays on Human Understanding / maxim.","verification":"pending","prior_verification":"verified"},{"id":"Q0336","person":"Jonathan Swift","quote":"Falsehood flies, and truth comes limping after it.","source":"The Examiner, 1710","era":"18th century","tags":"information; misinformation; speed","prov":"T","status":"Pending source audit: prior verified label lacked the source-link/explanation evidence required by the current standard.","desc":"A sourced line concerning information, misinformation, speed, drawn from The Examiner, 1710.","verification":"pending","prior_verification":"verified"},{"id":"Q0337","person":"Voltaire","quote":"Those who can make you believe absurdities can make you commit atrocities.","source":"Questions sur les miracles / translation tradition","era":"Enlightenment","tags":"belief; violence; credulity","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning belief, violence, credulity, drawn from Questions sur les miracles / translation tradition.","verification":"pending"},{"id":"Q0338","person":"Voltaire","quote":"Doubt is not a pleasant condition, but certainty is absurd.","source":"Letter to Frederick II, 1767 / translation","era":"Enlightenment","tags":"doubt; certainty; skepticism","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning doubt, certainty, skepticism, drawn from Letter to Frederick II, 1767 / translation.","verification":"pending"},{"id":"Q0339","person":"Immanuel Kant","quote":"Sapere aude! Have courage to use your own understanding.","source":"What Is Enlightenment?","era":"Enlightenment","tags":"reason; autonomy; courage","prov":"T","status":"Pending source audit: prior verified label lacked the source-link/explanation evidence required by the current standard.","desc":"A sourced line concerning reason, autonomy, courage, drawn from What Is Enlightenment?.","verification":"pending","prior_verification":"verified"},{"id":"Q0340","person":"Immanuel Kant","quote":"Out of the crooked timber of humanity, no straight thing was ever made.","source":"Idea for a Universal History / translation","era":"Enlightenment","tags":"human nature; institutions; imperfection","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning human nature, institutions,
