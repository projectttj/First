ry character, we should turn inwards and examine ourselves.","source":"Analects 4.17","era":"Ancient China","tags":"emulation; self-examination; learning","prov":"T","status":"Corrected to James Legge's translation of Analects 4.17 in the Chinese Text Project.","desc":"A sourced line concerning emulation, self-examination, learning, drawn from Analects 4.17.","verification":"verified","source_url":"https://ctext.org/analects/li-ren","explanation":"Confucius turns comparison with others into a two-sided learning device. Excellence supplies a model to imitate; failure in others supplies a mirror for self-examination rather than merely an occasion for contempt."},{"id":"Q0400","person":"Laozi","quote":"He who knows that enough is enough will always have enough.","source":"Dao De Jing 46","era":"Ancient China","tags":"desire; sufficiency; self-control","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning desire, sufficiency, self-control, drawn from Dao De Jing 46.","verification":"pending"},{"id":"Q0401","person":"Genesis","quote":"Let there be light:","source":"Genesis 1:3, KJV","era":"Biblical","tags":"creation; language; cosmology","prov":"T","status":"Verified against the public-domain King James Version.","desc":"A sourced line concerning creation, language, cosmology, drawn from Genesis 1:3, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Genesis%201%3A3&version=KJV","explanation":"Creation is represented as responsive to divine speech: command and realization are placed immediately beside one another. The line became a foundational image for language as productive rather than merely descriptive."},{"id":"Q0402","person":"Genesis","quote":"Am I my brother's keeper?","source":"Genesis 4:9, KJV","era":"Biblical","tags":"responsibility; kinship","prov":"T","status":"Verified against the public-domain King James Version.","desc":"A sourced line concerning responsibility, kinship, drawn from Genesis 4:9, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Genesis%204%3A9&version=KJV","explanation":"Cain's question attempts to evade responsibility after Abel's murder. Its cultural afterlife comes from the opposite implication: human beings may bear obligations toward one another even when those obligations are inconvenient or denied."},{"id":"Q0403","person":"Job","quote":"the Lord gave, and the Lord hath taken away;","source":"Job 1:21, KJV","era":"Biblical","tags":"loss; fate; acceptance","prov":"T","status":"Verified against the public-domain King James Version.","desc":"A sourced line concerning loss, fate, acceptance, drawn from Job 1:21, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Job%201%3A21&version=KJV","explanation":"Job responds to catastrophic loss by locating possession itself inside a larger order of giving and taking. The line is an expression of radical acceptance under grief, though the rest of the book will complicate simple accounts of suffering and justice."},{"id":"Q0404","person":"Job","quote":"Where wast thou when I laid the foundations of the earth?","source":"Job 38:4, KJV","era":"Biblical","tags":"cosmology; humility; knowledge","prov":"T","status":"Verified against the public-domain King James Version.","desc":"A sourced line concerning cosmology, humility, knowledge, drawn from Job 38:4, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Job%2038%3A4&version=KJV","explanation":"God answers Job not with a direct causal explanation of his suffering but with questions about the scale and complexity of creation. The line attacks epistemic overreach: limited perspective constrains confident judgment about the whole."},{"id":"Q0405","person":"Psalms","quote":"The heavens declare the glory of God;","source":"Psalm 19:1, KJV","era":"Biblical","tags":"cosmos; divinity","prov":"T","status":"Verified as an exact first-clause excerpt of Psalm 19:1 in the King James Version.","desc":"A sourced line concerning cosmos, divinity, drawn from Psalm 19:1, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Psalm%2019%3A1&version=KJV","explanation":"The psalm treats the visible cosmos as testimony: order and grandeur in nature are read as signs that point beyond themselves. It became foundational language for traditions linking nature, intelligibility, and theology."},{"id":"Q0406","person":"Psalms","quote":"Yea, though I walk through the valley of the shadow of death, I will fear no evil:","source":"Psalm 23:4, KJV","era":"Biblical","tags":"courage; mortality; faith","prov":"T","status":"Verified as an exact clause from Psalm 23:4 in the King James Version.","desc":"A sourced line concerning courage, mortality, faith, drawn from Psalm 23:4, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Psalm%2023%3A4&version=KJV","explanation":"The speaker does not claim danger is absent; the image places trust inside danger. Courage here is relational—fear is displaced by confidence in accompanying protection rather than by denial of mortality."},{"id":"Q0407","person":"Psalms","quote":"Be still, and know that I am God:","source":"Psalm 46:10, KJV","era":"Biblical","tags":"contemplation; faith","prov":"T","status":"Verified as an exact opening clause of Psalm 46:10 in the King James Version.","desc":"A sourced line concerning contemplation, faith, drawn from Psalm 46:10, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Psalm%2046%3A10&version=KJV","explanation":"In a psalm filled with political and natural upheaval, the command interrupts frantic activity with recognition of a power not dependent on human control. The famous short form gains force from that surrounding disorder."},{"id":"Q0408","person":"Proverbs","quote":"Pride goeth before destruction, and an haughty spirit before a fall.","source":"Proverbs 16:18, KJV","era":"Biblical","tags":"pride; failure","prov":"T","status":"Verified against Proverbs 16:18 in the King James Version.","desc":"A sourced line concerning pride, failure, drawn from Proverbs 16:18, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Proverbs%2016%3A18&version=KJV","explanation":"The proverb models pride as a precursor to failure because inflated self-estimation degrades judgment. Its enduring usefulness is diagnostic: confidence becomes dangerous when it suppresses error detection and correction."},{"id":"Q0409","person":"Proverbs","quote":"Iron sharpeneth iron; so a man sharpeneth the countenance of his friend.","source":"Proverbs 27:17, KJV","era":"Biblical","tags":"friendship; improvement","prov":"T","status":"Verified against Proverbs 27:17 in the King James Version.","desc":"A sourced line concerning friendship, improvement, drawn from Proverbs 27:17, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Proverbs%2027%3A17&version=KJV","explanation":"The metaphor treats friendship as productive friction. Other minds can improve judgment and character by resistance, correction, challenge, and repeated contact rather than by uncritical agreement."},{"id":"Q0410","person":"Ecclesiastes","quote":"To every thing there is a season, and a time to every purpose under the heaven:","source":"Ecclesiastes 3:1, KJV","era":"Biblical","tags":"time; cycles","prov":"T","status":"Verified against the public-domain King James Version.","desc":"A sourced line concerning time, cycles, drawn from Ecclesiastes 3:1, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Ecclesiastes%203%3A1&version=KJV","explanation":"The verse introduces a catalogue of opposed times—birth and death, mourning and dancing, war and peace. Human life is pictured as temporally structured: fitting action depends partly on recognizing what kind of moment one inhabits."},{"id":"Q0411","person":"Ecclesiastes","quote":"the race is not to the swift, nor the battle to the strong,","source":"Ecclesiastes 9:11, KJV","era":"Biblical","tags":"chance; uncertainty","prov":"T","status":"Verified against the public-domain King James Version.","desc":"A sourced line concerning chance, uncertainty, drawn from Ecclesiastes 9:11, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Ecclesiastes%209%3A11&version=KJV","explanation":"Qoheleth rejects a deterministic link between visible advantage and outcome. Skill and strength matter, but 'time and chance' disrupt simple meritocratic or strategic expectations."},{"id":"Q0412","person":"Isaiah","quote":"they shall beat their swords into plowshares, and their spears into pruninghooks:","source":"Isaiah 2:4, KJV","era":"Biblical","tags":"war; peace","prov":"T","status":"Verified against the public-domain King James Version.","desc":"A sourced line concerning war, peace, drawn from Isaiah 2:4, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Isaiah%202%3A4&version=KJV","explanation":"Weapons are transformed into agricultural tools, making peace visible as a reallocation of material capacity from destruction toward production. The image has become one of the canonical symbols of disarmament."},{"id":"Q0413","person":"Micah","quote":"what doth the Lord require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","source":"Micah 6:8, KJV","era":"Biblical","tags":"ethics; humility","prov":"T","status":"Verified against the public-domain King James Version.","desc":"A sourced line concerning ethics, humility, drawn from Micah 6:8, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Micah%206%3A8&version=KJV","explanation":"Micah compresses religious duty into justice, mercy, and humility rather than ritual excess. The structure joins outward treatment of others with inward posture toward one's own moral standing."},{"id":"Q0414","person":"Matthew","quote":"Ye are the salt of the earth:","source":"Matthew 5:13, KJV","era":"Biblical","tags":"influence; community","prov":"T","status":"Verified as an exact opening clause of Matthew 5:13 in the King James Version.","desc":"A sourced line concerning influence, community, drawn from Matthew 5:13, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Matthew%205%3A13&version=KJV","explanation":"Salt preserves and changes what it enters; the metaphor gives disciples a function rather than merely a status. The following warning about salt losing savour makes the role conditional on actually retaining that function."},{"id":"Q0415","person":"Matthew","quote":"Judge not, that ye be not judged.","source":"Matthew 7:1, KJV","era":"Biblical","tags":"judgment; reciprocity","prov":"T","status":"Verified against Matthew 7:1 in the King James Version.","desc":"A sourced line concerning judgment, reciprocity, drawn from Matthew 7:1, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Matthew%207%3A1&version=KJV","explanation":"The surrounding passage attacks hypocritical judgment rather than abolishing every act of evaluation. Its logic is reciprocal: the standard one applies to others becomes a standard under which one should expect to be assessed."},{"id":"Q0416","person":"Matthew","quote":"every city or house divided against itself shall not stand:","source":"Matthew 12:25, KJV","era":"Biblical","tags":"division; systems","prov":"T","status":"Corrected to an exact clause of Matthew 12:25 in the King James Version; the previous 'A house divided...' wording was not the KJV text.","desc":"A sourced line concerning division, systems, drawn from Matthew 12:25, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Matthew%2012%3A25&version=KJV","explanation":"The argument is structural: a system whose components destroy one another loses the coordination required to persist. The phrase later became political shorthand because the mechanism generalizes easily beyond its immediate Gospel dispute."},{"id":"Q0417","person":"Matthew","quote":"Render therefore unto Caesar the things which are Caesar's; and unto God the things that are God's.","source":"Matthew 22:21, KJV","era":"Biblical","tags":"authority; religion","prov":"T","status":"Verified as an exact clause of Matthew 22:21 in the King James Version.","desc":"A sourced line concerning authority, religion, drawn from Matthew 22:21, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Matthew%2022%3A21&version=KJV","explanation":"Jesus answers a political trap by distinguishing obligations rather than accepting the question's forced binary. The sentence became foundational to later arguments about civil authority, religious obligation, and their boundaries."},{"id":"Q0418","person":"John","quote":"And ye shall know the truth, and the truth shall make you free.","source":"John 8:32, KJV","era":"Biblical","tags":"truth; freedom","prov":"T","status":"Verified against the public-domain King James Version.","desc":"A sourced line concerning truth, freedom, drawn from John 8:32, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=John%208%3A32&version=KJV","explanation":"In context, freedom follows continuing in Jesus's teaching and knowing the truth it reveals. The sentence's later secular use broadens it into a general claim about liberation through accurate understanding."},{"id":"Q0419","person":"John","quote":"Greater love hath no man than this, that a man lay down his life for his friends.","source":"John 15:13, KJV","era":"Biblical","tags":"love; sacrifice","prov":"T","status":"Verified against the public-domain King James Version.","desc":"A sourced line concerning love, sacrifice, drawn from John 15:13, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=John%2015%3A13&version=KJV","explanation":"Love is measured here by costly action rather than sentiment. The maximal case—giving one's life—makes sacrifice the limit case of loyalty to another person."},{"id":"Q0420","person":"Paul","quote":"for the letter killeth, but the spirit giveth life.","source":"2 Corinthians 3:6, KJV","era":"Biblical","tags":"rules; interpretation","prov":"T","status":"Verified against the public-domain King James Version.","desc":"A sourced line concerning rules, interpretation, drawn from 2 Corinthians 3:6, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=2%20Corinthians%203%3A6&version=KJV","explanation":"Paul contrasts the written covenant with the life-giving Spirit in a specific theological argument. Its broader use as 'rules versus spirit' is influential, but the original contrast is covenantal rather than a blanket rejection of written law."},{"id":"Q0421","person":"Homer","quote":"Even as are the generations of leaves, such are those also of men.","source":"Homer, Iliad VI.146, A. T. Murray translation","era":"Ancient Greece","tags":"mortality; generations","prov":"T","status":"Corrected from a modern Lattimore rendering to A. T. Murray's public-domain translation in Perseus.","desc":"A sourced line concerning mortality, generations, drawn from Iliad VI.","verification":"verified","source_url":"https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0134%3Abook%3D6","explanation":"Glaucus compares human generations to leaves that appear and vanish with the seasons. The image joins mortality with recurrence: individuals pass away while life continues through replacement and renewal."},{"id":"Q0422","person":"Homer","quote":"there is a time for many words and there is a time also for sleep.","source":"Homer, Odyssey XI.379, A. T. Murray translation","era":"Ancient Greece","tags":"speech; timing","prov":"T","status":"Corrected to the exact A. T. Murray translation in Perseus.","desc":"A sourced line concerning speech, timing, drawn from Odyssey XI.","verification":"verified","source_url":"https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0136%3Abook%3D11","explanation":"Odysseus answers a request to continue his extraordinary tale by acknowledging that speech itself has a proper season. The line is a small Homeric lesson in proportion: even important narrative must yield to bodily limits and timing."},{"id":"Q0424","person":"Euripides","quote":"Talk sense to a fool and he calls you foolish.","source":"Bacchae / translation family","era":"Ancient Greece","tags":"wisdom; audience","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning wisdom, audience, drawn from Bacchae / translation family.","verification":"pending"},{"id":"Q0425","person":"Aristotle","quote":"Hope is a waking dream.","source":"Attributed fragment","era":"Ancient Greece","tags":"hope; imagination","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning hope, imagination; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0426","person":"Epicurus","quote":"If thou wilt make a man happy, add not unto his riches but take away from his desires.","source":"Fragment / later rendering","era":"Hellenistic","tags":"desire; happiness","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning desire, happiness; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0427","person":"Epicurus","quote":"Nothing is enough for the man to whom enough is too little.","source":"Vatican Sayings 68","era":"Hellenistic","tags":"desire; sufficiency","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning desire, sufficiency, drawn from Vatican Sayings 68.","verification":"pending"},{"id":"Q0428","person":"Lucretius","quote":"So potent was Superstition in persuading to evil deeds.","source":"De Rerum Natura I","era":"Roman Republic","tags":"religion; violence","prov":"T","status":"Pending source-quality upgrade: wording may be correct, but the current supporting link is below the corpus's evidence standard.","desc":"A sourced line concerning religion, violence, drawn from De Rerum Natura I.","verification":"pending","source_url":"https://en.wikiquote.org/wiki/Lucretius","explanation":"The line concludes Lucretius's example of Iphigenia's sacrifice. His target is fearful superstition capable of making cruelty appear religiously required.","prior_verification":"verified"},{"id":"Q0429","person":"Lucretius","quote":"That what is food to one to some becomes Fierce poison,","source":"Lucretius, De Rerum Natura IV, William Ellery Leonard translation","era":"Roman Republic","tags":"variation; biology","prov":"T","status":"Corrected capitalization and verified against William Ellery Leonard's translation in Perseus.","desc":"A sourced line concerning variation, biology, drawn from De Rerum Natura IV.","verification":"verified","source_url":"https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.02.0131%3Abook%3D4","explanation":"Lucretius uses differing reactions to the same substance as evidence that sensation depends on interactions between material structures rather than on simple intrinsic qualities. The same input can have opposite effects in differently constituted organisms."},{"id":"Q0430","person":"Epictetus","quote":"It is impossible for a man to begin to learn what he thinks he knows.","source":"Discourses","era":"Roman Empire","tags":"learning; humility","prov":"T","status":"Pending source-quality upgrade: wording may be correct, but the current supporting link is below the corpus's evidence standard.","desc":"A sourced line concerning learning, humility, drawn from Discourses.","verification":"pending","source_url":"https://wist.info/epictetus/114/","explanation":"The obstacle is not simple ignorance but false closure. A learner who treats an untested belief as settled knowledge removes the very uncertainty that would motivate correction.","prior_verification":"verified"},{"id":"Q0431","person":"Confucius","quote":"The superior man is modest in his speech, but exceeds in his actions.","source":"Analects 14.29","era":"Ancient China","tags":"speech; action","prov":"T","status":"Verified against James Legge's translation of Analects 14.29 in the Chinese Text Project.","desc":"A sourced line concerning speech, action, drawn from Analects 14.29.","verification":"verified","source_url":"https://ctext.org/analects/xian-wen","explanation":"Confucius places the burden of proof on conduct rather than verbal self-presentation. Speech should underclaim relative to action, reversing the common incentive to advertise more than one delivers."},{"id":"Q0432","person":"Confucius","quote":"To see what is right and not to do it is want of courage.","source":"Analects 2.24","era":"Ancient China","tags":"courage; ethics","prov":"T","status":"Verified against James Legge's translation of Analects 2.24 in the Chinese Text Project.","desc":"A sourced line concerning courage, ethics, drawn from Analects 2.24.","verification":"verified","source_url":"https://ctext.org/analects/wei-zheng","explanation":"Moral recognition is incomplete without action. Confucius names the gap between knowing the right course and refusing to take its costs as a failure of courage rather than a failure of information."},{"id":"Q0433","person":"Confucius","quote":"The superior man is distressed by his want of ability. He is not distressed by men's not knowing him.","source":"Analects 15.18","era":"Ancient China","tags":"self-improvement; ability","prov":"T","status":"Expanded to James Legge's complete paired statement in Analects 15.18, Chinese Text Project.","desc":"A sourced line concerning self-improvement, ability, drawn from Analects 15.18.","verification":"verified","source_url":"https://ctext.org/analects/wei-ling-gong/zh","explanation":"The line redirects status anxiety inward. The relevant deficit is not insufficient recognition by others but insufficient capacity in oneself; reputation is secondary to becoming worthy of it."},{"id":"Q0434","person":"Zhuangzi","quote":"The Perfect man has no (thought of) self; the Spirit-like man, none of merit; the Sagely-minded man, none of fame.","source":"Zhuangzi 1","era":"Ancient China","tags":"ego; achievement","prov":"T","status":"Corrected to James Legge's translation of Zhuangzi 1 in the Chinese Text Project.","desc":"A sourced line concerning ego, achievement, drawn from Zhuangzi 1.","verification":"verified","source_url":"https://ctext.org/zhuangzi/enjoyment-in-untroubled-ease","explanation":"The three clauses progressively detach achievement from ego, merit, and reputation. Zhuangzi's ideal agent does not require a public identity built from possession of accomplishments."},{"id":"Q0435","person":"Zhuangzi","quote":"A frog in a well cannot be talked with about the sea - he is confined to the limits of his hole.","source":"Zhuangzi 17","era":"Ancient China","tags":"perspective; limits","prov":"T","status":"Corrected to James Legge's translation of Zhuangzi 17, Chinese Text Project.","desc":"A sourced line concerning perspective, limits, drawn from Zhuangzi 17.","verification":"verified","source_url":"https://ctext.org/zhuangzi/floods-of-autumn/zh","explanation":"The well-frog metaphor models epistemic confinement: the range of one's environment can become the range of what one can imagine. Perspective must expand before some truths can even become discussable."},{"id":"Q0436","person":"Mencius","quote":"Only after a man has demeaned himself will others demean him.","source":"Mencius 4A8","era":"Ancient China","tags":"self-respect; social dynamics","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning self-respect, social dynamics, drawn from Mencius 4A8.","verification":"pending"},{"id":"Q0437","person":"Xunzi","quote":"The nature of man is evil; his goodness is acquired.","source":"Xunzi, Human Nature Is Bad","era":"Ancient China","tags":"human nature; education","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning human nature, education, drawn from Xunzi, Human Nature Is Bad.","verification":"pending"},{"id":"Q0438","person":"Bhagavad Gita","quote":"It is better to do thine own duty, however lacking in merit, than to do that of another, even though efficiently.","source":"Bhagavad Gita 3.35","era":"Ancient India","tags":"duty; identity","prov":"T","status":"Corrected to an exact short excerpt from Shri Purohit Swami's translation of Bhagavad Gita 3.35.","desc":"A sourced line concerning duty, identity, drawn from Bhagavad Gita 3.35.","verification":"verified","source_url":"https://www.gitasupersite.iitk.ac.in/srimad?etpurohit=1&field_chapter_value=3&field_nsutra_value=35&language=dv","explanation":"The verse privileges one's own dharma over adopting another's role merely because the latter can be performed more impressively. In context this is not generic career advice: Krishna is arguing about Arjuna's duty within a specific religious and social framework."},{"id":"Q0439","person":"Bhagavad Gita","quote":"Doubtless, O Mighty One, the mind is fickle and exceedingly difficult to restrain, but, O Son of Kunti, with practice and renunciation it can be done.","source":"Bhagavad Gita 6.35","era":"Ancient India","tags":"mind; practice","prov":"T","status":"Corrected to Shri Purohit Swami's identifiable translation of Bhagavad Gita 6.35.","desc":"A sourced line concerning mind, practice, drawn from Bhagavad Gita 6.35.","verification":"verified","source_url":"https://gitabhashya.com/chapter/6","explanation":"Krishna accepts Arjuna's premise that mental control is difficult rather than dismissing it. The proposed mechanism is repeated practice joined to renunciation or non-attachment, making regulation a trainable process rather than an act of sheer will."},{"id":"Q0440","person":"Bhagavad Gita","quote":"To him who has conquered his lower nature by Its help, the Self is a friend, but to him who has not done so, It is an enemy.","source":"Bhagavad Gita 6.6","era":"Ancient India","tags":"self-mastery; mind","prov":"T","status":"Pending source-quality upgrade: wording may be correct, but the current supporting link is below the corpus's evidence standard.","desc":"A sourced line concerning self-mastery, mind, drawn from Bhagavad Gita 6.6.","verification":"pending","source_url":"https://www.vidhyamitra.com/bhagavad-gita/6/6","explanation":"The verse describes self-regulation as an internal alliance problem. Disciplined capacities can support one's aims; undisciplined impulses can function as an adversary from inside the same person.","prior_verification":"verified"},{"id":"Q0441","person":"Dhammapada","quote":"Even though a speech be a thousand (of words), but made up of senseless words, one word of sense is better, which if a man hears, he becomes quiet.","source":"Dhammapada 100","era":"Ancient India","tags":"speech; peace","prov":"T","status":"Corrected to F. Max Müller's public-domain translation of Dhammapada 100.","desc":"A sourced line concerning speech, peace, drawn from Dhammapada 100.","verification":"verified","source_url":"https://en.wikisource.org/wiki/Dhammapada_%28Muller%29","explanation":"The comparison values semantic and practical effect over verbal quantity. A single meaningful statement that changes the listener can be worth more than a large volume of empty language."},{"id":"Q0442","person":"Dhammapada","quote":"As a solid rock is not shaken by the wind, wise people falter not amidst blame and praise.","source":"Dhammapada 81","era":"Ancient India","tags":"equanimity; reputation","prov":"T","status":"Corrected to F. Max Müller's public-domain translation of Dhammapada 81.","desc":"A sourced line concerning equanimity, reputation, drawn from Dhammapada 81.","verification":"verified","source_url":"https://en.wikisource.org/wiki/Dhammapada_%28Muller%29","explanation":"The rock image defines steadiness as resistance to both negative and positive social feedback. Wisdom is tested not only by surviving blame but also by avoiding dependence on praise."},{"id":"Q0443","person":"Dogen","quote":"To study the Buddha Way is to study the self.","source":"Genjokoan","era":"Medieval Japan","tags":"self; practice","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning self, practice, drawn from Genjokoan.","verification":"pending"},{"id":"Q0444","person":"Dogen","quote":"To study the self is to forget the self.","source":"Genjokoan","era":"Medieval Japan","tags":"self; ego","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning self, ego, drawn from Genjokoan.","verification":"pending"},{"id":"Q0445","person":"Miyamoto Musashi","quote":"Do nothing which is of no use.","source":"Dokkodo","era":"Early Modern Japan","tags":"discipline; utility","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning discipline, utility, drawn from Dokkodo.","verification":"pending"},{"id":"Q0446","person":"Miyamoto Musashi","quote":"Think lightly of yourself and deeply of the world.","source":"Dokkodo","era":"Early Modern Japan","tags":"ego; observation","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning ego, observation, drawn from Dokkodo.","verification":"pending"},{"id":"Q0447","person":"Miyamoto Musashi","quote":"Perceive that which cannot be seen with the eye.","source":"The Book of Five Rings","era":"Early Modern Japan","tags":"perception; strategy","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning perception, strategy, drawn from The Book of Five Rings.","verification":"pending"},{"id":"Q0448","person":"Rumi","quote":"Sell your cleverness and buy bewilderment.","source":"Masnavi / translation family","era":"Medieval Persian","tags":"wonder; intellect","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning wonder, intellect, drawn from Masnavi / translation family.","verification":"pending"},{"id":"Q0449","person":"Saadi","quote":"Human beings are members of a whole, in creation of one essence and soul.","source":"Gulistan I.10","era":"Medieval Persian","tags":"humanity; solidarity","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning humanity, solidarity, drawn from Gulistan I.10.","verification":"pending"},{"id":"Q0450","person":"Ibn Arabi","quote":"My heart has become capable of every form.","source":"Tarjuman al-Ashwaq","era":"Medieval Islamic","tags":"pluralism; love","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning pluralism, love, drawn from Tarjuman al-Ashwaq.","verification":"pending"},{"id":"Q0451","person":"Ibn Arabi","quote":"He who knows himself knows his Lord.","source":"Traditional Sufi saying associated with Ibn Arabi","era":"Medieval Islamic","tags":"self-knowledge; divinity","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning self-knowledge, divinity; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0452","person":"Al-Ma'arri","quote":"The inhabitants of the earth are of two sorts: those with brains, but no religion, and those with religion, but no brains.","source":"Luzumiyyat / translation family","era":"Medieval Islamic","tags":"reason; religion","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning reason, religion, drawn from Luzumiyyat / translation family.","verification":"pending"},{"id":"Q0453","person":"Ibn Khaldun","quote":"The past resembles the future more than one drop of water resembles another.","source":"Muqaddimah","era":"Medieval Islamic","tags":"history; recurrence","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning history, recurrence, drawn from Muqaddimah.","verification":"pending"},{"id":"Q0454","person":"Ibn Khaldun","quote":"When incentive to acquire and obtain property is gone, people no longer make efforts to acquire any.","source":"Muqaddimah","era":"Medieval Islamic","tags":"incentives; economics","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning incentives, economics, drawn from Muqaddimah.","verification":"pending"},{"id":"Q0455","person":"Dante","quote":"There is no greater sorrow Than to be mindful of the happy time In misery,","source":"Dante, Inferno V.121–123, Henry Wadsworth Longfellow translation","era":"Medieval","tags":"memory; suffering","prov":"T","status":"Corrected to Henry Wadsworth Longfellow's exact 1867 translation of Francesca's line in Inferno V.","desc":"A sourced line concerning memory, suffering, drawn from Inferno V.","verification":"verified","source_url":"https://en.wikisource.org/wiki/Divine_Comedy_%28Longfellow_1867%29/Volume_1/Canto_5","explanation":"Francesca describes memory as an amplifier of present suffering: remembered happiness supplies a contrast that makes misery more acute. The line is emotionally powerful even though Dante's scene also invites scrutiny of Francesca's self-narration."},{"id":"Q0456","person":"Michel de Montaigne","quote":"nothing is so firmly believed, as what we least know;","source":"Essays I.32","era":"Renaissance","tags":"belief; ignorance","prov":"T","status":"Corrected punctuation and verified against Charles Cotton's translation.","desc":"A sourced line concerning belief, ignorance, drawn from Essays.","verification":"verified","source_url":"https://www.gutenberg.org/files/3600/3600-h/3600-h","explanation":"Montaigne identifies a recurring confidence paradox: sparse knowledge can support unusually rigid belief because the believer has not yet encountered the complications that would force qualification."},{"id":"Q0457","person":"Michel de Montaigne","quote":"He who fears he shall suffer, already suffers what he fears.","source":"Essays III.13","era":"Renaissance","tags":"fear; anticipation","prov":"T","status":"Verified against Charles Cotton's translation in Project Gutenberg.","desc":"A sourced line concerning fear, anticipation, drawn from Essays.","verification":"verified","source_url":"https://www.gutenberg.org/files/3600/3600-h/3600-h","explanation":"Anticipated suffering can impose a present cost before the feared event occurs. Montaigne's point is practical: imagination can lengthen pain by adding an interval of fear to whatever reality eventually brings."},{"id":"Q0459","person":"Blaise Pascal","quote":"We know the truth, not only by the reason, but also by the heart.","source":"Pensées 282","era":"17th century","tags":"reason; intuition","prov":"T","status":"Selected; translation varies","desc":"A sourced line concerning reason, intuition, drawn from Pensées 282.","verification":"pending"},{"id":"Q0460","person":"Baruch Spinoza","quote":"But all things excellent are as difficult as they are rare.","source":"Ethics V, Proposition 42 scholium","era":"17th century","tags":"excellence; difficulty","prov":"T","status":"Verified against R. H. M. Elwes's translation of the closing sentence of the Ethics.","desc":"A sourced line concerning excellence, difficulty, drawn from Ethics V, Pro const SCENARIOS=[{"id":"A01","text":"A commander has an elaborate campaign plan. The opposing army unexpectedly refuses the expected battle and changes the entire geometry of the campaign.","target":"Q0281","why":"Moltke's point is that planning meets an intelligent adversary; contact generates new information and invalidates assumptions."},{"id":"A02","text":"You are spending hours worrying about an outcome you cannot influence, while neglecting the few decisions that are actually yours.","target":"Q0078","why":"Epictetus's control distinction separates choice and judgment from events outside one's command."},{"id":"A03","text":"A research team loves its theory and quietly ignores measurements that make the theory look weaker.","target":"Q0247","why":"Feynman's rule targets motivated self-deception: actively disclose the evidence that could make your preferred interpretation fail."},{"id":"A04","text":"A government rewrites archives, schoolbooks, and official records until citizens lose any stable basis for checking what happened.","target":"Q0236","why":"Orwell's slogan is specifically about controlling political possibility by controlling the record of the past."},{"id":"A05","text":"A strategist can achieve the political objective by changing the opponent's incentives, leaving direct battle unnecessary.","target":"Q0045","why":"Sun Tzu treats the highest form of victory as obtaining the objective without paying the full cost of combat."},{"id":"A06","text":"A student reads constantly but never discusses or writes about the material and wonders why knowledge remains vague and difficult to use.","target":"Q0119","why":"Bacon assigns distinct cognitive functions to reading, conversation, and writing; precision requires more than intake."},{"id":"A07","text":"A manager makes an unnecessary process extraordinarily efficient and proudly reports the productivity gain.","target":"Q0261","why":"Drucker's formulation distinguishes optimizing a means from choosing a worthwhile end."},{"id":"A08","text":"A person interprets every setback as proof that the entire world is hostile, even when the events themselves are ambiguous.","target":"Q0123","why":"Hamlet's line is useful for distinguishing an event from the evaluative frame through which it is experienced."},{"id":"A09","text":"An institution officially declares everyone equal but quietly creates exceptions that give a privileged class more rights than everyone else.","target":"Q0238","why":"Orwell's deliberately contradictory commandment captures equality language being used to legitimize hierarchy."},{"id":"A10","text":"A political movement wins a civil conflict and must decide whether victory should become revenge or reconstruction.","target":"Q0199","why":"Lincoln's Second Inaugural couples firmness with a rejection of vengeance at the moment of prospective victory."},{"id":"A11","text":"Someone says they cannot begin an important project because circumstances are historically bad and they wish they had lived in an easier period.","target":"Q0267","why":"Gandalf's line moves attention from choosing circumstances to choosing a response within them."},{"id":"A12","text":"An analyst has weak evidence but speaks with complete certainty because a binary answer sounds more impressive.","target":"Q0150","why":"Hume's evidential rule requires confidence to scale with the strength of the evidence."},{"id":"A13","text":"A society has maintained two fundamentally incompatible legal orders for decades and assumes the contradiction can remain stable forever.","target":"Q0198","why":"Lincoln's house-divided image is a claim about persistent structural contradiction generating pressure toward resolution."},{"id":"A14","text":"A public figure fears an event so intensely that the anticipation causes more suffering and paralysis than the event itself.","target":"Q0125","why":"Caesar's line identifies anticipatory fear as repeated psychological suffering before the actual event."},{"id":"A15","text":"A team dismisses an unpopular criticism without examining it because everyone finds the criticism irritating.","target":"Q0237","why":"Orwell defines intellectual liberty by whether unwelcome claims are allowed to be stated and tested."},{"id":"A16","text":"A researcher assumes that because a pattern has repeated a thousand times, pure logic must guarantee that it will repeat again.","target":"Q0151","why":"Hume argues that our expectation of recurrence is grounded in custom formed by experience, not deductive proof."},{"id":"A18","text":"A crisis worsens because fear freezes investment, cooperation, and decision-making, creating more of the conditions people fear.","target":"Q0278","why":"Roosevelt identifies fear as an active feedback mechanism inside the material crisis."},{"id":"A19","text":"A leader wants citizens to think of politics only as demands placed on government, never as obligations or contributions to common institutions.","target":"Q0279","why":"Kennedy's reversal emphasizes citizenship as contribution as well as receipt."},{"id":"A20","text":"A group keeps choosing direct confrontation even though signaling, alliance-building, and incentive changes could obtain the same objective at far lower cost.","target":"Q0045","why":"Sun Tzu's standard of excellence rewards strategic economy: achieve the objective without unnecessary collision."},{"id":"A17","text":"A person spends weeks rehearsing imagined disasters, becoming exhausted before any of them has actually happened.","target":"Q0073","why":"Seneca distinguishes real injury from suffering generated in advance by imagination; anticipatory fear can multiply pain before events occur."}];

  if(c.interval==null)c.interval=0;if(c.streak==null)c.streak=0;if(c.lapses==null)c.lapses=0;return c;
}
function tagsOf(x){return String(x.tags||"").split(/[;,]/).map(t=>t.trim().toLowerCase()).filter(Boolean)}
function trusted(x){return (x.verification==="verified"||x.verification==="reported")&&!!x.source_url&&!!x.explanation&&!(["en.wikiquote.org","wist.info","sparknotes.com","litcharts.com","jfk.org","web.seducoahuila.gob.mx","daily-stoicism.captaindev.app","thestoiclibrary.com","readancienttexts.com","dokumen.pub","self.gutenberg.org","swaveda.com","indiankanoon.org","tianmu.org","vidhyamitra.com","fixquotes.com","brainyquote.com","goodreads.com"]).includes((String(x.source_url).match(/^https?:\/\/([^\/]+)/i)||["",""])[1].replace(/^www\./,""))}
function pool(){return DATA.filter(x=>(!era.value||x.era===era.value)&&(!prov.value||x.prov===prov.value)&&(verifyFilter.value==="all"||verifyFilter.value==="pending"&&x.verification==="pending"||verifyFilter.value==="verified"&&x.verification==="verified"||verifyFilter.value==="trusted"&&trusted(x)))}
function accuracy(c){const n=(c.correct||0)+(c.wrong||0);return n?c.correct/n:0}
function isMastered(c){return c.seen>=3&&c.correct>=3&&c.interval>=7*DAY&&accuracy(c)>=.75}
function isWeak(c){return c.seen>0&&!isMastered(c)&&((c.wrong||0)>0&&(c.streak||0)<2||accuracy(c)<.72||c.interval<6*HOUR)}
function categories(arr){
  const now=Date.now();
  const due=arr.filter(x=>{const c=cardState(x.id);return c.seen>0&&c.due<=now});
  const dueIds=new Set(due.map(x=>x.id));
  return{
    due,
    weak:arr.filter(x=>!dueIds.has(x.id)&&isWeak(cardState(x.id))),
    fresh:arr.filter(x=>cardState(x.id).seen===0),
    mature:arr.filter(x=>isMastered(cardState(x.id)))
  };
}
function weakScore(x){
  const c=cardState(x.id), n=Math.max(1,(c.correct||0)+(c.wrong||0));
  return (c.wrong||0)*8+(c.lapses||0)*10+(1-c.correct/n)*20-Math.min(12,(c.streak||0)*2)+(c.due<Date.now()?8:0);
}
function chooseFrom(a,kind){
  if(!a.length)return null;
  if(kind==="due")return [...a].sort((x,y)=>(cardState(x.id).due-cardState(y.id).due)||(weakScore(y)-weakScore(x)))[0];
  if(kind==="weak")return [...a].sort((x,y)=>weakScore(y)-weakScore(x))[0];
  return a[Math.floor(Math.random()*a.length)];
}
function chooseScheduled(arr){
  if(!arr.length)return null;
  const c=categories(arr);
  if(focus.value==="due")return chooseFrom(c.due,"due")||chooseFrom(c.weak,"weak")||chooseFrom(c.fresh,"new")||chooseFrom(arr,"random");
  if(focus.value==="weak")return chooseFrom(c.weak,"weak")||chooseFrom(c.due,"due")||chooseFrom(c.fresh,"new")||chooseFrom(arr,"random");
  if(focus.value==="new")return chooseFrom(c.fresh,"new")||chooseFrom(c.due,"due")||chooseFrom(c.weak,"weak")||chooseFrom(arr,"random");
  if(focus.value==="random")return chooseFrom(arr,"random");
  // Balanced: approximately 60% due, 20% weak, 20% new. Heavy due backlog temporarily increases review.
  const pattern=c.due.length>25?["due","due","weak","due","new","due","due","weak","due","new"]:["due","weak","new","due","new","due","weak","due","new","due"];
  const target=pattern[state.sessionPick++%pattern.length];
  save();
  if(target==="due")return chooseFrom(c.due,"due")||chooseFrom(c.weak,"weak")||chooseFrom(c.fresh,"new")||chooseFrom(arr,"random");
  if(target==="weak")return chooseFrom(c.weak,"weak")||chooseFrom(c.due,"due")||chooseFrom(c.fresh,"new")||chooseFrom(arr,"random");
  return chooseFrom(c.fresh,"new")||chooseFrom(c.due,"due")||chooseFrom(c.weak,"weak")||chooseFrom(arr,"random");
}
function markSeen(x){state.seen[x.id]=1;const c=cardState(x.id);c.seen++;c.last=Date.now();save()}
function schedule(x,grade){
  const c=cardState(x.id), now=Date.now();
  if(grade==="again"){c.wrong++;c.lapses++;c.streak=0;c.interval=2*MIN}
  else if(grade==="hard"){c.correct++;c.streak++;c.interval=c.interval?Math.max(15*MIN,c.interval*1.35):15*MIN}
  else if(grade==="good"){c.correct++;c.streak++;c.interval=c.interval?Math.max(2*HOUR,c.interval*2.35):2*HOUR}
  else if(grade==="easy"){c.correct++;c.streak++;c.interval=c.interval?Math.max(DAY,c.interval*3.2):DAY}
  c.interval=Math.min(c.interval,120*DAY);c.due=now+c.interval;c.last=now;save();
}
function modeAttempt(name,ok){const m=state.modeStats[name]||(state.modeStats[name]={attempts:0,correct:0});m.attempts++;if(ok)m.correct++}
function recordTest(x,ok,name=mode.value){
  state.attempts++;if(ok)state.correct++;modeAttempt(name,ok);schedule(x,ok?"good":"again");
}
function recordConfusion(real,wrong){
  if(!real||!wrong||real===wrong)return;
  const m=state.confusions[real]||(state.confusions[real]={});m[wrong]=(m[wrong]||0)+1;save();
}
function confusionsFor(person){return Object.entries(state.confusions[person]||{}).sort((a,b)=>b[1]-a[1]).map(([p])=>p)}
function similarity(a,b){
  const A=new Set(tagsOf(a)),B=new Set(tagsOf(b));let n=0;A.forEach(t=>{if(B.has(t))n++});
  if(a.era===b.era)n+=2;return n;
}
function distractPeople(x,arr,n=3){
  const names=[...new Set(arr.filter(y=>y.person!==x.person).map(y=>y.person))];
  const confused=confusionsFor(x.person).filter(p=>names.includes(p));
  const byName=new Map();
  arr.filter(y=>y.person!==x.person).forEach(y=>{const s=similarity(x,y);byName.set(y.person,Math.max(byName.get(y.person)||0,s))});
  const related=[...byName.entries()].sort((a,b)=>b[1]-a[1]).map(([p])=>p);
  return [...new Set([...confused,...related,...shuffle(names)])].slice(0,n);
}
function distractQuotes(x,arr,n=3){
  const confused=new Set(confusionsFor(x.person));
  const candidates=arr.filter(y=>y.id!==x.id&&y.person!==x.person).sort((a,b)=>{
    const ac=confused.has(a.person)?10:0,bc=confused.has(b.person)?10:0;
    return (bc+similarity(x,b))-(ac+similarity(x,a));
  });
  return [...new Map(candidates.map(y=>[y.id,y])).values()].slice(0,n);
}
function authorEntries(person){return DATA.filter(x=>x.person===person)}
function authorProfile(person){
  const es=authorEntries(person), eras=[...new Set(es.map(x=>x.era).filter(Boolean))];
  const tc={};es.flatMap(tagsOf).forEach(t=>tc[t]=(tc[t]||0)+1);
  const themes=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
  const works=[...new Set(es.map(x=>x.source).filter(Boolean))].slice(0,5);
  return {count:es.length,eras,themes,works,info:AUTHOR_INFO[person]||null,relations:RELATIONS[person]||[]};
}
function profileHTML(person){

  if(i)h+='<div class="row">'+esc(i.field)+'</div><div class="row">'+esc(i.bio)+'</div>';

function metadata(x){
  const v=x.verification==="pending"?"pending verification":x.verification==="reported"?"exact reported/fragmentary":"verified textual";
  const src=x.source_url?'<a href="'+esc(x.source_url)+'" target="_blank" rel="noopener">'+esc(x.source||"Source")+'</a>':esc(x.source||"Source not listed");
  const exp=x.explanation?'<div style="margin-top:8px;color:var(--text)">'+esc(x.explanation)+'</div>':'';
  return '<div class="meta"><span class="badge">'+esc(x.prov)+'</span><span class="badge">'+esc(v)+'</span>'+src+' · '+esc(x.era||"")+
    '<br>'+esc(x.tags||"")+exp+'</div>';

function renderStats(){
  const arr=pool(),cat=categories(arr),all=arr.map(x=>cardState(x.id)),mastered=all.filter(isMastered).length,weak=all.filter(isWeak).length,due=cat.due.length,fresh=cat.fresh.length;
  const acc=state.attempts?Math.round(100*state.correct/state.attempts):0;

  stats.innerHTML='<span class="stat">'+arr.length+' in deck</span><span class="stat">'+mastered+' mastered</span><span class="stat">'+weak+' weak</span><span class="stat">'+due+' due</span><span class="stat">'+fresh+' new</span><span class="stat">'+pendingTotal+' pending verification</span><span class="stat">'+acc+'% quiz accuracy</span>'+(storageOK?'':'<span class="stat">Session-only progress</span>');
  progressBar.style.width=(arr.length?Math.round(mastered/arr.length*100):0)+'%';

function normalizeText(s){return String(s||"").toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'\s]/g," ").replace(/\s+/g," ").trim()}
function levenshtein(a,b){
  a=normalizeText(a);b=normalizeText(b);if(!a&&!b)return 0;if(!a)return b.length;if(!b)return a.length;
  let prev=Array.from({length:b.length+1},(_,i)=>i),cur=[];
  for(let i=1;i<=a.length;i++){cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}
  return prev[b.length];
}
function textSimilarity(a,b){const A=normalizeText(a),B=normalizeText(b),m=Math.max(A.length,B.length,1);return Math.max(0,1-levenshtein(A,B)/m)}

function completion(p){
  const eligible=p.filter(x=>normalizeText(x.quote).split(" ").length>=7),x=chooseScheduled(eligible.length?eligible:p);markSeen(x);
  const words=x.quote.split(/\s+/),cut=Math.max(3,Math.floor(words.length*.58)),prefix=words.slice(0,cut).join(" "),expected=words.slice(cut).join(" ");
  app.innerHTML='<div class="card"><div class="prompt">Complete the quotation exactly enough to preserve the wording.</div><div class="quote">“'+esc(prefix)+' <span class="completionBlank">…</span>”</div><textarea id="completionInput" placeholder="Type the missing continuation"></textarea><button class="action" id="check">Check</button><button class="action" id="revealOnly">Reveal without answer</button><div id="ex"></div></div>';
  let done=false;
  function finish(given,forced){if(done)return;done=true;const sim=forced?0:textSimilarity(given,expected),ok=!forced&&sim>=.84;recordTest(x,ok,"complete");
    document.getElementById("ex").innerHTML='<div class="answerBox"><div class="score '+(ok?'goodText':'badText')+'">'+(forced?'Revealed':Math.round(sim*100)+'% match')+'</div><div class="quote" style="font-size:21px">“'+esc(x.quote)+'”</div>'+answerReveal(x)+nextButton()+'</div>';

function authorRecall(p){

    document.getElementById("ex").innerHTML='<div class="answerBox">'+(typed?'<div class="score">'+Math.round(bestScore*100)+'% closest textual match</div>':'')+'<div class="quoteList">'+samples.map(e=>'<div class="quoteMini">“'+esc(e.quote)+'”<div class="small">— '+esc(e.source||"")+'</div></div>').join("")+'</div><div class="prompt" style="margin-top:12px">Did you genuinely retrieve a quote before revealing?</div><div class="grade"><button data-free="no">Not yet</button><button data-free="partial">Partial</button><button data-free="yes">Yes</button><button data-free="easy">Immediate</button></div></div>';

function match4(p){
  if(p.length<4){app.innerHTML='<div class="card">Need at least four cards in this filter.</div>';return}
  const xs=[];const seen=new Set();for(const x of shuffle(p)){if(!seen.has(x.person)){seen.add(x.person);xs.push(x)}if(xs.length===4)break}
  if(xs.length<4){app.innerHTML='<div class="card">Need four distinct authors in this filter.</div>';return}
  xs.forEach(markSeen);const authors=shuffle(xs.map(x=>x.person)),errored=new Set();let selected=null,matched=0;
  app.innerHTML='<div class="card"><div class="prompt">Tap a quotation, then its author. A card is scored once: clean first-match or recovered after an error.</div><div class="matchGrid"><div class="matchCol">'+xs.map(x=>'<button class="matchItem" data-q="'+esc(x.id)+'">“'+esc(x.quote)+'”</button>').join("")+'</div><div class="matchCol">'+authors.map(a=>'<button class="matchItem" data-a="'+esc(a)+'">'+esc(a)+'</button>').join("")+'</div></div><div id="mmsg" class="meta"></div></div>';
  app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{if(b.classList.contains("done"))return;app.querySelectorAll("[data-q]").forEach(z=>z.classList.remove("selected"));b.classList.add("selected");selected=b.dataset.q});
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(!selected||b.classList.contains("done"))return;const x=xs.find(z=>z.id===selected),qbtn=[...app.querySelectorAll("[data-q]")].find(el=>el.dataset.q===selected),ok=b.dataset.a===x.person;
    if(ok){recordTest(x,!errored.has(x.id),"match");b.classList.add("correct","done");qbtn.classList.add("correct","done");qbtn.classList.remove("selected");selected=null;matched++;document.getElementById("mmsg").textContent=matched+'/4 matched';if(matched===4)setTimeout(newCard,350)}
    else{if(!errored.has(x.id)){errored.add(x.id);recordConfusion(x.person,b.dataset.a)}b.classList.add("wrong");setTimeout(()=>b.classList.remove("wrong"),420);document.getElementById("mmsg").textContent='Not that one — try again.'}
  });
}
function browse(){

function newCard(){

}

document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify({version:5,exportedAt:new Date().toISOString(),state},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="quote-trainer-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
document.getElementById("importBtn").onclick=()=>importFile.click();
importFile.onchange=async()=>{const f=importFile.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj.state)throw new Error("Invalid progress file");state=normalizeState(obj.state);save();newCard()}catch(e){alert("Could not import progress file.")}importFile.value=""};
mode.onchange=()=>{search.value="";newCard()};era.onchange=newCard;focus.onchange=newCard;prov.onchange=newCard;verifyFilter.onchange=newCard;search.oninput=()=>{if(mode.value==="browse")browse()};
document.addEventListener("keydown",e=>{if(e.key===" "&&mode.value==="study"){const r=document.getElementById("reveal");if(r){e.preventDefault();r.click()}}});
renderStats();newCard();
</script>
</main>
