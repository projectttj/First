<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0e1116"/>
<title>Quote Trainer</title>
<style>
:root{--bg:#0e1116;--panel:#171c24;--panel2:#202733;--text:#f5f7fa;--muted:#a9b4c2;--line:#344050;--accent:#91baff;--good:#80d9a0;--bad:#ff9696;--warn:#e8c976}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%} body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,select,input,textarea{font:inherit} button,select,input,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent} button:active{transform:translateY(1px)} textarea{width:100%;min-height:110px;resize:vertical}
main{max-width:940px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 14px max(34px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px} h1{font-size:24px;margin:0 0 3px}.sub{color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:7px;flex-wrap:wrap}.toolbar button{padding:8px 10px;font-size:12px}
.controls{display:grid;grid-template-columns:1.2fr .9fr .9fr .8fr 1.1fr;gap:8px;margin-bottom:10px}.controls .wide{grid-column:1/-1}
.stats{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 13px}.stat{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:12px}
.progress{height:5px;background:var(--panel2);border-radius:999px;overflow:hidden;margin:-3px 0 14px}.progress>div{height:100%;background:var(--accent);width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;min-height:405px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 35px rgba(0,0,0,.18)}
.quote{font-family:Georgia,"Times New Roman",serif;font-size:29px;line-height:1.38;margin:0 0 20px}.prompt{font-size:14px;color:var(--muted);margin-bottom:14px}.author{font-size:22px;font-weight:760;margin:4px 0}
.meta{color:var(--muted);margin-top:9px;line-height:1.55}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;margin-right:5px;font-size:11px;color:var(--muted)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.answers button{text-align:left;padding:13px;min-height:54px}.correct{border-color:var(--good)!important;box-shadow:inset 0 0 0 1px var(--good)}.wrong{border-color:var(--bad)!important;box-shadow:inset 0 0 0 1px var(--bad)}
.action{width:100%;padding:14px;margin-top:10px}.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.grade button{padding:11px 7px}
.answerBox{border-top:1px solid var(--line);padding-top:17px;margin-top:17px}.hidden{display:none!important}.small{font-size:12px;color:var(--muted)}.goodText{color:var(--good)}.badText{color:var(--bad)}
.profile{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:13px}.profile strong{display:block;margin-bottom:5px}.profile .row{margin:4px 0;color:var(--muted);font-size:13px}
.matchGrid{display:grid;grid-template-columns:1.2fr 1fr;gap:9px;margin-top:10px}.matchCol{display:flex;flex-direction:column;gap:8px}.matchItem{min-height:62px;text-align:left}.matchItem.selected{border-color:var(--accent)}.matchItem.done{opacity:.43}
.searchResults{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:500px;overflow:auto}.result{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left}.result strong{display:block;margin-bottom:4px}
.completionBlank{border-bottom:2px solid var(--accent);padding:0 5px;color:var(--muted)}.score{font-weight:700;margin-top:10px}.theme{font-size:30px;font-weight:800;margin:0 0 8px}.quoteList{display:flex;flex-direction:column;gap:9px;margin-top:12px}.quoteMini{padding:11px;border-left:3px solid var(--line);background:var(--panel2);border-radius:8px;font-family:Georgia,serif}
@media(max-width:700px){
  main{padding-left:11px;padding-right:11px} header{display:block}.toolbar{margin-top:10px}.controls{grid-template-columns:1fr 1fr}.controls #prov{grid-column:auto}.quote{font-size:24px}.answers{grid-template-columns:1fr}.grade{grid-template-columns:1fr 1fr}.card{padding:18px;min-height:390px}.matchGrid{grid-template-columns:1fr}.theme{font-size:26px}
}
</style>
</head>
<body>
<main>
<header>
  <div><h1>Quote Trainer</h1><div class="sub">Strict quotation corpus · adaptive recall · bidirectional associations</div></div>
  <div class="toolbar">
    <button id="exportBtn">Export progress</button>
    <button id="importBtn">Import</button>
    <input id="importFile" type="file" accept="application/json" class="hidden"/>
  </div>
</header>

<div class="controls">
  <select id="mode" aria-label="Mode">
    <option value="study">Study / Reveal</option>
    <option value="q2a">Quote → Author</option>
    <option value="a2q">Author → Quote</option>
    <option value="complete">Complete Quote</option>
    <option value="authorRecall">Author Free Recall</option>
    <option value="theme">Theme → Quote</option>\n    <option value="apply">Apply Quote</option>
    <option value="match">Match 4</option>
    <option value="browse">Browse / Search</option>
  </select>
  <select id="era" aria-label="Era"><option value="">All eras</option></select>
  <select id="focus" aria-label="Focus">
    <option value="balanced">Balanced</option>
    <option value="due">Due reviews</option>
    <option value="weak">Weak cards</option>
    <option value="new">New cards</option>
    <option value="random">Random</option>
  </select>
  <select id="prov" aria-label="Provenance">
    <option value="">T + R</option>
    <option value="T">Direct text only</option>
    <option value="R">Reported/fragmentary only</option>
  </select>
  <select id="verifyFilter" aria-label="Verification">
    <option value="trusted">Verified + exact reported</option>
    <option value="verified">Verified textual only</option>
    <option value="all">All selected</option>
    <option value="pending">Pending verification</option>
  </select>
  <input id="search" class="hidden wide" type="search" placeholder="Search quote, author, source, era, theme…"/>
</div>

<div class="stats" id="stats"></div>
<div class="progress"><div id="progressBar"></div></div>
<div id="app"></div>
<div class="small" style="margin-top:12px">T = direct textual quotation in the corpus. R = exact reported/fragmentary wording preserved through a cited source or tradition. Progress stays in this browser when storage is available.</div>

<script>
const DATA=[{"id":"Q0001","person":"Homer","quote":"The wrath sing, goddess, of Peleus' son, Achilles,","source":"Homer, Iliad I.1, A. T. Murray translation","era":"Ancient Greece","tags":"war; rage; epic","prov":"T","status":"Corrected to an exact opening excerpt from A. T. Murray's 1924 translation in Perseus.","desc":"A sourced line concerning war, rage, epic, drawn from Iliad I.","verification":"verified","source_url":"https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0134%3Abook%3D1","explanation":"The Iliad begins not with the war as a whole but with Achilles' wrath and its cascading consequences. The opening makes emotion a causal force that reorganizes armies, deaths, honor, and the fulfillment of Zeus's plan."},{"id":"Q0002","person":"Homer","quote":"Tell me, O Muse, of the man of many devices,","source":"Homer, Odyssey I.1, A. T. Murray translation","era":"Ancient Greece","tags":"intelligence; wandering; adaptability","prov":"T","status":"Corrected to an exact opening excerpt from A. T. Murray's 1919 translation in Perseus.","desc":"A sourced line concerning intelligence, wandering, adaptability, drawn from Odyssey I.","verification":"verified","source_url":"https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0136%3Abook%3D1","explanation":"The Odyssey defines its hero through multiplicity of devices before naming him. Odysseus is characterized by adaptive intelligence, travel, and the ability to survive changing circumstances rather than by a single heroic virtue."},{"id":"Q0003","person":"Hesiod","quote":"Work is no disgrace: it is idleness which is a disgrace.","source":"Hesiod, Works and Days 311, Hugh G. Evelyn-White translation","era":"Ancient Greece","tags":"work; discipline","prov":"T","status":"Verified against Hugh G. Evelyn-White's Harvard/Heinemann translation in Perseus.","desc":"A sourced line concerning work, discipline, drawn from Works and Days.","verification":"verified","source_url":"https://www.perseus.tufts.edu/hopper/text?doc=Hes.+WD+287&fromdoc=Perseus%3Atext%3A1999.01.0132","explanation":"Hesiod places work inside an ethic of self-support, order, and reputation. The contrast is not between labor and leisure in the abstract, but between productive effort and an idleness that makes a person dependent on others."},{"id":"Q0004","person":"Sappho","quote":"Someone, I tell you, will remember us.","source":"Fragment 147","era":"Ancient Greece","tags":"memory; immortality","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning memory, immortality; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0005","person":"Pindar","quote":"Become such as you are, having learned what that is.","source":"Pythian 2","era":"Ancient Greece","tags":"self-knowledge; development","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning self-knowledge, development, drawn from Pythian 2.","verification":"pending"},{"id":"Q0006","person":"Heraclitus","quote":"On those stepping into rivers staying the same, other and other waters flow.","source":"Fragment B12","era":"Ancient Greece","tags":"change; identity; systems","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning change, identity, systems; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0007","person":"Heraclitus","quote":"The road up and down is one and the same.","source":"Fragment B60","era":"Ancient Greece","tags":"polarity; perspective","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning polarity, perspective; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0008","person":"Heraclitus","quote":"War is the father of all and king of all.","source":"Fragment B53","era":"Ancient Greece","tags":"conflict; differentiation","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning conflict, differentiation; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0009","person":"Parmenides","quote":"For thinking and being are the same.","source":"Fragment B3","era":"Ancient Greece","tags":"metaphysics; epistemology","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning metaphysics, epistemology; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0010","person":"Protagoras","quote":"Man is the measure of all things.","source":"Fragment, preserved in Plato","era":"Ancient Greece","tags":"relativism; perception","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning relativism, perception; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0011","person":"Democritus","quote":"By convention sweet, by convention bitter; in reality atoms and void.","source":"Fragment B125","era":"Ancient Greece","tags":"appearance; reality; atomism","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning appearance, reality, atomism; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0012","person":"Aeschylus","quote":"wisdom comes by suffering.","source":"Agamemnon","era":"Ancient Greece","tags":"suffering; wisdom","prov":"T","status":"Verified against Herbert Weir Smyth's Harvard University Press translation of Agamemnon 176–183 in Perseus.","desc":"A sourced line concerning suffering, wisdom, drawn from Agamemnon.","verification":"verified","source_url":"https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Aabo%3Atlg%2C0085%2C005%3A183","explanation":"Aeschylus presents painful experience as a mechanism through which understanding arrives even against the learner's wishes. The line is not a claim that all suffering automatically ennobles; it belongs to a tragic world where knowledge often arrives through irreversible consequence.","prior_verification":"verified"},{"id":"Q0013","person":"Sophocles","quote":"Wonders are many, and none is more wonderful than man.","source":"Antigone","era":"Ancient Greece","tags":"humanity; civilization","prov":"T","status":"Verified against Richard Jebb's translation of Antigone 332ff.","desc":"A sourced line concerning humanity, civilization, drawn from Antigone.","verification":"verified","source_url":"https://en.wikisource.org/wiki/Page:Tragedies_of_Sophocles_(Jebb_1917).djvu/150","explanation":"The chorus catalogs human technological and political capacities with genuine awe, while the larger ode also warns that ingenuity can serve either justice or destruction. Human exceptionalism here is powerful but morally unstable."},{"id":"Q0014","person":"Sophocles","quote":"we must call no one happy who is of mortal race, until he hath crossed life's border, free from pain.","source":"Oedipus Tyrannus","era":"Ancient Greece","tags":"fortune; tragedy","prov":"T","status":"Pending source-quality upgrade: wording may be correct, but the current supporting link is below the corpus's evidence standard.","desc":"A sourced line concerning fortune, tragedy, drawn from Oedipus Tyrannus.","verification":"pending","source_url":"https://web.seducoahuila.gob.mx/biblioweb/upload/Sophocles%20THE%20PLAYS.pdf","explanation":"The final chorus treats a life as something whose fortune cannot be judged securely before its end. Oedipus's reversal from admired king to ruined exile makes the maxim a warning against evaluating a life from a temporary peak.","prior_verification":"verified"},{"id":"Q0015","person":"Euripides","quote":"My tongue swore, but my mind is unsworn.","source":"Hippolytus","era":"Ancient Greece","tags":"language; obligation","prov":"T","status":"Verified as Hippolytus 612 in the classical scholarship cited.","desc":"A sourced line concerning language, obligation, drawn from Hippolytus.","verification":"verified","source_url":"https://www.cambridge.org/core/books/abs/creative-lives-in-classical-antiquity/whats-in-a-life-some-forgotten-faces-of-euripides/38116093D5536E247345D7DBCC758942","explanation":"Hippolytus distinguishes the literal oath of his tongue from the inward assent of his mind. The line dramatizes conflict between formal speech, intention, and obligation rather than offering a simple license to break promises."},{"id":"Q0016","person":"Socrates / Plato","quote":"I neither know nor think that I know.","source":"Plato, Apology, Benjamin Jowett translation","era":"Ancient Greece","tags":"ignorance; humility","prov":"R","status":"Verified against Benjamin Jowett's translation of Plato's Apology in the MIT Internet Classics Archive.","desc":"A reported, fragmentary, or mediated saying concerning ignorance, humility; useful for the idea and historical voice, with attribution context shown.","verification":"verified","source_url":"https://classics.mit.edu/Plato/apology.html","explanation":"Socrates distinguishes ignorance from false confidence. His advantage is not possession of hidden knowledge but a more accurate estimate of what he does and does not know."},{"id":"Q0017","person":"Socrates / Plato","quote":"the life which is unexamined is not worth living","source":"Plato, Apology, Benjamin Jowett translation","era":"Ancient Greece","tags":"philosophy; self-examination","prov":"R","status":"Corrected to the exact Benjamin Jowett wording in Plato's Apology.","desc":"A reported, fragmentary, or mediated saying concerning philosophy, self-examination; useful for the idea and historical voice, with attribution context shown.","verification":"verified","source_url":"https://classics.mit.edu/Plato/apology.html","explanation":"Socrates presents sustained examination of conduct, values, and reasons as central to a properly human life. In context the claim explains why he will not buy safety by abandoning philosophical inquiry."},{"id":"Q0018","person":"Plato","quote":"The beginning is the most important part of any work.","source":"Republic II","era":"Ancient Greece","tags":"education; formation","prov":"T","status":"Corrected to Benjamin Jowett's 1892 translation of Republic II, 377a–b; the previous version omitted 'any'.","desc":"A sourced line concerning education, formation, drawn from Republic II.","verification":"verified","source_url":"https://www.gutenberg.org/files/55201/55201-h/55201-h","explanation":"Socrates is discussing childhood education, not generic project management. Beginnings matter because early impressions shape character while it is still unusually receptive."},{"id":"Q0020","person":"Plato","quote":"Until philosophers are kings … cities will never have rest from their evils.","source":"Republic V","era":"Ancient Greece","tags":"politics; knowledge; power","prov":"T","status":"Verified as an exact ellipsized excerpt from Benjamin Jowett's translation of Republic V.","desc":"A sourced line concerning politics, knowledge, power, drawn from Republic V.","verification":"verified","source_url":"https://classics.mit.edu/Plato/republic.6.v.html","explanation":"Plato ties political disorder to a separation between governing power and philosophical understanding. The ellipsis is explicit because the original sentence contains a longer qualification about rulers acquiring the spirit and power of philosophy."},{"id":"Q0021","person":"Aristotle","quote":"We become just by doing just acts, temperate by doing temperate acts, brave by doing brave acts.","source":"Nicomachean Ethics II","era":"Ancient Greece","tags":"habit; character","prov":"T","status":"Verified against W. D. Ross translation, Nicomachean Ethics II.","desc":"A sourced line concerning habit, character, drawn from Nicomachean Ethics II.","verification":"verified","source_url":"https://classics.mit.edu/Aristotle/nicomachaen.2.ii.html","explanation":"Aristotle argues that character is formed through repeated action rather than possessed as an abstract idea. Practice does not merely express virtue; it helps produce the stable dispositions that make virtuous action easier and more characteristic."},{"id":"Q0022","person":"Aristotle","quote":"Man is by nature a political animal.","source":"Politics I","era":"Ancient Greece","tags":"politics; social nature","prov":"T","status":"Verified against the Perseus translation of Aristotle, Politics I.1253a.","desc":"A sourced line concerning politics, social nature, drawn from Politics I.","verification":"verified","source_url":"https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0058%3Abook%3D1%3Asection%3D1253a","explanation":"Aristotle means that human flourishing and distinctively human capacities develop inside organized social life. 'Political' here refers broadly to life in the polis, not modern partisan politics."},{"id":"Q0023","person":"Aristotle","quote":"The whole is something besides the parts.","source":"Metaphysics VIII","era":"Ancient Greece","tags":"systems; emergence","prov":"T","status":"Verified against W. D. Ross's translation of Metaphysics VIII.6.","desc":"A sourced line concerning systems, emergence, drawn from Metaphysics VIII.","verification":"verified","source_url":"https://classics.mit.edu/Aristotle/metaphysics.8.viii.html","explanation":"Aristotle's point is that a genuine whole is not merely an accidental heap of pieces; something accounts for the unity by which the parts constitute one thing. The line is useful as an early formulation of organization beyond enumeration of components."},{"id":"Q0024","person":"Aristotle","quote":"Nature does nothing in vain.","source":"De Anima","era":"Ancient Greece","tags":"nature; function","prov":"T","status":"Verified against W. D. Ross translation, De Anima III.","desc":"A sourced line concerning nature, function, drawn from De Anima.","verification":"verified","source_url":"https://classics.mit.edu/Aristotle/soul.3.iii.html","explanation":"Aristotle uses the principle to explain why natural capacities and organs should be understood functionally. It is a teleological claim: natural structures are intelligible in relation to the ends they serve."},{"id":"Q0025","person":"Aristotle","quote":"Men are good in but one way, but bad in many.","source":"Nicomachean Ethics II","era":"Ancient Greece","tags":"failure modes; ethics","prov":"T","status":"Verified against W. D. Ross's translation of Nicomachean Ethics II.6.","desc":"A sourced line concerning failure modes, ethics, drawn from Nicomachean Ethics II.","verification":"verified","source_url":"https://classics.mit.edu/Aristotle/nicomachaen.2.ii.html","explanation":"Aristotle describes successful ethical action as constrained while failure has many directions: one can miss through excess, defect, wrong timing, wrong object, or wrong manner. The structure resembles a many-mode failure problem."},{"id":"Q0026","person":"Xenophon","quote":"to rule men might be a task neither impossible nor even difficult, if one should only go about it in an intelligent manner.","source":"Xenophon, Cyropaedia I.1.3, Walter Miller translation","era":"Ancient Greece","tags":"leadership; governance","prov":"T","status":"Corrected to the exact Walter Miller translation in Perseus.","desc":"A sourced line concerning leadership, governance, drawn from Cyropaedia I.","verification":"verified","source_url":"https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0204%3Abook%3D1","explanation":"Xenophon introduces Cyrus as evidence against the pessimistic claim that human beings are intrinsically ungovernable. Rule becomes an intelligible practical problem: legitimacy, consent, incentives, character, and technique can make obedience possible."},{"id":"Q0027","person":"Thucydides","quote":"War is a violent teacher.","source":"Peloponnesian War III","era":"Ancient Greece","tags":"war; institutions","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning war, institutions, drawn from Peloponnesian War III.","verification":"pending"},{"id":"Q0028","person":"Thucydides / Athenian envoys","quote":"while the strong do what they can and the weak suffer what they must.","source":"Thucydides, Peloponnesian War V.89, 1910 translation","era":"Ancient Greece","tags":"power; realism","prov":"R","status":"Corrected to the exact Perseus/Dent-Dutton translation of the Athenian envoys' line in the Melian Dialogue.","desc":"A reported, fragmentary, or mediated saying concerning power, realism; useful for the idea and historical voice, with attribution context shown.","verification":"verified","source_url":"https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0200%3Abook%3D5%3Achapter%3D89%3Asection%3D1","explanation":"The Athenian envoys argue that appeals to justice have force only where power is sufficiently balanced. The sentence is dramatic speech assigned to the Athenians, not a neutral maxim endorsed by Thucydides himself."},{"id":"Q0029","person":"Herodotus / Croesus","quote":"In peace sons bury their fathers, in war fathers bury their sons.","source":"Herodotus, Histories I.87.4, A. D. Godley translation; speech of Croesus","era":"Ancient Greece","tags":"war; peace","prov":"R","status":"Transmission verified in Herodotus I.87.4; the words are literary speech assigned to Croesus, not a stenographic record.","desc":"A reported, fragmentary, or mediated saying concerning war, peace; useful for the idea and historical voice, with attribution context shown.","verification":"reported","source_url":"https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0126%3Abook%3D1%3Achapter%3D87%3Asection%3D4","explanation":"Croesus contrasts the normal order of generations in peace with its reversal in war. The image makes war's cost legible through family succession: conflict forces parents to bury children who would ordinarily outlive them."},{"id":"Q0030","person":"Epicurus","quote":"Death is nothing to us.","source":"Principal Doctrines 2","era":"Hellenistic","tags":"death; fear","prov":"T","status":"Verified against R. D. Hicks translation, Principal Doctrines 2.","desc":"A sourced line concerning death, fear, drawn from Principal Doctrines 2.","verification":"verified","source_url":"https://classics.mit.edu/Epicurus/princdoc.html","explanation":"Epicurus removes death from the domain of experienced harm: while we exist death is absent, and when death is present we no longer experience. The argument aims to dissolve anticipatory fear rather than deny the fact of mortality."},{"id":"Q0031","person":"Epicurus","quote":"It is impossible to live pleasantly without living wisely and well and justly.","source":"Principal Doctrines 5","era":"Hellenistic","tags":"ethics; flourishing","prov":"T","status":"Verified against R. D. Hicks translation, Principal Doctrines 5.","desc":"A sourced line concerning ethics, flourishing, drawn from Principal Doctrines 5.","verification":"verified","source_url":"https://classics.mit.edu/Epicurus/princdoc.html","explanation":"Epicurus rejects the idea that pleasure can be separated from prudence, justice, and sound judgment. A stable pleasant life is an organized way of living, not a sequence of impulsive satisfactions."},{"id":"Q0032","person":"Epicurus","quote":"Of all the means wisdom acquires for happiness, friendship is by far the most important.","source":"Principal Doctrines 27","era":"Hellenistic","tags":"friendship; happiness","prov":"T","status":"Verified against R. D. Hicks translation, Principal Doctrines 27.","desc":"A sourced line concerning friendship, happiness, drawn from Principal Doctrines 27.","verification":"verified","source_url":"https://classics.mit.edu/Epicurus/princdoc.html","explanation":"For Epicurus, friendship is not ornamental to the good life; it is one of its strongest sources of security and durable pleasure. The line places social trust inside a philosophy often caricatured as private hedonism."},{"id":"Q0033","person":"Diogenes","quote":"I am a citizen of the world.","source":"Diogenes Laërtius VI","era":"Hellenistic","tags":"cosmopolitanism","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning cosmopolitanism; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0034","person":"Diogenes","quote":"Stand out of my sunlight.","source":"Reported encounter with Alexander","era":"Hellenistic","tags":"independence; power","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning independence, power; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0035","person":"Euclid","quote":"there was no royal road to geometry.","source":"Proclus, Commentary on Euclid's Elements, reporting Euclid's reply to Ptolemy","era":"Hellenistic","tags":"learning; mathematics","prov":"R","status":"Transmission verified through Proclus as reproduced by the University of St Andrews MacTutor history; anecdotal rather than contemporary.","desc":"A reported, fragmentary, or mediated saying concerning learning, mathematics; useful for the idea and historical voice, with attribution context shown.","verification":"reported","source_url":"https://mathshistory.st-andrews.ac.uk/Extras/Proclus_history_geometry/","explanation":"The anecdote denies that rank can exempt a learner from the structure of a subject. Geometry imposes the same chain of definitions, propositions, and proof on a king as on anyone else."},{"id":"Q0036","person":"Archimedes","quote":"Give me a place to stand and I will move the earth.","source":"Pappus, Synagoge, reporting Archimedes on the lever","era":"Hellenistic","tags":"leverage; mechanics","prov":"R","status":"Transmission verified as an ancient report associated with Pappus, documented by MacTutor; not a surviving sentence from Archimedes' own works.","desc":"A reported, fragmentary, or mediated saying concerning leverage, mechanics; useful for the idea and historical voice, with attribution context shown.","verification":"reported","source_url":"https://mathshistory.st-andrews.ac.uk/Biographies/Archimedes/quotations/","explanation":"The boast dramatizes mechanical advantage: sufficiently favorable leverage can make a small force move an enormous load. It survives because it also generalizes cleanly to strategic leverage—position can matter more than raw strength."},{"id":"Q0037","person":"Cleanthes","quote":"Lead me, Zeus, and you, Destiny, wherever you have assigned me.","source":"Hymn / preserved by Epictetus","era":"Hellenistic","tags":"fate; acceptance","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning fate, acceptance; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0038","person":"Polybius","quote":"This is the regular cycle of constitutional revolutions, and the natural order in which constitutions change, are transformed, and return again to their original stage.","source":"Polybius, Histories VI.9, Evelyn S. Shuckburgh translation","era":"Hellenistic","tags":"cycles; political systems","prov":"T","status":"Expanded to the exact complete sentence in the Perseus Shuckburgh translation.","desc":"A sourced line concerning cycles, political systems, drawn from Histories VI.","verification":"verified","source_url":"https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0234%3Abook%3D6%3Achapter%3D9","explanation":"Polybius models political constitutions dynamically rather than as fixed categories. Regimes develop characteristic forms of corruption that generate successor regimes, producing a recurrent cycle that he uses as a framework for political diagnosis."},{"id":"Q0039","person":"Confucius","quote":"Is it not pleasant to learn with a constant perseverance and application?","source":"Analects 1.1","era":"Ancient China","tags":"learning; practice","prov":"T","status":"Corrected to James Legge translation, Analects 1.1, Chinese Text Project.","desc":"A sourced line concerning learning, practice, drawn from Analects 1.1.","verification":"verified","source_url":"https://ctext.org/analects/xue-er","explanation":"The opening of the Analects links learning to repeated practice rather than passive acquisition. Knowledge becomes durable and usable through return, rehearsal, and application."},{"id":"Q0040","person":"Confucius","quote":"When you know a thing, to hold that you know it; and when you do not know a thing, to allow that you do not know it - this is knowledge.","source":"Analects 2.17","era":"Ancient China","tags":"metacognition; knowledge","prov":"T","status":"Corrected to James Legge translation, Analects 2.17, Chinese Text Project.","desc":"A sourced line concerning metacognition, knowledge, drawn from Analects 2.17.","verification":"verified","source_url":"https://ctext.org/analects/wei-zheng/ens","explanation":"Confucius defines knowledge partly through calibration: intellectual competence includes accurate awareness of the boundary between what one knows and what one does not."},{"id":"Q0041","person":"Confucius","quote":"When I walk along with two others, they may serve me as my teachers.","source":"Analects 7.22","era":"Ancient China","tags":"learning; humility","prov":"T","status":"Verified against James Legge translation of Analects 7.22, Chinese Text Project.","desc":"A sourced line concerning learning, humility, drawn from Analects 7.22.","verification":"verified","source_url":"https://ctext.org/dictionary.pl?did=5068&if=en","explanation":"Learning is presented as an observational habit rather than dependence on formal masters. Other people supply both positive examples to emulate and negative examples through which to inspect oneself."},{"id":"Q0042","person":"Laozi","quote":"the journey of a thousand li commenced with a single step.","source":"Dao De Jing 64","era":"Ancient China","tags":"process; beginning","prov":"T","status":"Corrected to James Legge translation, Dao De Jing 64.","desc":"A sourced line concerning process, beginning, drawn from Dao De Jing 64.","verification":"verified","source_url":"https://sacred-texts.com/tao/sbe39/sbe39071.htm","explanation":"The line places large outcomes inside processes whose beginnings can be extremely small. It is less a slogan about optimism than an observation about accumulation: scale emerges from sequences of modest actions."},{"id":"Q0043","person":"Laozi","quote":"He who knows other men is discerning; he who knows himself is intelligent.","source":"Dao De Jing 33","era":"Ancient China","tags":"self-knowledge","prov":"T","status":"Corrected to James Legge translation, Dao De Jing 33, Chinese Text Project.","desc":"A sourced line concerning self-knowledge, drawn from Dao De Jing 33.","verification":"verified","source_url":"https://ctext.org/dao-de-jing/ens","explanation":"The contrast ranks self-knowledge differently from social perception. Reading others is a form of discernment; understanding one's own motives, limits, and attachments requires a more difficult inward intelligence."},{"id":"Q0044","person":"Sun Tzu","quote":"All warfare is based on deception.","source":"Art of War I","era":"Ancient China","tags":"strategy; deception","prov":"T","status":"Verified against Lionel Giles translation, The Art of War I.18.","desc":"A sourced line concerning strategy, deception, drawn from Art of War I.","verification":"verified","source_url":"https://www.gutenberg.org/files/66706/66706-h/66706-h.htm","explanation":"Sun Tzu treats misleading the opponent's model of reality as a basic instrument of strategy. Deception matters because decisions are made from perceived positions, intentions, strengths, and timings rather than from omniscient knowledge."},{"id":"Q0045","person":"Sun Tzu","quote":"Supreme excellence consists in breaking the enemy’s resistance without fighting.","source":"Art of War III","era":"Ancient China","tags":"strategy; efficiency","prov":"T","status":"Verified against Lionel Giles translation, The Art of War III.2.","desc":"A sourced line concerning strategy, efficiency, drawn from Art of War III.","verification":"verified","source_url":"https://www.gutenberg.org/files/17405/17405-h/17405-h.htm","explanation":"The objective of strategy is not combat for its own sake but obtaining the desired political or military result at the lowest necessary cost. Destroying resistance without battle preserves resources and reduces uncertainty."},{"id":"Q0046","person":"Sun Tzu","quote":"If you know the enemy and know yourself, you need not fear the result of a hundred battles.","source":"Art of War III","era":"Ancient China","tags":"information; strategy","prov":"T","status":"Corrected to exact Lionel Giles translation, The Art of War III.18.","desc":"A sourced line concerning information, strategy, drawn from Art of War III.","verification":"verified","source_url":"https://dev.gutenberg.org/cache/epub/17405/pg17405-images.html","explanation":"Sun Tzu makes strategic confidence conditional on information about both sides of an interaction. Misjudging either the opponent or one's own capacities creates systematic blind spots; knowing both sharply reduces avoidable surprise."},{"id":"Q0047","person":"Mencius","quote":"The people are the most important element in a nation; the spirits of the land and grain are the next; the sovereign is the lightest.","source":"Mencius 7B14","era":"Ancient China","tags":"politics; legitimacy","prov":"T","status":"Corrected to James Legge translation, Mencius 7B14, Chinese Text Project.","desc":"A sourced line concerning politics, legitimacy, drawn from Mencius 7B14.","verification":"verified","source_url":"https://ctext.org/mengzi/jin-xin-ii/zhs","explanation":"Mencius reverses a simple ruler-first hierarchy by placing the population above dynastic authority. Political legitimacy is treated as dependent on the people and the social order the ruler is supposed to maintain."},{"id":"Q0048","person":"Mozi","quote":"If every one in the world will love universally; states not attacking one another; houses not disturbing one another;","source":"Universal Love","era":"Ancient China","tags":"cooperation; conflict","prov":"T","status":"Corrected to the W. P. Mei translation presented by the Chinese Text Project, Universal Love I.","desc":"A sourced line concerning cooperation, conflict, drawn from Universal Love.","verification":"verified","source_url":"https://ctext.org/mozi/universal-love-i","explanation":"Mozi treats partial concern as a mechanism that scales from interpersonal harm to conflict among houses and states. Universal concern is offered as a structural remedy: if agents regard others' persons, families, and states as they regard their own, predatory incentives diminish."},{"id":"Q0049","person":"Zhuangzi","quote":"Where can I find a man who has forgotten words so I can have a word with him?","source":"Zhuangzi 26","era":"Ancient China","tags":"language; abstraction","prov":"T","status":"Pending source-quality upgrade: wording may be correct, but the current supporting link is below the corpus's evidence standard.","desc":"A sourced line concerning language, abstraction, drawn from Zhuangzi 26.","verification":"pending","source_url":"https://en.wikiquote.org/wiki/Zhuangzi","explanation":"The joke rests on the instrumental status of language. Words are tools for reaching meaning; once meaning is grasped, attachment to the verbal vehicle can itself become an obstacle.","prior_verification":"verified"},{"id":"Q0050","person":"Xunzi","quote":"Learning must never cease.","source":"Encouraging Learning","era":"Ancient China","tags":"education; discipline","prov":"T","status":"Verified as the English rendering attached to Xunzi's 'Encouragement of Learning' in Chinese Text Project.","desc":"A sourced line concerning education, discipline, drawn from Encouraging Learning.","verification":"verified","source_url":"https://ctext.org/wiki.pl?chapter=409707&if=en&remap=gb","explanation":"Xunzi begins from the premise that cultivation has no natural stopping point. Learning changes capacities and conduct through sustained external practice rather than merely revealing what was already complete within the learner."},{"id":"Q0051","person":"Han Feizi","quote":"Law does not favor the noble; a plumb line does not bend for crookedness.","source":"Han Feizi","era":"Ancient China","tags":"institutions; law","prov":"T","status":"Corrected to the English rendering of Han Feizi, 'Youdu,' in the Chinese Text Project.","desc":"A sourced line concerning institutions, law, drawn from Han Feizi.","verification":"verified","source_url":"https://ctext.org/wiki.pl?chapter=793285&if=gb","explanation":"The image joins law to an impersonal measuring instrument. A rule worthy of the name should not change its standard when the person being measured has status or power."},{"id":"Q0052","person":"Bhagavad Gita","quote":"Thy business is with the action only, never with its fruits; so let not the fruit of action be thy motive, nor be thou to inaction attached.","source":"Bhagavad Gita 2.47","era":"Ancient India","tags":"action; attachment","prov":"T","status":"Pending source-quality upgrade: wording may be correct, but the current supporting link is below the corpus's evidence standard.","desc":"A sourced line concerning action, attachment, drawn from Bhagavad Gita 2.47.","verification":"pending","source_url":"https://www.swaveda.com/texts/bhagavad-gita/2/","explanation":"The verse separates action from ownership of outcomes. It does not command indifference to consequences; it attacks attachment to results as the motive that governs action, while equally rejecting withdrawal into inaction.","prior_verification":"verified"},{"id":"Q0053","person":"Dhammapada","quote":"For hatred does not cease by hatred at any time: hatred ceases by love, this is an old rule.","source":"Dhammapada 5","era":"Ancient India","tags":"conflict; ethics","prov":"T","status":"Corrected to F. Max Müller's published translation of Dhammapada 5.","desc":"A sourced line concerning conflict, ethics, drawn from Dhammapada 5.","verification":"verified","source_url":"https://sacred-texts.com/bud/sbe10/sbe1003.htm","explanation":"The verse models hostility as a self-reinforcing process: answering hatred with hatred reproduces the mechanism that generated the conflict. Breaking the cycle requires a response that does not replicate it."},{"id":"Q0054","person":"Brihadaranyaka Upanishad","quote":"Lead me from the unreal to the real! Lead me from darkness to light! Lead me from death to immortality!","source":"1.3.28","era":"Ancient India","tags":"knowledge; transcendence","prov":"T","status":"Expanded to F. Max Müller's published translation of Brihadaranyaka Upanishad 1.3.28.","desc":"A sourced line concerning knowledge, transcendence, drawn from 1.3.28.","verification":"verified","source_url":"https://sacred-texts.com/hin/sbe15/sbe15054.htm","explanation":"The three movements—unreal to real, darkness to light, death to immortality—form a compact map of spiritual transformation from ignorance and transience toward knowledge and what is taken to be enduring reality."},{"id":"Q0055","person":"Kautilya","quote":"In the happiness of his subjects lies his happiness; in their welfare his welfare; whatever pleases himself he shall not consider as good, but whatever pleases his subjects he shall consider as good.","source":"Arthashastra I.19","era":"Ancient India","tags":"governance; incentives","prov":"T","status":"Expanded and verified against the published English translation of Arthashastra I.19 on Wikisource.","desc":"A sourced line concerning governance, incentives, drawn from Arthashastra I.19.","verification":"verified","source_url":"https://en.wikisource.org/wiki/Arthashastra/Book_I","explanation":"Kautilya grounds the ruler's interest in the condition of the ruled. The formulation is not democratic in the modern sense, but it makes political durability depend on aligning sovereign incentives with public welfare."},{"id":"Q0056","person":"Ashoka","quote":"All men are my children; and, just as I desire for my children that they may enjoy every kind of prosperity and happiness both in this world and in the next, so also I desire the same for all men.","source":"Kalinga Edict","era":"Ancient India","tags":"governance; duty","prov":"T","status":"Expanded and verified in the English translation of Ashoka's Kalinga edict tradition on Wikisource.","desc":"A sourced line concerning governance, duty, drawn from Kalinga Edict.","verification":"verified","source_url":"https://en.wikisource.org/wiki/Asoka_-_the_Buddhist_Emperor_of_India/Chapter_4","explanation":"Ashoka casts kingship in paternal language: political authority creates obligations of care rather than merely rights of command. The statement belongs to his post-Kalinga program of moralized imperial governance."},{"id":"Q0057","person":"Tirukkural","quote":"In flesh by fire inflamed, nature may thoroughly heal the sore; In soul by tongue inflamed, the ulcer healeth never more.","source":"Kural 129","era":"Ancient India","tags":"speech; consequence","prov":"T","status":"Pending source-quality upgrade: wording may be correct, but the current supporting link is below the corpus's evidence standard.","desc":"A sourced line concerning speech, consequence, drawn from Kural 129.","verification":"pending","source_url":"https://indiankanoon.org/doc/151684342/","explanation":"The couplet contrasts bodily injury with reputational and emotional injury caused by speech. Its exaggeration makes a durable social point: verbal harm can persist through memory and relationship after physical wounds close.","prior_verification":"verified"},{"id":"Q0058","person":"Terence","quote":"I am a man, I hold that what affects another man affects me.","source":"Heauton Timorumenos","era":"Roman Republic","tags":"humanism","prov":"T","status":"Pending source-quality upgrade: wording may be correct, but the current supporting link is below the corpus's evidence standard.","desc":"A sourced line concerning humanism, drawn from Heauton Timorumenos.","verification":"pending","source_url":"https://en.wikiquote.org/wiki/Heauton_Timorumenos","explanation":"In the play Chremes uses the line to justify taking an interest in another man's affairs. Later readers universalized it into a humanist maxim, but its dramatic origin is a defense of involvement rather than an abstract declaration of sympathy.","prior_verification":"verified"},{"id":"Q0059","person":"Cicero","quote":"History is truly the witness of times past, the light of truth, the life of memory, the teacher of life, the messenger of antiquity; whose voice, but the orator's, can entrust her to immortality?","source":"De Oratore II","era":"Roman Republic","tags":"history; truth","prov":"T","status":"Pending source-quality upgrade: wording may be correct, but the current supporting link is below the corpus's evidence standard.","desc":"A sourced line concerning history, truth, drawn from De Oratore II.","verification":"pending","source_url":"https://en.wikiquote.org/wiki/Tully","explanation":"Cicero treats history as an active civic resource rather than a warehouse of old facts. Memory of past action informs judgment in the present, but that memory reaches later generations only through acts of narration and rhetoric.","prior_verification":"verified"},{"id":"Q0060","person":"Cicero","quote":"the life of the dead is set in the memory of the living.","source":"Philippics IX","era":"Roman Republic","tags":"memory; legacy","prov":"T","status":"Corrected to Walter C. A. Ker's published translation of Philippic IX.5.","desc":"A sourced line concerning memory, legacy, drawn from Philippics IX.","verification":"verified","source_url":"https://www.attalus.org/cicero/philippic9.html","explanation":"Cicero is arguing that public remembrance can restore a form of civic life to a statesman who died in service. Memory functions here as political immortality: a community preserves a person by continuing to hold his actions in view."},{"id":"Q0061","person":"Cicero","quote":"Above all, the search after truth and its eager pursuit are peculiar to man.","source":"De Officiis I","era":"Roman Republic","tags":"truth; knowledge","prov":"T","status":"Verified against Project Gutenberg, De Officiis I.13.","desc":"A sourced line concerning truth, knowledge, drawn from De Officiis I.","verification":"verified","source_url":"https://www.gutenberg.org/files/47001/47001-h/47001-h.htm","explanation":"Cicero treats curiosity and the pursuit of truth as characteristically human capacities. Knowledge-seeking is not merely instrumental; it belongs to his account of what human nature itself is drawn toward."},{"id":"Q0062","person":"Julius Caesar","quote":"All Gaul is divided into three parts","source":"Gallic War I.1","era":"Roman Republic","tags":"history; reference","prov":"T","status":"Verified as an exact opening clause of the Project Gutenberg translation of Caesar's Gallic War I.1.","desc":"A sourced line concerning history, reference, drawn from Gallic War I.1.","verification":"verified","source_url":"https://www.gutenberg.org/cache/epub/10657/pg10657.html","explanation":"The sentence is culturally famous partly because generations of Latin students encountered Caesar through this opening. Its apparent neutrality also exemplifies Caesar's controlled third-person narrative style in a work that serves political self-presentation as well as history."},{"id":"Q0063","person":"Julius Caesar","quote":"I came, I saw, I conquered,","source":"Suetonius, Life of Julius Caesar 37.2, J. C. Rolfe translation","era":"Roman Republic","tags":"victory; compression","prov":"R","status":"Transmission verified in Suetonius: the three words were displayed in Caesar's Pontic triumph; English wording follows J. C. Rolfe.","desc":"A reported, fragmentary, or mediated saying concerning victory, compression; useful for the idea and historical voice, with attribution context shown.","verification":"reported","source_url":"https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Suetonius/12Caesars/Julius%2A.html","explanation":"The three parallel clauses compress Caesar's victory over Pharnaces into arrival, perception, and completion. Suetonius says the inscription emphasized the extraordinary speed of the campaign rather than merely naming the victory."},{"id":"Q0064","person":"Julius Caesar","quote":"The die is cast,","source":"Suetonius, Life of Julius Caesar 32.1, J. C. Rolfe translation","era":"Roman Republic","tags":"commitment; irreversibility","prov":"R","status":"Transmission verified in Suetonius 32.1; this is a later literary report of Caesar at the Rubicon.","desc":"A reported, fragmentary, or mediated saying concerning commitment, irreversibility; useful for the idea and historical voice, with attribution context shown.","verification":"reported","source_url":"https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Suetonius/12Caesars/Julius%2A.html","explanation":"The metaphor marks an irreversible commitment under uncertainty. Once Caesar crosses the Rubicon, the political gamble can no longer be recalled; subsequent outcomes must be managed from inside the decision."},{"id":"Q0065","person":"Sallust","quote":"For harmony makes small states great, while the mightiest are undone by discord.","source":"Jugurthine War 10","era":"Roman Republic","tags":"coordination; systems","prov":"T","status":"Pending source-quality upgrade: wording may be correct, but the current supporting link is below the corpus's evidence standard.","desc":"A sourced line concerning coordination, systems, drawn from Jugurthine War 10.","verification":"pending","source_url":"https://dokumen.pub/printers-devices-in-the-polish-lithuanian-commonwealth-iconographic-sources-and-ideological-content-9004679596-9789004679597.html","explanation":"Micipsa's maxim treats internal coordination as a force multiplier and internal conflict as a destroyer of scale. The mechanism is systemic: cohesion can compensate for small size, while division can squander large resources.","prior_verification":"verified"},{"id":"Q0066","person":"Virgil","quote":"Fortune befriends the bold.","source":"Virgil, Aeneid X, John Dryden translation","era":"Augustan Rome","tags":"risk; action","prov":"T","status":"Verified against John Dryden's 1697 public-domain translation of Aeneid X.","desc":"A sourced line concerning risk, action, drawn from Aeneid X.","verification":"verified","source_url":"https://en.wikisource.org/wiki/Aeneid_%28Dryden%29/Book_X","explanation":"Turnus uses the line to push his men toward decisive action at a favorable moment. In context it is battlefield exhortation: opportunity rewards those willing to exploit it before the enemy stabilizes."},{"id":"Q0067","person":"Virgil","quote":"An hour will come, with pleasure to relate Your sorrows past, as benefits of Fate.","source":"Aeneid I","era":"Augustan Rome","tags":"adversity; memory","prov":"T","status":"Pending source-quality upgrade: wording may be correct, but the current supporting link is below the corpus's evidence standard.","desc":"A sourced line concerning adversity, memory, drawn from Aeneid I.","verification":"pending","source_url":"https://wist.info/virgil/50565/","explanation":"Aeneas tries to make present suffering tolerable by placing it inside a future narrative. Distance can transform pain into memory, meaning, or even evidence of endurance, though the speech also hides Aeneas's own private grief.","prior_verification":"verified"},{"id":"Q0068","person":"Horace","quote":"seize the day, trusting the future as little as possible.","source":"Odes I.11","era":"Augustan Rome","tags":"time; mortality","prov":"T","status":"Corrected to the literal English translation of Horace, Odes I.11, on Wikisource.","desc":"A sourced line concerning time, mortality, drawn from Odes I.11.","verification":"verified","source_url":"https://en.wikisource.org/wiki/Translation%3AOdes_%28Horace%29/Book_I/11","explanation":"Carpe diem is not simply a command to maximize immediate pleasure. Horace contrasts the shortness and uncertainty of life with long-range hopes that depend on an unknowable future, urging attention to what can actually be used now."},{"id":"Q0069","person":"Horace","quote":"Captive Greece took captive her fierce conqueror, and introduced her arts into rude Latium.","source":"Epistles II","era":"Augustan Rome","tags":"culture; conquest","prov":"T","status":"Corrected to the published English translation of Horace, Epistles II.1 on Wikisource.","desc":"A sourced line concerning culture, conquest, drawn from Epistles II.","verification":"verified","source_url":"https://en.wikisource.org/wiki/The_works_of_Horace/Second_Book_of_Epistles","explanation":"Military conquest runs in one direction while cultural conquest runs in the other. Rome defeated Greece politically, yet Greek literature, art, and education transformed Roman elite culture."},{"id":"Q0070","person":"Ovid","quote":"Everything must change: but nothing perishes.","source":"Metamorphoses XV","era":"Augustan Rome","tags":"change; transformation","prov":"T","status":"Corrected to Brookes More's 1922 translation of Ovid, Metamorphoses XV.","desc":"A sourced line concerning change, transformation, drawn from Metamorphoses XV.","verification":"verified","source_url":"https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.02.0028%3Abook%3D15%3Acard%3D153","explanation":"Ovid's Pythagoras describes transformation without annihilation: forms change while the underlying continuity of nature persists. The line belongs to a larger argument about transmigration and perpetual metamorphosis."},{"id":"Q0071","person":"Ovid","quote":"A drop hollows the stone, a ring is consumed by use,","source":"Epistulae ex Ponto","era":"Augustan Rome","tags":"persistence; accumulation","prov":"T","status":"Pending source-quality upgrade: wording may be correct, but the current supporting link is below the corpus's evidence standard.","desc":"A sourced line concerning persistence, accumulation, drawn from Epistulae ex Ponto.","verification":"pending","source_url":"https://readancienttexts.com/ovid/ex_ponto/4","explanation":"Ovid uses wear as evidence that persistence can overcome hardness through repetition rather than force. The image is autobiographical too: repeated letters from exile are his own attempt to wear down an apparently immovable political decision.","prior_verification":"verified"},{"id":"Q0072","person":"Seneca","quote":"It is not that we have a short space of time, but that we waste much of it.","source":"On the Shortness of Life","era":"Roman Empire","tags":"time; discipline","prov":"T","status":"Corrected to the exact John W. Basore translation on Wikisource, On the Shortness of Life I.","desc":"A sourced line concerning time, discipline, drawn from On the Shortness of Life.","verification":"verified","source_url":"https://en.wikisource.org/wiki/On_the_shortness_of_life/Chapter_I","explanation":"Seneca's thesis shifts the scarcity problem from lifespan to allocation. Much of what feels like a shortage of time is, in his account, a failure to take ownership of how finite attention and life are spent."},{"id":"Q0073","person":"Seneca","quote":"There are more things, Lucilius, likely to frighten us than there are to crush us; we suffer more often in imagination than in reality.","source":"Letters 13","era":"Roman Empire","tags":"fear; cognition","prov":"T","status":"Expanded to Richard M. Gummere's exact translation of Moral Letters 13.4.","desc":"A sourced line concerning fear, cognition, drawn from Letters 13.","verification":"verified","source_url":"https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_13","explanation":"Seneca distinguishes actual damage from anticipatory simulation. A mind that repeatedly rehearses feared futures can impose costs before reality has imposed any."},{"id":"Q0074","person":"Seneca","quote":"When a man does not know what harbour he is making for, no wind is the right wind.","source":"Letters","era":"Roman Empire","tags":"goals; strategy","prov":"T","status":"Corrected to Richard M. Gummere's published translation, Moral Letters 71.3.","desc":"A sourced line concerning goals, strategy, drawn from Letters.","verification":"verified","source_url":"https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_71","explanation":"Without a destination there is no criterion for judging whether circumstances are favorable. Seneca's image is therefore about goal specification: direction converts events from mere chance into useful or obstructive conditions."},{"id":"Q0075","person":"Quintilian","quote":"a liar should have a good memory.","source":"Institutio Oratoria","era":"Roman Empire","tags":"deception; cognition","prov":"T","status":"Verified against H. E. Butler's Loeb translation of Quintilian, Institutio Oratoria IV.2.91.","desc":"A sourced line concerning deception, cognition, drawn from Institutio Oratoria.","verification":"verified","source_url":"https://penelope.uchicago.edu/Thayer/e/roman/texts/quintilian/institutio_oratoria/4b%2A.html","explanation":"Quintilian's point is practical rather than admiring: falsehood creates a bookkeeping burden. Truth is naturally consistent with itself; invented stories require the speaker to remember every earlier invention to avoid contradiction."},{"id":"Q0076","person":"Tacitus / Calgacus","quote":"where they make a desert, they call it peace.","source":"Tacitus, Agricola 30, Oxford Translation; speech assigned to Calgacus","era":"Roman Empire","tags":"empire; rhetoric","prov":"R","status":"Transmission verified in Tacitus's Agricola 30 through a public-domain Oxford translation; the speech is Tacitus's literary representation of Calgacus.","desc":"A reported, fragmentary, or mediated saying concerning empire, rhetoric; useful for the idea and historical voice, with attribution context shown.","verification":"reported","source_url":"https://elfinspell.com/ClassicalTexts/TacitusAgricola/Part3.html","explanation":"Tacitus gives Calgacus an anti-imperial inversion: conquest destroys the conditions of resistance and then names the resulting emptiness 'peace.' The line is evidence for Roman literary critique of empire, not a recoverable verbatim Caledonian speech."},{"id":"Q0077","person":"Juvenal","quote":"your prayer must be that you may have a sound mind in a sound body.","source":"Juvenal, Satire X, Lewis Evans translation","era":"Roman Empire","tags":"health; cultural reference","prov":"T","status":"Expanded to the exact sentence in the Project Gutenberg translation of Juvenal's Satire X.","desc":"A sourced line concerning health, cultural reference, drawn from Satire X.","verification":"verified","source_url":"https://www.gutenberg.org/files/50657/50657-h/50657-h","explanation":"Juvenal's larger satire mocks conventional prayers for wealth, beauty, power, and long life by showing how they can become destructive. A healthy mind in a healthy body appears as a deliberately modest alternative to grander but dangerous desires."},{"id":"Q0078","person":"Epictetus","quote":"Some things are in our control and others not.","source":"Enchiridion 1","era":"Roman Empire","tags":"control; stoicism","prov":"T","status":"Verified against Elizabeth Carter's translation of Enchiridion 1.","desc":"A sourced line concerning control, stoicism, drawn from Enchiridion 1.","verification":"verified","source_url":"https://classics.mit.edu/Epictetus/epicench.html","explanation":"Epictetus opens by drawing a hard boundary between what depends on our own judgments and actions and what does not. Stoic practice begins by refusing to stake inner freedom on outcomes governed by external causes."},{"id":"Q0079","person":"Epictetus","quote":"No man is free who is not master of himself.","source":"Discourses / sayings tradition","era":"Roman Empire","tags":"freedom; self-command","prov":"R","status":"Pending source audit of reported/fragmentary attribution; not admitted to trusted training until the cited transmission is checked.","desc":"A reported, fragmentary, or mediated saying concerning freedom, self-command; useful for the idea and historical voice, with attribution context shown.","verification":"pending","prior_verification":"reported"},{"id":"Q0080","person":"Epictetus","quote":"You may be unconquerable, if you enter into no combat in which it is not in your control to conquer.","source":"Enchiridion 19","era":"Roman Empire","tags":"game selection; strategy","prov":"T","status":"Verified against Elizabeth Carter's translation of Enchiridion 19.","desc":"A sourced line concerning game selection, strategy, drawn from Enchiridion 19.","verification":"verified","source_url":"https://classics.mit.edu/Epictetus/epicench.html","explanation":"The strategic implication is game selection: invulnerability is possible only when success is defined in terms of variables you actually control. Choosing contests whose outcome depends on status or external judgment makes defeat structurally possible."},{"id":"Q0081","person":"Plotinus","quote":"Withdraw into yourself and look.","source":"Enneads I.6.9","era":"Late Antiquity","tags":"introspection","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning introspection, drawn from Enneads I.6.9.","verification":"pending"},{"id":"Q0082","person":"Ecclesiastes","quote":"Vanity of vanities, saith the Preacher, vanity of vanities; all is vanity.","source":"Ecclesiastes 1:2, KJV","era":"Biblical","tags":"transience; mortality","prov":"T","status":"Corrected to the complete KJV text of Ecclesiastes 1:2.","desc":"A sourced line concerning transience, mortality, drawn from Ecclesiastes 1:2, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Ecclesiastes+1%3A2&version=KJV","explanation":"Ecclesiastes opens by naming the transience and elusiveness of human striving. The KJV's 'vanity' translates the Hebrew hebel, whose concrete image is vapor or breath: something real enough to perceive, but impossible to hold."},{"id":"Q0083","person":"Ecclesiastes","quote":"there is no new thing under the sun.","source":"Ecclesiastes 1:9, KJV","era":"Biblical","tags":"recurrence; novelty","prov":"T","status":"Verified as an exact concluding clause of Ecclesiastes 1:9, KJV.","desc":"A sourced line concerning recurrence, novelty, drawn from Ecclesiastes 1:9, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/verse/en/Ecclesiastes1%3A9","explanation":"The line places human novelty against recurring patterns of desire, labor, generation, and loss. It is deliberately sweeping and rhetorical, emphasizing recurrence rather than claiming that no new artifact or event can ever occur."},{"id":"Q0084","person":"Proverbs","quote":"The fear of the Lord is the beginning of knowledge.","source":"Proverbs 1:7, KJV","era":"Biblical","tags":"knowledge; wisdom","prov":"T","status":"Verified as an exact first-clause excerpt of Proverbs 1:7 in the King James Version.","desc":"A sourced line concerning knowledge, wisdom, drawn from Proverbs 1:7, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Proverbs%201%3A7&version=KJV","explanation":"The proverb grounds knowledge in a prior orientation of reverence and humility. Its structure says that intellectual life begins not with self-sufficiency but with recognition of an order larger than oneself."},{"id":"Q0085","person":"Jesus, Gospel tradition","quote":"For what shall it profit a man, if he shall gain the whole world, and lose his own soul?","source":"Mark 8:36, KJV","era":"Biblical","tags":"ends; values","prov":"T","status":"Corrected to the complete KJV wording of Mark 8:36.","desc":"A sourced line concerning ends, values, drawn from Mark 8:36, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Mark+8%3A36&version=KJV","explanation":"The question contrasts maximal external acquisition with catastrophic loss of the self's ultimate good. It is a compact warning against optimizing an instrumental objective while destroying the end for which the objective mattered."},{"id":"Q0086","person":"Jesus, Gospel tradition","quote":"Wherefore by their fruits ye shall know them.","source":"Matthew 7:20, KJV","era":"Biblical","tags":"outcomes; judgment","prov":"T","status":"Corrected to the complete KJV wording of Matthew 7:20.","desc":"A sourced line concerning outcomes, judgment, drawn from Matthew 7:20, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=Matthew+7%3A20&version=KJV","explanation":"The criterion is behavioral and consequential: claims and appearances are tested by what they produce. In context Jesus is warning about false prophets, so observable 'fruit' is evidence about an agent whose outward presentation may deceive."},{"id":"Q0087","person":"Paul","quote":"For now we see through a glass, darkly;","source":"1 Corinthians 13:12, KJV","era":"Biblical","tags":"epistemic limits","prov":"T","status":"Verified as the exact opening clause of 1 Corinthians 13:12, KJV.","desc":"A sourced line concerning epistemic limits, drawn from 1 Corinthians 13:12, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=1Cor.+13%3A12&version=KJV","explanation":"Paul contrasts present partial perception with a future condition of direct knowledge. The phrase became a durable metaphor for epistemic limitation: our models may disclose reality without making it fully transparent."},{"id":"Q0088","person":"Paul","quote":"When I was a child, I spake as a child, I understood as a child, I thought as a child:","source":"1 Corinthians 13:11, KJV","era":"Biblical","tags":"development","prov":"T","status":"Expanded to the exact opening clause of 1 Corinthians 13:11, KJV.","desc":"A sourced line concerning development, drawn from 1 Corinthians 13:11, KJV.","verification":"verified","source_url":"https://www.biblegateway.com/passage/?search=1+Corinthians+13%3A11&version=KJV","explanation":"Paul uses childhood and adulthood to model transformation in understanding. The point is not contempt for children but the expectation that a more developed state leaves earlier modes of thought behind."},{"id":"Q0089","person":"Lucretius","quote":"Nothing from nothing ever yet was born.","source":"De Rerum Natura I","era":"Roman Republic","tags":"causality; naturalism","prov":"T","status":"Verified against William Ellery Leonard's translation of De Rerum Natura I.","desc":"A sourced line concerning causality, naturalism, drawn from De Rerum Natura I.","verification":"verified","source_url":"https://classics.mit.edu/Carus/nature_things.1.i.html","explanation":"Lucretius uses the principle to block supernatural creation from nothing and to force explanation toward persistent material constituents and lawful transformations."},{"id":"Q0090","person":"Qur’an","quote":"But lo! with hardship goeth ease,","source":"Qur’an 94:5, M. M. Pickthall translation","era":"Islamic","tags":"adversity","prov":"T","status":"Corrected to M. M. Pickthall's public-domain translation of Qur’an 94:5.","desc":"A sourced line concerning adversity, drawn from Qur’an 94:5–6.","verification":"verified","source_url":"https://www.sacred-texts.com/isl/pick/094.htm","explanation":"The verse places ease alongside hardship rather than merely after it, and the next verse repeats the formulation. The repetition frames difficulty as a condition that does not exhaust the possibilities present within experience."},{"id":"Q0091","person":"Qur’an","quote":"There is no compulsion in religion.","source":"Qur’an 2:256, M. M. Pickthall translation","era":"Islamic","tags":"religion; coercion","prov":"T","status":"Verified against M. M. Pickthall's public-domain translation of Qur’an 2:256.","desc":"A sourced line concerning religion, coercion, drawn from Qur’an 2:256.","verification":"verified","source_url":"https://archive.sacred-texts.com/isl/pick/002.htm","explanation":"The verse rejects coercion in religion immediately after declaring that right direction has become distinct from error. Its legal and theological interpretation has a long history, but the textual clause itself is direct and unambiguous."},{"id":"Q0092","person":"Muhammad, hadith tradition","quote":"Actions are but by the intention and every man will have but that which he intended.","source":"Hadith of ‘Umar, transmitted in Sahih al-Bukhari 1 and parallel collections","era":"Islamic","tags":"intention; ethics","prov":"R","status":"Expanded to the exact English wording shown for the hadith transmission on Sunnah.com; attribution remains hadith transmission rather than contemporaneous recording.","desc":"A reported, fragmentary, or mediated saying concerning intention, ethics; useful for the idea and historical voice, with attribution context shown.","verification":"reported","source_url":"https://sunnah.com/search?q=Actions+are+judged+by+niyy%C4%81t+%28intentions%29%2C+so+each+man+will+have+what+he+intended.+Thus%2C+he+whose+Hijrah+%28migration%29+is+for+Allah+and+His+Messenger%2C+his+migration+is+for+Allah+and+His+Messenger%3B+but+he+whose+migration+is+for+some+worldly+thing+he+might+gain%2C+or+for+a+wife+he+may+marry%2C+his+migration+is+for+that+which+he+migrated%E2%80%9D","explanation":"The saying makes intention morally constitutive of action: outwardly similar acts can differ because the ends that organize them differ. The migration example that follows makes motive part of the identity of the deed, not merely a private accompaniment."},{"id":"Q0093","person":"Ali ibn Abi Talib","quote":"People are enemies of what they do not know.","source":"Nahj al-Balagha, Saying 172 in this English edition","era":"Islamic","tags":"ignorance; hostility","prov":"R","status":"Transmission verified in the English Nahj al-Balagha edition on Al-Islam.org; this remains a later compiled attribution to ‘Ali.","desc":"A reported, fragmentary, or mediated saying concerning ignorance, hostility; useful for the idea and historical voice, with attribution context shown.","verification":"reported","source_url":"https://al-islam.org/sw/node/20908","explanation":"The maxim identifies ignorance as a source of hostility: novelty or incomprehension can be mistaken for error or threat. Its practical implication is epistemic—investigate what seems strange before converting unfamiliarity into opposition."},{"id":"Q0094","person":"Augustine","quote":"our heart is restless, until it repose in Thee.","source":"Confessions I.1","era":"Late Antiquity","tags":"desire; transcendence","prov":"T","status":"Corrected to Edward B. Pusey's public-domain translation of Confessions I.1.","desc":"A sourced line concerning desire, transcendence, drawn from Confessions I.1.","verification":"verified","source_url":"https://www.ccel.org/a/augustine/confess/cache/confess.html3","explanation":"Augustine interprets human desire as structurally restless when directed toward finite goods as final ends. The sentence announces the Confessions' governing account of desire: the self remains unsettled until its loves are ordered toward God."},{"id":"Q0095","person":"Augustine","quote":"Love, and do what you will:","source":"Homilies on 1 John","era":"Late Antiquity","tags":"love; ethics","prov":"T","status":"Verified as an exact clause in Augustine, Homily 7 on First John, section 8.","desc":"A sourced line concerning love, ethics, drawn from Homilies on 1 John.","verification":"verified","source_url":"https://www.newadvent.org/fathers/170207.htm","explanation":"Detached from context the sentence can sound permissive; Augustine means nearly the opposite. The surrounding passage says actions are judged by the root of charity, so a will genuinely formed by love should generate conduct consistent with that love."},{"id":"Q0096","person":"Boethius","quote":"nothing is wretched, but thinking makes it so, and conversely every lot is happy if borne with equanimity.","source":"Consolation of Philosophy II","era":"Late Antiquity","tags":"appraisal; suffering","prov":"T","status":"Replaced the modernized maxim with H. R. James's exact public-domain translation of The Consolation of Philosophy II.","desc":"A sourced line concerning appraisal, suffering, drawn from Consolation of Philosophy II.","verification":"verified","source_url":"https://www.gutenberg.org/files/14328/14328-h/14328-h.htm","explanation":"Lady Philosophy argues that external fortune does not mechanically determine misery or happiness; appraisal and inner orientation mediate the experience of circumstances. The claim is intentionally strong and belongs to a therapy aimed at loosening Boethius's dependence on Fortune."},{"id":"Q0097","person":"Benedict of Nursia","quote":"Idleness is the enemy of the soul;","source":"Rule of Saint Benedict, Chapter 48, 'Of the Daily Work'","era":"Medieval","tags":"discipline; work","prov":"T","status":"Verified against the English Rule of Saint Benedict at Christian Classics Ethereal Library.","desc":"A sourced line concerning discipline, work, drawn from Rule of Saint Benedict 48.","verification":"verified","source_url":"https://ccel.org/ccel/benedict/rule/rule.l.html","explanation":"The Rule treats disciplined occupation as protection against spiritual and social drift. Work and reading are arranged not as productivity for its own sake but as a rhythm that keeps the monastic community from dissolving into idleness and distraction."},{"id":"Q0098","person":"Anselm","quote":"For I do not seek to understand that I may believe, but I believe in order to understand.","source":"Anselm, Proslogion I","era":"Medieval","tags":"faith; epistemology","prov":"T","status":"Corrected to the exact English sentence in the Fordham Medieval Sourcebook edition of the Proslogion.","desc":"A sourced line concerning faith, epistemology, drawn from Proslogion I.","verification":"verified","source_url":"https://sourcebooks.web.fordham.edu/basis/anselm-proslogium.asp","explanation":"Anselm presents reason and faith as sequentially cooperative rather than mutually exclusive. Belief supplies the standpoint from which inquiry begins; understanding is then pursued as a deepening of what is already trusted."},{"id":"Q0099","person":"Al-Kindi","quote":"We ought not to be ashamed of acknowledging truth from whatever source it comes to us.","source":"On First Philosophy","era":"Islamic Golden Age","tags":"truth; intellectual openness","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning truth, intellectual openness, drawn from On First Philosophy.","verification":"pending"},{"id":"Q0100","person":"Ibn al-Haytham","quote":"The seeker after truth questions what he gathers from books.","source":"Doubts Concerning Ptolemy","era":"Islamic Golden Age","tags":"science; criticism","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning science, criticism, drawn from Doubts Concerning Ptolemy.","verification":"pending"},{"id":"Q0101","person":"Avicenna","quote":"The knowledge of anything is not complete unless its causes are known.","source":"Metaphysical writings","era":"Islamic Golden Age","tags":"causality; knowledge","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning causality, knowledge, drawn from Metaphysical writings.","verification":"pending"},{"id":"Q0102","person":"Al-Ghazali","quote":"Knowledge without action is insanity, and action without knowledge is vanity.","source":"Letter to a Disciple","era":"Islamic Golden Age","tags":"knowledge; action","prov":"T","status":"Selected; source wording to verify","desc":"A sourced line concerning knowledge, action, drawn from Letter to a Disciple.","verification":"pending"},{"id":"Q0103","person":"Omar Khayyam / Edward FitzGerald","quote":"The Moving Finger writes; and, having writ, Moves on:","source":"Edward FitzGerald, Rubáiyát of Omar Khayyám, First Edition, quatrain LI","era":"Medieval / Victorian rendering","tags":"time; irreversibili
